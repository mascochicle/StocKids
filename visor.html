<script>
/* ===== visor.js ===== */
/*
 * Visor — el motor del dinero de verdad.
 *
 * OJO: esto NO es el simulador. StocKids corre 12x y vive de historia vieja para que el niño
 * alcance a ver una década. Aquí el dinero es real y el tiempo corre 1 a 1: un día es un día,
 * una semana es una semana. Por eso este archivo NO usa `tiempo.js` ni tiene ancla ni ritmo:
 * la fecha de hoy sale del calendario, como en cualquier otra parte de la vida.
 *
 * Se mantiene la disciplina de MasMoney y de StocKids: NO SE GUARDA NINGÚN SALDO. Se guarda
 * la lista de movimientos —lo único que de verdad pasó— y todo lo demás se deriva. Un saldo
 * guardado es un saldo que un día se desincroniza y nadie sabe cuál de los dos es el bueno.
 */

const Visor = (() => {
  'use strict';

  const MS_DIA = 24 * 60 * 60 * 1000;

  /* --- decodificar lo horneado ------------------------------------------- */

  /* "1a.-3.5" -> [46, 43, 48]. Mismo formato que motor/datos.js. */
  function descomprimir(texto, salida) {
    let valor = 0, i = 0, inicio = 0;
    const n = texto.length;
    for (let p = 0; p <= n; p++) {
      if (p !== n && texto[p] !== '.') continue;
      valor += parseInt(texto.slice(inicio, p), 36);
      salida[i++] = valor;
      inicio = p + 1;
    }
    return salida;
  }

  const cuantos = (texto) => {
    if (!texto) return 0;
    let n = 1;
    for (let i = 0; i < texto.length; i++) if (texto[i] === '.') n++;
    return n;
  };

  const aMs = (iso) => {
    const [a, m, d] = iso.split('-').map(Number);
    return Date.UTC(a, m - 1, d);
  };

  const aISO = (ms) => new Date(ms).toISOString().slice(0, 10);

  function preparar(crudo) {
    const instrumentos = crudo.instrumentos.map(inst => {
      const n = cuantos(inst.dias);
      const dias = descomprimir(inst.dias, new Int32Array(n));
      const usd = descomprimir(inst.usd, new Int32Array(n));   // centavos de dólar
      const mxn = descomprimir(inst.mxn, new Int32Array(n));   // centavos de peso
      const baseMs = aMs(inst.base);

      const listo = {
        ...inst, n, dias, usd, mxn, baseMs,
        fechaMs: (i) => baseMs + dias[i] * MS_DIA,
        fecha: (i) => aISO(baseMs + dias[i] * MS_DIA),
        precioUSD: (i) => usd[i] / 100,
        precioMXN: (i) => mxn[i] / 100,

        /*
         * El índice del último día CON PRECIO en o antes de `iso`. Los precios solo existen
         * en días hábiles: si preguntan por un domingo hay que contestar con el viernes, no
         * con un hueco. Devuelve -1 si la fecha es anterior a que el fondo existiera.
         */
        indiceDe(iso) {
          const objetivo = Math.round((aMs(iso) - baseMs) / MS_DIA);
          if (objetivo < dias[0]) return -1;
          let bajo = 0, alto = n - 1, mejor = -1;
          while (bajo <= alto) {
            const medio = (bajo + alto) >> 1;
            if (dias[medio] <= objetivo) { mejor = medio; bajo = medio + 1; }
            else alto = medio - 1;
          }
          return mejor;
        },
      };
      return listo;
    });

    return {
      generado: crudo.generado,
      // Pesos. Se dice explícito porque StocKids está en dólares y son pestañas de la misma
      // app: sin marcarlo se comparan cifras que no se pueden comparar.
      moneda: crudo.moneda || 'MXN',
      fxUltimo: crudo.fxUltimo,
      fxFecha: crudo.fxFecha,
      instrumentos,
      de: (clave) => instrumentos.find(i => i.clave === clave) || instrumentos[0],
    };
  }

  /* --- el estado ---------------------------------------------------------- */

  const nuevo = (nombre, instrumento) => ({ nombre, instrumento, movimientos: [] });

  const TIPOS = { dep: 'Depósito', ret: 'Retiro', compra: 'Compra', venta: 'Venta' };

  /*
   * Los movimientos se ordenan por fecha SIEMPRE, porque se pueden capturar tarde: Marco
   * puede acordarse el martes de una compra del viernes. Si el orden dependiera de cuándo se
   * tecleó, la gráfica saldría con escalones al revés.
   *
   * El desempate es el orden en que se capturaron: dos cosas el mismo día se quedan como
   * las metió. Por eso el `sort` va sobre pares [movimiento, posición] y no sobre el arreglo
   * pelón — `Array.sort` promete ser estable, pero decirlo aquí es más barato que confiar.
   */
  function enOrden(movimientos) {
    return movimientos
      .map((m, i) => [m, i])
      .sort((a, b) => (a[0].f < b[0].f ? -1 : a[0].f > b[0].f ? 1 : a[1] - b[1]))
      .map(([m]) => m);
  }

  /* --- validar ------------------------------------------------------------ */

  /*
   * Devuelve un texto con el problema, o null si el movimiento se puede meter. Se valida
   * contra la foto de ESE día, no contra la de hoy: vender el martes lo que se compró el
   * jueves es un error aunque hoy sí las tenga.
   */
  function revisar(estado, inst, mov) {
    if (!mov || !TIPOS[mov.t]) return 'Tipo de movimiento desconocido.';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(mov.f || '')) return 'Falta la fecha.';

    if (inst && inst.indiceDe(mov.f) < 0)
      return `Ese día todavía no existía ${inst.clave}. El primero fue el ${inst.fecha(0)}.`;

    const antes = calcular(estado, inst, mov.f);

    if (mov.t === 'dep' || mov.t === 'ret') {
      if (!(mov.monto > 0)) return 'El monto tiene que ser mayor que cero.';
      if (mov.t === 'ret' && mov.monto > antes.efectivo + 0.005)
        return `Ese día solo había ${dinero(antes.efectivo)} sin invertir.`;
      return null;
    }

    if (!(mov.titulos > 0)) return 'Los títulos tienen que ser más que cero.';
    if (!(mov.precio > 0)) return 'El precio tiene que ser mayor que cero.';

    // En el SIC se compran TÍTULOS COMPLETOS, no fracciones. Es la razón por la que el
    // precio por título importa tanto al escoger el ETF: con SPYL N a ~$340 cada aportación
    // compra algo; con CSPX N a ~$14,280 el dinero se quedaría parado meses.
    if (Math.abs(mov.titulos - Math.round(mov.titulos)) > 1e-9)
      return 'En el SIC se compran títulos completos, no fracciones.';

    if (mov.comision != null && !(mov.comision >= 0)) return 'La comisión no puede ser negativa.';

    if (mov.t === 'compra') {
      // Con la comisión adentro: si no, dejaría pasar una compra que en la vida real no cabe.
      const com = mov.comision || 0;
      const cuesta = mov.titulos * mov.precio + com;
      if (cuesta > antes.efectivo + 0.005)
        return `Cuesta ${dinero(cuesta)}${com ? ' con comisión' : ''} y ese día solo había ` +
               `${dinero(antes.efectivo)}.`;
      return null;
    }

    if (mov.titulos > antes.titulos + 1e-9)
      return `Ese día solo tenía ${antes.titulos} ${antes.titulos === 1 ? 'título' : 'títulos'}.`;
    return null;
  }

  function agregar(estado, inst, mov) {
    const error = revisar(estado, inst, mov);
    if (error) return { ok: false, error, estado };
    return {
      ok: true,
      error: null,
      estado: { ...estado, movimientos: enOrden([...estado.movimientos, mov]) },
    };
  }

  function quitar(estado, posicion) {
    const movimientos = estado.movimientos.filter((_, i) => i !== posicion);
    return { ...estado, movimientos };
  }

  /* --- derivar ------------------------------------------------------------ */

  /*
   * La foto de la cartera al cierre de `iso`. TODO sale de aquí; no hay ningún saldo guardado
   * en ninguna parte.
   *
   * `precioHoy` permite pasar un precio de fuera —el que sale de multiplicar el dólar en vivo
   * por el tipo de cambio del día— para que el valor no se quede clavado en el último precio
   * horneado. Si no se pasa, se usa el horneado.
   */
  function calcular(estado, inst, iso, precioHoy) {
    let depositado = 0, retirado = 0, efectivo = 0, titulos = 0, costo = 0;
    let comprado = 0, vendido = 0, comisiones = 0;

    /*
     * ⚠️ DE QUIÉN ES EL DINERO — contabilidad por UNIDADES, como un fondo.
     *
     * Son tres personas en una sola cuenta y aportan en momentos distintos. Repartir en
     * proporción a lo aportado sería INJUSTO: el que entró antes compró más barato, y esa
     * ventaja es suya, no del bote. Con dos hermanos, alguno lo va a notar.
     *
     * Cada aportación compra participaciones al valor de ESE día:
     *
     *     unidades compradas = monto / (valor de la cuenta ÷ unidades que ya había)
     *
     * La primera aportación define la unidad en 1.00. De ahí en adelante, si el dinero se
     * duplicó, la misma cantidad compra la mitad de unidades — que es exactamente lo justo.
     * Cada quien se lleva `sus unidades × valor de la unidad hoy`, sin importar cuándo entró.
     *
     * Hay prueba con el caso que lo demuestra: A mete 1,000, el precio se duplica, B mete
     * 1,000. A se queda con dos tercios y TODA la ganancia; B con un tercio y cero. Repartir
     * por lo aportado le habría regalado a B la mitad de lo que ganó A.
     */
    let unidades = 0;
    const porQuien = new Map();
    const deQuien = (quien) => {
      const k = quien || 'Sin nombre';
      if (!porQuien.has(k)) porQuien.set(k, { aportado: 0, unidades: 0 });
      return porQuien.get(k);
    };

    /* El valor de la cuenta justo ANTES de aplicar el movimiento de ese día. */
    const valorEn = (f) => {
      const i = inst ? inst.indiceDe(f) : -1;
      return efectivo + titulos * (i >= 0 ? inst.precioMXN(i) : 0);
    };

    /* Convierte dinero en participaciones al valor del día. `signo` -1 para retiros. */
    const mover = (m, signo) => {
      const antes = valorEn(m.f);
      const valorUnidad = (unidades > 1e-12 && antes > 1e-12) ? antes / unidades : 1;
      const u = signo * m.monto / valorUnidad;
      unidades += u;
      const q = deQuien(m.quien);
      q.aportado += signo * m.monto;
      q.unidades += u;
    };

    for (const m of enOrden(estado.movimientos)) {
      if (m.f > iso) break;
      if (m.t === 'dep') { mover(m, 1); depositado += m.monto; efectivo += m.monto; }
      else if (m.t === 'ret') { mover(m, -1); retirado += m.monto; efectivo -= m.monto; }
      else if (m.t === 'compra') {
        /*
         * ⚠️ LA COMISIÓN VA ADENTRO DEL COSTO, no aparte. GBM cobra 0.25% + IVA en el SIC:
         * en la primera compra de verdad fueron $7.42 sobre un título de $2,558. Si no se
         * contara, el efectivo del visor se desviaría de la app de GBM en cada compra y el
         * visor dejaría de ser confiable — que es lo único que tiene que ser.
         *
         * Y adentro del costo, no como gasto suelto, porque eso es: lo que de verdad te costó
         * tener ese título. Así la ganancia sale contra lo que pagaste completo.
         */
        const com = m.comision || 0;
        const cuesta = m.titulos * m.precio + com;
        efectivo -= cuesta; titulos += m.titulos; costo += cuesta; comprado += cuesta;
        comisiones += com;
      } else if (m.t === 'venta') {
        const com = m.comision || 0;
        const entra = m.titulos * m.precio - com;      // al vender también cobran
        // El costo se baja EN PROPORCIÓN a lo vendido (costo promedio). Si se restara lo que
        // costaron aquellas en particular habría que llevar lotes, y para un niño que compra
        // una vez al mes eso es complejidad sin lección.
        const parte = titulos > 0 ? m.titulos / titulos : 0;
        costo -= costo * parte;
        efectivo += entra; titulos -= m.titulos; vendido += entra;
        comisiones += com;
      }
    }

    const i = inst ? inst.indiceDe(iso) : -1;
    const precio = precioHoy != null ? precioHoy : (i >= 0 ? inst.precioMXN(i) : 0);
    const valor = titulos * precio;
    const total = valor + efectivo;
    const metido = depositado - retirado;

    return {
      fecha: iso,
      indice: i,
      precio,
      titulos,
      valor,
      efectivo,
      total,
      depositado,
      retirado,
      metido,
      costo,
      // Lo que pagó en promedio por cada título que TODAVÍA tiene.
      promedio: titulos > 0 ? costo / titulos : 0,
      comprado,
      vendido,
      comisiones,          // lo que se ha llevado el bróker, en total
      unidades,
      // Lo que vale una participación hoy. Arranca en 1.00 y sube o baja con la cuenta: es el
      // rendimiento de la cartera limpio de aportaciones, la cifra que un fondo publica.
      valorUnidad: unidades > 1e-12 ? total / unidades : 1,
      /*
       * De quién es el dinero, de mayor a menor. `valor` es lo que le tocaría HOY y `ganancia`
       * lo que ganó o perdió — cada uno con su propia historia de precios, no con un promedio
       * del bote. La suma de los `valor` es el total; la de las `parte`, 1. Hay prueba.
       */
      quienes: [...porQuien.entries()]
        .map(([quien, q]) => {
          const vu = unidades > 1e-12 ? total / unidades : 1;
          const valor = q.unidades * vu;
          return {
            quien,
            monto: q.aportado,          // lo que puso, neto de retiros
            unidades: q.unidades,
            parte: unidades > 1e-12 ? q.unidades / unidades : 0,
            valor,
            ganancia: valor - q.aportado,
            gananciaPct: q.aportado > 0 ? ((valor / q.aportado) - 1) * 100 : 0,
          };
        })
        .sort((a, b) => b.valor - a.valor),
      // Contra lo METIDO, nunca contra el primer depósito: si no, meter dinero se vería como
      // ganancia y sería mentira. Misma regla que en StocKids.
      ganancia: total - metido,
      gananciaPct: metido > 0 ? ((total - metido) / metido) * 100 : 0,
    };
  }

  /* La serie del valor total, un punto por cada índice pedido. Para la gráfica. */
  const serieValor = (estado, inst, indices, precioHoy, hasta) =>
    indices.map(i => {
      const iso = inst.fecha(i);
      const usar = (hasta != null && i >= hasta) ? precioHoy : undefined;
      return calcular(estado, inst, iso, usar).total;
    });

  /* La serie de lo que metió. Es la línea que contesta "¿voy ganando?" sin hacer cuentas. */
  const serieMetido = (estado, inst, indices) =>
    indices.map(i => calcular(estado, inst, inst.fecha(i)).metido);

  /* --- presentar ---------------------------------------------------------- */

  const dinero = (n) => {
    const signo = n < 0 ? '-' : '';
    return signo + '$' + Math.abs(n).toLocaleString('es-MX',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun',
                 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  const comoTexto = (iso) => {
    const [a, m, d] = iso.split('-').map(Number);
    return `${d} de ${MESES[m - 1]} de ${a}`;
  };

  /*
   * Hoy en la zona del aparato, NO en UTC. `toISOString()` en México devuelve el día de
   * mañana después de las 6 de la tarde, y una compra capturada en la noche saldría con
   * fecha equivocada.
   */
  function hoyISO(ahora = new Date()) {
    const y = ahora.getFullYear();
    const m = String(ahora.getMonth() + 1).padStart(2, '0');
    const d = String(ahora.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  return {
    MS_DIA, TIPOS,
    preparar, nuevo, enOrden, revisar, agregar, quitar,
    calcular, serieValor, serieMetido,
    dinero, comoTexto, hoyISO, aMs, aISO,
  };
})();

if (typeof module !== 'undefined') module.exports = Visor;

</script>
<script>
/* ===== grafica.js ===== */
/*
 * StocKids — la gráfica.
 *
 * Dibuja la historia VIVIDA. Nunca el futuro: aunque los precios de los próximos años estén
 * horneados en el archivo, `dibujar` tira todo índice mayor que `hasta` y no hay forma de
 * pedirle más. La regla vive aquí adentro, no en el que llama.
 *
 * ⚠️ NADA DE MEDIR PÍXELES. Todo se dibuja en el sistema de coordenadas del `viewBox` y el
 * SVG se estira solo con `width:100%`. Así se esquiva de raíz la trampa #2 de MasMoney
 * (`zoom` rompe las unidades). Para el dedo, la conversión de pantalla a coordenadas se hace
 * con `getScreenCTM().inverse()`, que respeta cualquier escala.
 *
 * ⚠️ EL CSS TIENE QUE RESPETAR LA PROPORCIÓN:
 *
 *     svg { width: 100%; aspect-ratio: 320 / 180; }     <- ANCHO / ALTO
 *
 * Con `preserveAspectRatio="none"` y una altura fija en píxeles, X y Y se escalan distinto y
 * **la tipografía sale estirada**. Pasó el 15-ago-2026: 458×200 daba escala 1.43 contra 1.11,
 * o sea letras 29% más anchas. Hay una prueba que lo caza.
 */

const Grafica = (() => {
  'use strict';

  const ANCHO = 320, ALTO = 180;
  const LETRA = 8;    // en unidades del viewBox; a 480 px de ancho salen ~12 px reales
  const M = { arriba: 14, derecha: 8, abajo: 18, izquierda: 34 };
  const X0 = M.izquierda, X1 = ANCHO - M.derecha;
  const Y0 = M.arriba, Y1 = ALTO - M.abajo;

  const SVG = 'http://www.w3.org/2000/svg';
  const crear = (tag, attrs = {}) => {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  /* --- las tres vistas: diaria, semanal y mensual ------------------------- */

  /*
   * Las pidió Marco el 15-ago-2026, y no son solo un zoom: cambian el TAMAÑO del paso y la
   * VENTANA a la vez, igual que en una app de bolsa de verdad.
   *
   *   día     un punto por día hábil, últimos ~3 meses. Se ve el zangoloteo.
   *   semana  un punto por semana, últimos ~2 años. Se ve la tendencia.
   *   mes     un punto por mes, TODA la historia que haya. Se ven las crisis enteras.
   *
   * `paso` va en días hábiles (5 = una semana, 21 ≈ un mes). Trabajar en días hábiles y no
   * en el calendario evita huecos raros por fines de semana y feriados.
   */
  /*
   * ⚠️ LAS VENTANAS ESTÁN CALIBRADAS PARA VELAS, no para líneas. Una línea aguanta 200
   * puntos; una vela con 200 en pantalla queda de un píxel y no se lee. El tope cómodo son
   * ~45-75 velas: a 480 px de ancho eso da cuerpos de 4 a 7 px.
   *
   * "Todo" va por trimestres justo por eso: 18.6 años en velas mensuales serían 223 velas
   * de un pelo, y en trimestrales son 74 que sí se ven.
   */
  const VISTAS = {
    dia:    { etiqueta: 'Día',    paso: 1,  ventana: 44 },     // ~2 meses
    semana: { etiqueta: 'Semana', paso: 5,  ventana: 260 },    // ~1 año
    mes:    { etiqueta: 'Mes',    paso: 21, ventana: 1260 },   // ~5 años
    todo:   { etiqueta: 'Todo',   paso: 63, ventana: Infinity },  // trimestres
  };

  /*
   * Los índices a dibujar. Se cuenta HACIA ATRÁS desde el último día para que el punto de
   * hoy caiga siempre exacto: contando hacia adelante, el precio de hoy podría quedar entre
   * dos puntos y la línea terminaría en un valor viejo.
   */
  function muestreo(primero, ultimo, vista) {
    const v = VISTAS[vista] || VISTAS.dia;
    const arranca = v.ventana === Infinity
      ? primero : Math.max(primero, ultimo - v.ventana + 1);
    const indices = [];
    for (let i = ultimo; i >= arranca; i -= v.paso) indices.push(i);
    if (indices[indices.length - 1] !== arranca) indices.push(arranca);
    return indices.reverse();
  }

  const vistasDisponibles = () =>
    Object.entries(VISTAS).map(([clave, v]) => ({ clave, etiqueta: v.etiqueta }));

  /*
   * Los índices de una ventana cualquiera, con el paso ajustado solo para que no se
   * amontonen. Es lo que usa el arrastre y el pellizco: la ventana es libre, y aquí se
   * decide si cada vela vale un día, una semana o un trimestre.
   */
  const MAX_VELAS = 70;
  function muestreoVentana(desde, hasta, maxVelas = MAX_VELAS) {
    const ancho = Math.max(1, hasta - desde + 1);
    const paso = Math.max(1, Math.ceil(ancho / maxVelas));
    const indices = [];
    for (let i = hasta; i >= desde; i -= paso) indices.push(i);
    if (indices[indices.length - 1] !== desde) indices.push(desde);
    return indices.reverse();
  }

  /* La ventana que le toca a cada chip, para poder volver a ella tras haber arrastrado. */
  function ventanaDe(vista, primero, ultimo) {
    const v = VISTAS[vista] || VISTAS.dia;
    const ancho = v.ventana === Infinity ? ultimo - primero + 1 : v.ventana;
    return { desde: Math.max(primero, ultimo - ancho + 1), hasta: ultimo };
  }

  /* --- escalas ------------------------------------------------------------ */

  /* Redondea hacia arriba a 1, 2, 2.5 o 5 por potencia de diez: los números que una persona
     lee de un vistazo. */
  function pasoBonito(bruto) {
    const potencia = Math.pow(10, Math.floor(Math.log10(bruto)));
    const n = bruto / potencia;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * potencia;
  }

  function escalaY(min, max, rayas = 4) {
    if (max - min < 1e-9) { min -= 1; max += 1; }
    const paso = pasoBonito((max - min) / rayas);
    const piso = Math.floor(min / paso) * paso;
    const techo = Math.ceil(max / paso) * paso;
    const marcas = [];
    for (let v = piso; v <= techo + paso / 2; v += paso) marcas.push(v);
    return { piso, techo, marcas };
  }

  /*
   * Dinero corto, para que quepa en el eje: $1.2k, $470k, $0.48.
   *
   * ⚠️ Los centavos IMPORTAN. NVIDIA en 2009 cuesta $0.48 porque se partió 40 veces, y
   * redondeando a enteros el eje entero decía "$1 $1 $1 $0 $0 $0" — seis etiquetas y ningún
   * dato. Lo cachó Marco el 16-ago-2026 con una captura.
   */
  function corto(n, decimales) {
    const a = Math.abs(n);
    if (a >= 1e6) return `$${(n / 1e6).toFixed(a >= 1e7 ? 0 : 1)}M`;
    if (a >= 1000) return `$${(n / 1000).toFixed(a >= 10000 ? 0 : 1)}k`;
    // Todo el eje lleva los MISMOS decimales, que se deciden por el salto entre rayas y no
    // por cada número: "$1.0" junto a "$0.20" se ve descuidado.
    if (decimales != null) return `$${n.toFixed(decimales)}`;
    if (a >= 10 || a === 0) return `$${Math.round(n)}`;
    return `$${n.toFixed(a >= 1 ? 1 : 2)}`;
  }

  /* Cuántos decimales pide un eje cuyas rayas van de `paso` en `paso`. */
  const decimalesDe = (paso) => paso >= 10 ? 0 : paso >= 1 ? 1 : paso >= 0.1 ? 2 : 3;

  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun',
    'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  /* --- dibujar ------------------------------------------------------------ */

  /*
   *  contenedor  el <svg> donde va
   *  indices     qué días dibujar (de `muestreo`)
   *  hasta       el último día VIVIDO. Aquí muere el futuro, pase lo que pase.
   *  fecha       (i) -> 'YYYY-MM-DD'
   *  series      [{nombre, valor:(i)=>number, clase, punteada}]
   *
   * Devuelve un objeto con `marcar(pos)` para el dedo.
   */
  function dibujar(contenedor, { indices, hasta, ventana, fecha, series }) {
    // Aquí muere el futuro: nadie de aquí para abajo ve un dato de después de `hasta`.
    const vistos = indices.filter(i => i <= hasta);
    if (!vistos.length) vistos.push(hasta);
    const fin = vistos.length - 1;

    /*
     * ⚠️ El eje horizontal va por la VENTANA, no por los puntos dibujados. Si la ventana se
     * pasa del día de hoy, ese pedazo se queda VACÍO en vez de estirar las velas para llenar
     * el ancho. Es lo que pidió Marco el 16-ago-2026 señalando el "espacio sin precio" de
     * TradingView: poder correr la gráfica y dejar aire a la derecha.
     *
     * Y sigue sin enseñar el futuro: en ese hueco no se dibuja nada porque no hay nada.
     */
    const v0 = ventana ? Math.min(ventana.desde, vistos[0]) : vistos[0];
    const v1 = ventana ? Math.max(ventana.hasta, vistos[fin]) : vistos[fin];

    contenedor.setAttribute('viewBox', `0 0 ${ANCHO} ${ALTO}`);
    contenedor.setAttribute('preserveAspectRatio', 'none');
    contenedor.replaceChildren();

    const valores = series.map(s => vistos.map(s.valor));
    let min = Infinity, max = -Infinity;
    for (const fila of valores) for (const v of fila) {
      if (v < min) min = v;
      if (v > max) max = v;
    }
    // La escala tiene que dar cabida a las MECHAS, no solo a los cierres: si no, la vela del
    // día más movido sale cortada por arriba.
    for (const s of series) {
      if (!s.velas) continue;
      for (let i = 0; i <= fin; i++) {
        const v = s.velas(vistos[i], i === 0 ? vistos[i] : vistos[i - 1] + 1);
        if (!v) continue;
        if (v.bajo < min) min = v.bajo;
        if (v.alto > max) max = v.alto;
      }
    }
    const { piso, techo, marcas } = escalaY(min, max);

    // `x` recibe un DÍA, no una posición del arreglo.
    const x = d => v1 === v0 ? X0 : X0 + ((d - v0) / (v1 - v0)) * (X1 - X0);
    const y = v => Y1 - ((v - piso) / (techo - piso)) * (Y1 - Y0);

    /* rayas horizontales con su cifra */
    const decs = marcas.length > 1 ? decimalesDe(marcas[1] - marcas[0]) : null;
    for (const v of marcas) {
      const py = y(v);
      contenedor.append(
        crear('line', { class: 'raya', x1: X0, x2: X1, y1: py, y2: py }),
        // El tamaño va como atributo, no solo en CSS: el módulo tiene que verse bien aunque
        // quien lo use se olvide de darle estilo. El CSS puede sobreescribirlo.
        Object.assign(crear('text', {
          class: 'ejeDinero', x: X0 - 4, y: py + 3,
          'font-size': LETRA, 'text-anchor': 'end',
        }), { textContent: corto(v, decs) }));
    }

    /* Marcas de tiempo abajo. Si el tramo abarca más de dos años se rotula por año; si no,
       por mes: en la vista de día, doce "2026" seguidos no dicen nada. */
    const primera = fecha(vistos[0]), ultima = fecha(vistos[fin]);
    const porAnio = (+ultima.slice(0, 4) - +primera.slice(0, 4)) >= 2;
    let previo = null;
    for (let i = 0; i <= fin; i++) {
      const f = fecha(vistos[i]);
      const clave = porAnio ? f.slice(0, 4) : f.slice(0, 7);
      if (clave === previo) continue;
      previo = clave;
      if (i === 0 && fin > 8) continue;              // el primero se encima con el eje
      const texto = porAnio ? clave : MESES[+f.slice(5, 7) - 1];
      const px = x(vistos[i]);
      contenedor.append(
        crear('line', { class: 'raya tenue', x1: px, x2: px, y1: Y0, y2: Y1 }),
        Object.assign(crear('text', {
          class: 'ejeTiempo', x: px, y: ALTO - 5,
          'font-size': LETRA, 'text-anchor': 'middle',
        }), { textContent: texto }));
    }

    /*
     * Velas. Cada una es un tramo: del punto anterior hasta este. El cuerpo va de la
     * apertura al cierre y la mecha del mínimo al máximo. Verde si cerró arriba de donde
     * abrió, rojo si abajo — que es como se leen en cualquier app de bolsa.
     */
    const velas = series.find(s => s.velas);
    if (velas) {
      // El ancho sale del hueco entre dos velas EN DÍAS, no de repartir la pantalla: con
      // espacio vacío a la derecha, repartir daría velas más anchas de la cuenta.
      const saltoDias = fin > 0 ? (vistos[fin] - vistos[0]) / fin : 1;
      const paso = (X1 - X0) * saltoDias / Math.max(1, v1 - v0);
      const ancho = Math.max(1.2, Math.min(paso * 0.62, 9));
      for (let i = 0; i <= fin; i++) {
        const v = velas.velas(vistos[i], i === 0 ? vistos[i] : vistos[i - 1] + 1);
        if (!v) continue;
        const sube = v.c >= v.a;
        const cx = x(vistos[i]);
        const yA = y(v.a), yC = y(v.c);
        contenedor.append(crear('line', {
          class: `mecha ${sube ? 'sube' : 'baja'}`,
          x1: cx, x2: cx, y1: y(v.alto), y2: y(v.bajo),
          'vector-effect': 'non-scaling-stroke',
        }));
        contenedor.append(crear('rect', {
          class: `cuerpo ${sube ? 'sube' : 'baja'}`,
          x: cx - ancho / 2, width: ancho,
          // Un cuerpo de altura cero desaparece: se le deja el mínimo para que se vea la raya
          // del día en que abrió y cerró igual.
          y: Math.min(yA, yC), height: Math.max(Math.abs(yA - yC), 0.6),
        }));
      }
    }

    /* las líneas, y un punto gordo al final de cada una */
    series.forEach((s, k) => {
      if (s.velas) return;                     // esa ya se dibujó como velas
      const d = valores[k].map((v, i) =>
        `${i ? 'L' : 'M'}${x(vistos[i]).toFixed(2)} ${y(v).toFixed(2)}`).join('');
      contenedor.append(crear('path', {
        class: `linea ${s.clase}`, d, 'vector-effect': 'non-scaling-stroke',
        ...(s.punteada ? { 'stroke-dasharray': '3 3' } : {}),
      }));
      contenedor.append(crear('circle', {
        class: `punta ${s.clase}`, cx: x(vistos[fin]), cy: y(valores[k][fin]), r: 2.5,
      }));
    });

    /* la línea del dedo, escondida hasta que la toquen */
    const guia = crear('line', { class: 'guia', y1: Y0, y2: Y1, visibility: 'hidden' });
    contenedor.append(guia);

    return {
      fin,
      dias: vistos,
      // De píxel a posición del arreglo, pasando por el DÍA: con hueco a la derecha las dos
      // cosas ya no son lo mismo.
      posEn(px) {
        const dia = v0 + ((px - X0) / (X1 - X0)) * (v1 - v0);
        let mejor = 0, cerca = Infinity;
        for (let i = 0; i <= fin; i++) {
          const d = Math.abs(vistos[i] - dia);
          if (d < cerca) { cerca = d; mejor = i; }
        }
        return mejor;
      },
      marcar(pos) {
        if (pos == null) { guia.setAttribute('visibility', 'hidden'); return null; }
        const p = Math.max(0, Math.min(pos, fin));
        guia.setAttribute('x1', x(vistos[p]));
        guia.setAttribute('x2', x(vistos[p]));
        guia.setAttribute('visibility', 'visible');
        return { dia: vistos[p], fecha: fecha(vistos[p]), valores: valores.map(v => v[p]) };
      },
    };
  }

  /*
   * Los gestos, como en TradingView (Marco mandó el video el 15-ago-2026):
   *
   *   arrastrar con un dedo   mueve la gráfica en el tiempo
   *   pellizcar con dos       acerca y aleja
   *   dejar el dedo quieto    saca la cruz para leer un día  (350 ms)
   *
   * Un solo `pointerdown` no sabe todavía si va a ser un arrastre o una lectura, así que se
   * espera: si en 350 ms el dedo no se movió, es lectura; si se movió antes, es arrastre.
   * Sin esa espera, cada intento de leer un precio movería la gráfica.
   *
   * ⚠️ Se convierte con `getScreenCTM().inverse()` en vez de restar `getBoundingClientRect()`:
   * así funciona con cualquier escala y no repite la trampa #2 de MasMoney.
   */
  const ESPERA_LECTURA = 350;      // ms quieto antes de que salga la cruz
  const MINIMO_VENTANA = 15;       // días: más cerca que esto ya no dice nada

  /*
   * ⚠️ `redibujar(ventana)` tiene que volver a dibujar SOBRE EL MISMO <svg> y devolver el
   * nuevo `pintado`. Si el que llama repinta la pantalla entera, el elemento que el dedo
   * venía agarrando desaparece a media caricia y el arrastre se queda en un solo paso.
   * Pasó el 15-ago-2026 y no se nota en una prueba de un solo movimiento.
   */
  function interactuar(svg, opciones) {
    const { limites, ventana: inicial, redibujar, alLeer } = opciones;
    let ventana = { ...inicial };
    let pintado = opciones.pintado;
    const alMover = (v) => {
      if (v.desde === ventana.desde && v.hasta === ventana.hasta) return;
      ventana = v;
      pintado = redibujar(v) || pintado;
    };
    const punto = svg.createSVGPoint();
    const enX = (ev) => {
      punto.x = ev.clientX; punto.y = ev.clientY;
      return punto.matrixTransform(svg.getScreenCTM().inverse()).x;
    };

    const dedos = new Map();          // pointerId -> x en coordenadas del viewBox
    let modo = null;                  // 'espera' | 'leer' | 'mover' | 'pellizco'
    let arranque = null, reloj = null;

    const ancho = () => ventana.hasta - ventana.desde + 1;
    /* Cuántos días vale un paso horizontal. Con la ventana chica, un dedo mueve poco. */
    const diasPorUnidad = () => ancho() / (X1 - X0);

    /*
     * Cuánto aire se deja correr a la derecha del último precio. Marco lo pidió el
     * 16-ago-2026 señalando el "espacio sin precio" de TradingView: poder seguir arrastrando
     * aunque ya no haya velas. NO es asomarse al futuro — ahí no se dibuja nada, porque no
     * hay nada. El precio de mañana sigue sin existir para la gráfica.
     */
    const AIRE = 0.45;                // 45% del ancho de la ventana

    const mover = (desde, hasta) => {
      const largo = hasta - desde;
      const tope = limites.hasta + Math.round(largo * AIRE);
      // Hacia atrás sí hay pared dura: antes del primer dato no hay nada que enseñar.
      if (desde < limites.desde) { desde = limites.desde; hasta = desde + largo; }
      if (hasta > tope) { hasta = tope; desde = hasta - largo; }
      alMover({ desde: Math.max(limites.desde, Math.round(desde)), hasta: Math.round(hasta) });
    };

    const cancelarEspera = () => { clearTimeout(reloj); reloj = null; };

    svg.addEventListener('pointerdown', (ev) => {
      svg.setPointerCapture(ev.pointerId);
      dedos.set(ev.pointerId, enX(ev));
      if (dedos.size === 2) {
        cancelarEspera();
        const [a, b] = [...dedos.values()];
        modo = 'pellizco';
        arranque = { separacion: Math.abs(a - b) || 1, ...ventana };
        return;
      }
      modo = 'espera';
      arranque = { x: enX(ev), ...ventana };
      reloj = setTimeout(() => {
        modo = 'leer';
        alLeer(pintado.marcar(pintado.posEn(arranque.x)));
      }, ESPERA_LECTURA);
    });

    svg.addEventListener('pointermove', (ev) => {
      if (!dedos.has(ev.pointerId)) return;
      ev.preventDefault();
      dedos.set(ev.pointerId, enX(ev));

      if (modo === 'pellizco' && dedos.size === 2) {
        const [a, b] = [...dedos.values()];
        const razon = Math.max(0.15, Math.abs(a - b) / arranque.separacion);
        const centro = (arranque.desde + arranque.hasta) / 2;
        const medio = Math.max(MINIMO_VENTANA,
          Math.min(limites.hasta - limites.desde + 1,
                   (arranque.hasta - arranque.desde + 1) / razon)) / 2;
        mover(centro - medio, centro + medio);
        return;
      }
      if (dedos.size !== 1) return;

      const x = enX(ev);
      if (modo === 'espera' && Math.abs(x - arranque.x) > 3) { cancelarEspera(); modo = 'mover'; }
      if (modo === 'leer') { alLeer(pintado.marcar(pintado.posEn(x))); return; }
      if (modo !== 'mover') return;

      // Arrastrar a la derecha va HACIA ATRÁS en el tiempo, como en cualquier gráfica.
      const corrimiento = (arranque.x - x) * diasPorUnidad();
      mover(arranque.desde + corrimiento, arranque.hasta + corrimiento);
    });

    const soltar = (ev) => {
      dedos.delete(ev.pointerId);
      cancelarEspera();
      if (modo === 'leer') alLeer(pintado.marcar(null));
      if (dedos.size === 0) modo = null;
      else if (dedos.size === 1) {          // se levantó un dedo del pellizco
        modo = 'mover';
        arranque = { x: [...dedos.values()][0], ...ventana };
      }
    };
    svg.addEventListener('pointerup', soltar);
    svg.addEventListener('pointercancel', soltar);

    /* Rueda del ratón, para poder probarlo en la computadora sin dedos. */
    svg.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const razon = ev.deltaY > 0 ? 1.25 : 0.8;
      const centro = (ventana.desde + ventana.hasta) / 2;
      const medio = Math.max(MINIMO_VENTANA,
        Math.min(limites.hasta - limites.desde + 1, ancho() * razon)) / 2;
      mover(centro - medio, centro + medio);
    }, { passive: false });
  }

  /* La forma vieja, sin arrastre: solo leer. La sigue usando la gráfica de la cartera. */
  function seguirElDedo(svg, pintado, alMover) {
    const punto = svg.createSVGPoint();
    const aCoordenadas = (ev) => {
      punto.x = ev.clientX;
      punto.y = ev.clientY;
      return punto.matrixTransform(svg.getScreenCTM().inverse()).x;
    };
    const mover = (ev) => {
      ev.preventDefault();
      alMover(pintado.marcar(pintado.posEn(aCoordenadas(ev))));
    };
    const soltar = () => alMover(pintado.marcar(null));

    svg.addEventListener('pointerdown', (ev) => { svg.setPointerCapture(ev.pointerId); mover(ev); });
    svg.addEventListener('pointermove', (ev) => { if (svg.hasPointerCapture(ev.pointerId)) mover(ev); });
    svg.addEventListener('pointerup', soltar);
    svg.addEventListener('pointercancel', soltar);
  }

  return { ANCHO, ALTO, LETRA, MINIMO_VENTANA, MAX_VELAS,
           dibujar, seguirElDedo, interactuar, corto, decimalesDe, escalaY, pasoBonito,
           VISTAS, muestreo, muestreoVentana, ventanaDe, vistasDisponibles };
})();

</script>
<script>
'use strict';

const VS_VER = '20260817-1223';    // sello, igual que el SK_VER de StocKids

/* De regreso al simulador. ⚠️ Mismo trato que `A_VISOR` allá: en desarrollo están en
   carpetas distintas y publicados quedan lado a lado, así que `publicar.py` reescribe esta
   línea y TRUENA si no la encuentra. */
const A_STOCKIDS = './index.html';

const CLAVE_NOMBRE = 'visor.nombre';   // lo único del visor que vive en el teléfono
const CLAVE = 'visor.v1';              // solo se usa si se vuelve a mostrar la captura
const CLAVE_TEMA = 'stockids.tema';    // ⚠️ LA DE STOCKIDS: el tema se hereda, no se duplica

/*
 * ⚠️ La captura está OCULTA a pedido de Marco (16-ago-2026): *"quita la parte de captura,
 * eso solo visor"*. Él dicta cada compra y se hornea.
 *
 * Con esto en `false` los movimientos salen del archivo horneado y `localStorage` NO guarda
 * ninguno. Ponerlo en `true` devuelve la pestaña ＋ Capturar, y entonces lo capturado manda
 * SOBRE lo horneado — nunca se mezclan, porque mezclarlos duplicaría lo que ya venía adentro.
 */
const CAPTURA_VISIBLE = false;
const $ = (id) => document.getElementById(id);

/* ===================== estado ===================== */

let DATOS = null;          // lo horneado, ya decodificado
let INST = null;           // el instrumento escogido
let E = null;              // { nombre, instrumento, movimientos }
let FUENTE = '';           // dónde está el dinero de verdad (GBM)
let MONEDA = 'MXN';        // ⚠️ PESOS aquí y DÓLARES en StocKids: son pestañas de la misma
                           // app y sin marcarlo se comparan cifras que no se comparan.
let PRECIO_HOY = null;     // precio de hoy en pesos, con el dólar en vivo si se pudo
let FX = null;             // { valor, fecha, vivo }
let VISTA = 'mes';
let VISTA_PRECIO = 'mes';
let VENTANA = null, VENTANA_PRECIO = null;
let PANTALLA = 'dinero';
let CAPTURA = 'dep';

/* El nombre es lo único que decide el teléfono. Los movimientos vienen horneados. */
const guardarNombre = () => localStorage.setItem(CLAVE_NOMBRE, E.nombre || '');

const guardar = () => {
  guardarNombre();
  if (CAPTURA_VISIBLE) localStorage.setItem(CLAVE, JSON.stringify(E));
};

/* Lo capturado a mano, si la captura está prendida. Con ella apagada esto no existe. */
const capturado = () => {
  if (!CAPTURA_VISIBLE) return null;
  try {
    const crudo = JSON.parse(localStorage.getItem(CLAVE) || 'null');
    return (crudo && Array.isArray(crudo.movimientos)) ? crudo : null;
  } catch { return null; }
};

/* ===================== tema ===================== */

/*
 * El tema NO es del visor: es de StocKids, y aquí solo se obedece. Por eso se lee su llave
 * y se copia su vocabulario tal cual (`oscuro` / `claro` / `sistema`, y la media query en
 * `dark`, no en `light`). Si esto se desalinea, vuelve el bug de tener la app en negro y el
 * visor en blanco.
 */
const sistemaOscuro = () =>
  !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
const temaElegido = () => localStorage.getItem(CLAVE_TEMA) || 'sistema';
const temaEfectivo = () => {
  const t = temaElegido();
  return t === 'sistema' ? (sistemaOscuro() ? 'oscuro' : 'claro') : t;
};
function aplicarTema() {
  document.documentElement.setAttribute('data-tema', temaEfectivo());
  const barra = document.querySelector('meta[name=theme-color]');
  if (barra) barra.setAttribute('content',
    getComputedStyle(document.documentElement).getPropertyValue('--fondo').trim());
}
const consulta = matchMedia('(prefers-color-scheme: dark)');
/* Dos caminos, como en StocKids: el evento de la media query Y otra revisada al volver a la
   app. Si Android cambia de tema con esto en segundo plano, el evento puede no llegar nunca. */
consulta.addEventListener('change', aplicarTema);
document.addEventListener('visibilitychange', () => { if (!document.hidden) aplicarTema(); });
aplicarTema();

/*
 * ⚠️ Cambiar solo el `#` NO recarga la página, y el link compartido se lee una sola vez al
 * arrancar. Sin esto, pegarle `#c=…` a una pestaña ya abierta no hace absolutamente nada y
 * parece que el link viene roto. Es la misma trampa que ya se pagó en StocKids con `#fecha=`.
 *
 * Ojo al probarlo: el navegador tampoco recarga si se le pide navegar a la MISMA URL, así
 * que una prueba que solo asigne `location.href` miente — se ve el estado viejo y parece que
 * funcionó. Hay que forzar con `location.reload()`.
 */
addEventListener('hashchange', () => location.reload());

/* ===================== el precio de hoy ===================== */

/*
 * ⚠️ Verificado el 16-ago-2026 desde el origen real de producción: Yahoo y Stooq BLOQUEAN por
 * CORS, y api.frankfurter.dev contesta 200. O sea que el precio del ETF no se puede refrescar
 * desde el teléfono, pero el tipo de cambio SÍ.
 *
 * De ahí el diseño: el precio en dólares viene horneado y aquí se multiplica por el dólar del
 * día. Con eso el valor en pesos se mueve solo aunque el precio en dólares tenga unos días.
 * Si no hay internet, se usa el tipo de cambio horneado y se dice de cuándo es.
 */
async function precioDeHoy() {
  const u = INST.n - 1;
  FX = { valor: DATOS.fxUltimo, fecha: DATOS.fxFecha, vivo: false };
  try {
    const r = await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=MXN',
                          { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (j && j.rates && j.rates.MXN > 0)
        FX = { valor: j.rates.MXN, fecha: j.date, vivo: true };
    }
  } catch { /* sin internet: se queda el horneado, que para eso está */ }
  PRECIO_HOY = INST.precioUSD(u) * FX.valor;
}

/* ===================== pintar ===================== */

const HOY = () => Visor.hoyISO();

/* Los nombres salen de `cartera.json` y del campo de captura: se escapan antes de meterlos
   en `innerHTML`, como cualquier texto que no escribimos nosotros. */
const escaparTexto = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* La cifra grande SIEMPRE con su moneda. Va en una función porque el dedo también reescribe
   ese elemento al leer la gráfica, y con `textContent` la etiqueta desaparecía a la primera
   caricia. */
const conMoneda = (el, n) => {
  el.innerHTML = `${Visor.dinero(n)}<em>${MONEDA}</em>`;
};

function indiceHoy() {
  const i = INST.indiceDe(HOY());
  return i < 0 ? 0 : i;
}

function pintar() {
  $('quien').textContent = E.nombre;
  const hoy = HOY();
  const iHoy = indiceHoy();
  const foto = Visor.calcular(E, INST, hoy, PRECIO_HOY);

  $('cuando').textContent =
    `${Visor.comoTexto(hoy)} · precio del ${Visor.comoTexto(INST.fecha(iHoy))}`;

  pintarDinero(foto, iHoy);
  pintarPrecio(iHoy);
  $('pie').textContent = `Visor ${VS_VER}`;
}

function pintarDinero(foto, iHoy) {
  conMoneda($('granTotal'), foto.total);

  const hay = E.movimientos.length > 0;
  $('cambio').classList.toggle('oculto', !hay);
  $('tituloMovs').classList.toggle('oculto', !hay);

  if (hay) {
    const sube = foto.ganancia >= 0;
    $('cambio').className = 'cambio ' + (sube ? 'sube' : 'baja');
    $('cambio').innerHTML =
      `${sube ? '▲' : '▼'} ${Visor.dinero(Math.abs(foto.ganancia))} ` +
      `(${foto.gananciaPct >= 0 ? '+' : ''}${foto.gananciaPct.toFixed(1)}%) ` +
      `<small>sobre los ${Visor.dinero(foto.metido)} que metió</small>`;
  }

  /* --- tarjetas --- */
  const t = [];
  t.push(['Títulos de ' + INST.clave, String(foto.titulos),
          foto.titulos ? `pagó ${Visor.dinero(foto.promedio)} cada uno` : 'todavía ninguno']);
  t.push(['Cuesta hoy', Visor.dinero(PRECIO_HOY),
          FX.vivo ? `dólar de hoy: ${FX.valor.toFixed(2)}` : `dólar del ${FX.fecha}`]);
  // Con moneda, igual que el total: son las dos cifras de dinero que se leen aquí.
  const conMon = (n) => `${Visor.dinero(n)}<em class="moneda">${MONEDA}</em>`;
  t.push(['Invertido', conMon(foto.valor),
          `${INST.clave} en el SIC` + (FUENTE ? `, con ${FUENTE}` : '')]);
  t.push(['Esperando', conMon(foto.efectivo),
          foto.efectivo >= PRECIO_HOY && PRECIO_HOY > 0
            ? `alcanza para ${Math.floor(foto.efectivo / PRECIO_HOY)} más`
            : 'sin invertir']);
  $('tarjetas').innerHTML = t.map(([i, b, s]) =>
    `<div class="tarjeta"><i>${i}</i><b>${b}</b><small>${s}</small></div>`).join('');

  /* --- quién ha puesto qué ---
     Son tres personas en una sola cuenta. Sin esto no se sabe de quién es el dinero. */
  /*
   * Cuánto es de cada quien, por UNIDADES: cada aportación compró participaciones al valor de
   * ese día. Por eso aquí puede salir que alguien tiene MÁS de lo que puso y otro exactamente
   * lo que puso — el que entró antes compró más barato, y esa ventaja es suya.
   */
  const qs = foto.quienes.filter(q => Math.abs(q.monto) > 0.005 || Math.abs(q.valor) > 0.005);
  $('quienes').innerHTML = qs.length ? `
    <div class="titulo">De quién es</div>
    <div class="aportes">${qs.map(q => `
      <div class="aporte">
        <div class="barra"><i style="width:${(q.parte * 100).toFixed(1)}%"></i></div>
        <div class="arriba">
          <b>${escaparTexto(q.quien)}</b>
          <span>${Visor.dinero(q.valor)}<em class="moneda">${MONEDA}</em></span>
        </div>
        <div class="abajo">
          <i>puso ${Visor.dinero(q.monto)} · ${(q.parte * 100).toFixed(0)}%</i>
          <em class="${q.ganancia >= 0 ? 'sube' : 'baja'}">${
            q.ganancia >= 0 ? '+' : '−'}${Visor.dinero(Math.abs(q.ganancia))}</em>
        </div>
      </div>`).join('')}</div>` : '';

  /* --- vacío --- */
  $('zonaVacia').innerHTML = hay ? '' : `
    <div class="vacio">
      <h3>Todavía no hay nada</h3>
      <p>${CAPTURA_VISIBLE
            ? `Cuando deposites en GBM y compres ${INST.clave}, captúralo con
               <b>＋ Capturar</b> y aquí va a aparecer.`
            : `En cuanto entre el primer dinero a ${INST.clave}, aquí va a aparecer solo.`}</p>
      <p style="margin-top:8px">Mientras, en <b>El precio</b> se ve cómo se ha movido
         lo que va a comprar.</p>
    </div>`;

  /* --- la gráfica --- */
  if (!hay) {
    $('grafica').replaceChildren();
    $('grafica').parentElement.classList.add('oculto');
    $('chipsVista').classList.add('oculto');
    $('claves').classList.add('oculto');
  } else {
    $('grafica').parentElement.classList.remove('oculto');
    $('chipsVista').classList.remove('oculto');
    $('claves').classList.remove('oculto');
    chips('chipsVista', VISTA, (v) => { VISTA = v; VENTANA = null; pintar(); });
    $('claves').innerHTML =
      `<div class="clave"><i class="punto" style="background:var(--verde)"></i>Su dinero</div>
       <div class="clave"><i class="punto" style="background:var(--ambar)"></i>Lo que metió</div>`;
    graficaDinero(iHoy);
  }

  /* --- movimientos, del más nuevo al más viejo --- */
  const señales = {
    dep:    ['↓', 'var(--verde)'],
    ret:    ['↑', 'var(--rojo)'],
    compra: ['＋', 'var(--azul)'],
    venta:  ['−', 'var(--ambar)'],
  };
  const orden = Visor.enOrden(E.movimientos);
  $('listaMovs').innerHTML = orden.slice().reverse().map((m) => {
    const real = E.movimientos.indexOf(m);
    const [glifo, color] = señales[m.t];
    // En compras y ventas se enseña el CARGO REAL, con comisión adentro: es lo que salió de
    // la cuenta, y es el número que tiene que cuadrar con el estado de GBM.
    const com = m.comision || 0;
    const cuanto = m.t === 'dep' || m.t === 'ret'
      ? Visor.dinero(m.monto)
      : Visor.dinero(m.titulos * m.precio + (m.t === 'compra' ? com : -com));
    const detalle = m.t === 'dep' || m.t === 'ret'
      ? (m.quien ? `<small>${escaparTexto(m.quien)}</small>` : '')
      : `<small>${m.titulos} × ${Visor.dinero(m.precio)}${
          com ? ` + ${Visor.dinero(com)} de comisión` : ''}</small>`;
    return `<div class="fila">
      <div class="señal" style="background:color-mix(in srgb, ${color} 18%, transparent);
           color:${color}">${glifo}</div>
      <div class="medio"><b>${Visor.TIPOS[m.t]}</b><small>${Visor.comoTexto(m.f)}</small></div>
      <div class="cifra">${cuanto}${detalle}</div>
      ${CAPTURA_VISIBLE ? `<button class="borrar" data-borrar="${real}" title="Borrar">×</button>` : ''}
    </div>`;
  }).join('');
}

function chips(donde, activa, alPicar) {
  const caja = $(donde);
  caja.innerHTML = Grafica.vistasDisponibles()
    .map(v => `<button class="chip" data-v="${v.clave}" aria-pressed="${v.clave === activa}">${v.etiqueta}</button>`)
    .join('');
  caja.querySelectorAll('.chip').forEach(b =>
    b.addEventListener('click', () => alPicar(b.dataset.v)));
}

/* La gráfica del dinero: dos líneas. No hay tercera de comparación a propósito — el niño YA
   está en el S&P 500, compararlo contra el S&P 500 no diría nada. */
function graficaDinero(iHoy) {
  const svg = $('grafica');
  const primero = Math.max(0, INST.indiceDe(Visor.enOrden(E.movimientos)[0].f));
  const limites = { desde: primero, hasta: iHoy };
  if (!VENTANA) {
    const v = Grafica.ventanaDe(VISTA, primero, iHoy);
    VENTANA = { desde: Math.max(primero, v.desde), hasta: v.hasta };
  }

  /*
   * ⚠️ El último punto se mide en la fecha de HOY, no en la del último precio.
   *
   * Los precios solo existen en días hábiles, así que el índice de "hoy" apunta al viernes
   * anterior si hoy es domingo. Evaluando la cartera en esa fecha, cualquier movimiento del
   * fin de semana todavía no ha pasado: la gráfica daba CERO mientras el total de arriba
   * decía $50, con el mismísimo estado. Se cachó el 16-ago-2026 con el primer depósito,
   * hecho en domingo.
   */
  const fechaDe = (i) => (i >= iHoy ? HOY() : INST.fecha(i));

  const dibujo = (ventana) => {
    const indices = Grafica.muestreoVentana(
      Math.max(primero, ventana.desde), Math.min(iHoy, ventana.hasta));
    return Grafica.dibujar(svg, {
      indices, hasta: iHoy, ventana,
      fecha: (i) => INST.fecha(i),
      series: [
        { nombre: 'Lo que metió', clase: 'metido',
          valor: (i) => Visor.calcular(E, INST, fechaDe(i)).metido },
        { nombre: 'Su dinero', clase: 'tuya',
          valor: (i) => Visor.calcular(E, INST, fechaDe(i),
                                       i >= iHoy ? PRECIO_HOY : undefined).total },
      ],
    });
  };

  let pintado = dibujo(VENTANA);
  Grafica.interactuar(svg, {
    limites, ventana: VENTANA, pintado,
    redibujar: (v) => { VENTANA = v; return dibujo(v); },
    alLeer: (leido) => {
      if (!leido) {
        const f = Visor.calcular(E, INST, HOY(), PRECIO_HOY);
        conMoneda($('granTotal'), f.total);
        $('cuando').textContent =
          `${Visor.comoTexto(HOY())} · precio del ${Visor.comoTexto(INST.fecha(iHoy))}`;
        return;
      }
      const [metido, tuyo] = leido.valores;
      conMoneda($('granTotal'), tuyo);
      $('cuando').textContent =
        `${Visor.comoTexto(leido.fecha)} · había metido ${Visor.dinero(metido)}`;
    },
  });
}

/* La gráfica del precio del ETF: una línea. Es lo que se ve antes de comprar nada. */
function pintarPrecio(iHoy) {
  const svg = $('graficaPrecio');
  $('precioGrande').textContent = Visor.dinero(PRECIO_HOY);

  const anterior = iHoy > 0 ? INST.precioMXN(iHoy - 1) : PRECIO_HOY;
  const dif = PRECIO_HOY - anterior;
  const sube = dif >= 0;
  $('precioCambio').className = 'cambio ' + (sube ? 'sube' : 'baja');
  $('precioCambio').innerHTML = `${sube ? '▲' : '▼'} ${Visor.dinero(Math.abs(dif))} ` +
    `(${sube ? '+' : '−'}${Math.abs(anterior ? dif / anterior * 100 : 0).toFixed(2)}%) ` +
    `<small>contra el día anterior</small>`;

  chips('chipsPrecio', VISTA_PRECIO, (v) => {
    VISTA_PRECIO = v; VENTANA_PRECIO = null; pintarPrecio(iHoy);
  });

  const limites = { desde: 0, hasta: iHoy };
  if (!VENTANA_PRECIO) VENTANA_PRECIO = Grafica.ventanaDe(VISTA_PRECIO, 0, iHoy);

  const dibujo = (ventana) => {
    const indices = Grafica.muestreoVentana(
      Math.max(0, ventana.desde), Math.min(iHoy, ventana.hasta));
    return Grafica.dibujar(svg, {
      indices, hasta: iHoy, ventana,
      fecha: (i) => INST.fecha(i),
      series: [{ nombre: INST.clave, clase: 'precio',
                 valor: (i) => (i >= iHoy ? PRECIO_HOY : INST.precioMXN(i)) }],
    });
  };

  let pintado = dibujo(VENTANA_PRECIO);
  Grafica.interactuar(svg, {
    limites, ventana: VENTANA_PRECIO, pintado,
    redibujar: (v) => { VENTANA_PRECIO = v; return dibujo(v); },
    alLeer: (leido) => {
      if (!leido) { $('precioGrande').textContent = Visor.dinero(PRECIO_HOY); return; }
      $('precioGrande').textContent = Visor.dinero(leido.valores[0]);
    },
  });

  const años = ((INST.n > 0 ? (Visor.aMs(INST.fecha(INST.n - 1)) - Visor.aMs(INST.base)) : 0)
                / (365.25 * Visor.MS_DIA));
  $('fichaInst').innerHTML = [
    ['Qué es', INST.clave, INST.nombre],
    ['Quién lo maneja', INST.gestora, `ISIN ${INST.isin}`],
    ['Cobra al año', (INST.costo * 100).toFixed(2) + '%', 'sobre lo invertido'],
    ['Historia', años.toFixed(1) + ' años', `desde el ${Visor.comoTexto(INST.base)}`],
  ].map(([i, b, s]) => `<div class="tarjeta"><i>${i}</i><b>${b}</b><small>${s}</small></div>`).join('');

  $('notaInst').innerHTML =
    `Son las <b>500 empresas más grandes de Estados Unidos</b>, todas en un solo papel. ` +
    `${INST.acumula ? 'Es <b>acumulativo</b>: lo que las empresas reparten se queda adentro y ' +
      'compra más, sin que nadie tenga que hacer nada.' : ''} ` +
    `Está <b>domiciliado en Irlanda</b> (la ISIN empieza con IE), que es lo que lo mantiene ` +
    `fuera del impuesto sucesorio de Estados Unidos. ` +
    `El precio se actualiza al publicar; el dólar, cada vez que se abre con internet.`;
}

/* ===================== captura ===================== */

function abrirCaptura() {
  CAPTURA = 'dep';
  $('cFecha').value = HOY();
  $('cMonto').value = ''; $('cTitulos').value = ''; $('cPrecio').value = '';
  $('cQuien').value = '';
  pintarTipos();
  $('telonCaptura').dataset.abierto = '1';
}

function pintarTipos() {
  $('tipos').innerHTML = Object.entries(Visor.TIPOS)
    .map(([k, v]) => `<button data-t="${k}" aria-pressed="${k === CAPTURA}">${v}</button>`).join('');
  $('tipos').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { CAPTURA = b.dataset.t; pintarTipos(); revisarCaptura(); }));

  const esMonto = CAPTURA === 'dep' || CAPTURA === 'ret';
  $('camposMonto').classList.toggle('oculto', !esMonto);
  $('camposTitulos').classList.toggle('oculto', esMonto);
  $('etiquetaMonto').textContent = CAPTURA === 'dep' ? '¿Cuánto entró?' : '¿Cuánto sacó?';
  $('subCaptura').textContent = CAPTURA === 'compra'
    ? `Los títulos y el precio salen de la app de GBM, tal cual.`
    : 'Lo que de verdad pasó en la cuenta de GBM.';
  revisarCaptura();
}

function movimientoDelFormulario() {
  const f = $('cFecha').value;
  if (CAPTURA === 'dep' || CAPTURA === 'ret') {
    const mov = { f, t: CAPTURA, monto: Number($('cMonto').value) };
    const quien = $('cQuien').value.trim();
    if (quien) mov.quien = quien;
    return mov;
  }
  return { f, t: CAPTURA, titulos: Number($('cTitulos').value), precio: Number($('cPrecio').value) };
}

/*
 * ⚠️ Esto NO repinta la pantalla, solo el previo y el botón. Repintar mientras teclea le
 * tumba el teclado del teléfono. Costó caro en StocKids.
 */
function revisarCaptura() {
  const m = movimientoDelFormulario();
  const vacio = (m.t === 'dep' || m.t === 'ret') ? !m.monto : (!m.titulos || !m.precio);
  const error = vacio ? null : Visor.revisar(E, INST, m);

  $('previo').className = 'previo' + (error ? ' mal' : '');
  $('hacerCaptura').disabled = vacio || !!error;

  if (vacio) { $('previo').textContent = 'Llena los datos y aquí digo cómo queda.'; return; }
  if (error) { $('previo').textContent = error; return; }

  const antes = Visor.calcular(E, INST, m.f, PRECIO_HOY);
  const despues = Visor.calcular(Visor.agregar(E, INST, m).estado, INST, m.f, PRECIO_HOY);
  if (m.t === 'compra') {
    $('previo').innerHTML =
      `Le cuesta <b>${Visor.dinero(m.titulos * m.precio)}</b>. Pasa de ` +
      `${antes.titulos} a <b>${despues.titulos}</b> títulos y le quedan ` +
      `<b>${Visor.dinero(despues.efectivo)}</b> sin invertir.`;
  } else if (m.t === 'venta') {
    $('previo').innerHTML =
      `Recibe <b>${Visor.dinero(m.titulos * m.precio)}</b>. Le quedan ` +
      `<b>${despues.titulos}</b> títulos.`;
  } else {
    $('previo').innerHTML =
      `Queda con <b>${Visor.dinero(despues.efectivo)}</b> sin invertir` +
      (PRECIO_HOY > 0 && despues.efectivo >= PRECIO_HOY
        ? `, que alcanza para <b>${Math.floor(despues.efectivo / PRECIO_HOY)}</b> ` +
          `${Math.floor(despues.efectivo / PRECIO_HOY) === 1 ? 'título' : 'títulos'}.`
        : '.');
  }
}

/* ===================== avisos ===================== */

function decir(titulo, texto) {
  $('dichoTitulo').textContent = titulo;
  $('dichoTexto').textContent = texto;
  $('telonDicho').dataset.abierto = '1';
}

/* ===================== compartir ===================== */

/*
 * Cómo llega el dinero al teléfono del niño sin servidor: los movimientos se empaquetan en el
 * `#` de un link y se manda por WhatsApp. Marco captura en el suyo, el niño abre el link.
 * Va en el `#` y no en `?` porque al compartir, la parte de `?` a veces se pierde.
 */
const aTexto = (obj) => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj))))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

function deTexto(txt) {
  const b = atob(txt.replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(b, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function enlaceParaCompartir() {
  return location.origin + location.pathname + '#c=' + aTexto(E);
}

/* ===================== arranque ===================== */

(async () => {
  // Sin opciones a propósito: `armar.py` reconoce exactamente esta forma y la cambia por la
  // constante horneada. Con un `{cache:…}` de por medio no la reconoce y el archivo armado
  // saldría pidiendo una red que no existe.
  DATOS = Visor.preparar(HORNEADO_VISOR);
  MONEDA = DATOS.moneda;

  /* ¿Vino un link compartido? */
  let compartido = null;
  const m = location.hash.match(/[#&]c=([A-Za-z0-9\-_]+)/);
  if (m) {
    try {
      const v = deTexto(m[1]);
      if (v && Array.isArray(v.movimientos)) compartido = v;
    } catch { /* link roto: se ignora y se sigue como siempre */ }
  }

  /*
   * La cartera REAL, horneada. Es la fuente de la verdad: cualquier teléfono que abra el
   * link ve exactamente lo mismo, sin sincronizar nada y sin que nadie tenga que compartir.
   * Marco dicta el movimiento, se captura en `datos/cartera.json` y se publica.
   */
  const HORNEADA = HORNEADO_CARTERA;

  E = compartido || capturado() || {
    nombre: HORNEADA.nombre || '',
    instrumento: HORNEADA.instrumento || DATOS.instrumentos[0].clave,
    movimientos: Visor.enOrden(HORNEADA.movimientos || []),
  };

  /*
   * El nombre viene horneado y es FIJO: la cuenta es de los dos hermanos, no de quien traiga
   * el teléfono en la mano. Marco lo pidió el 16-ago-2026 ("ponle fijo es el dinero de
   * Patrizio y Lucca"). Si algún día se vacía en `cartera.json`, cae solo al comportamiento
   * viejo: lo pregunta una vez y lo guarda en ese teléfono.
   */
  /* Dónde está el dinero de verdad. Sale del archivo, no clavado en el HTML: el bróker puede
     cambiar y ese dato tiene que poder corregirse en una línea, como todo lo demás. */
  FUENTE = HORNEADA.fuente || '';
  $('fuente').innerHTML = FUENTE ? `está en<br><b>${FUENTE}</b>` : '';

  const NOMBRE_FIJO = !!HORNEADA.nombre;
  if (!NOMBRE_FIJO) E.nombre = E.nombre || localStorage.getItem(CLAVE_NOMBRE) || '';
  const estrenando = !E.nombre;
  INST = DATOS.de(E.instrumento);

  await precioDeHoy();

  if (compartido) { guardar(); history.replaceState(null, '', location.pathname); }

  if (estrenando) {
    $('telonHola').dataset.abierto = '1';
    $('hNombre').addEventListener('input', () => {
      $('hacerHola').disabled = !$('hNombre').value.trim();
    });
    $('hacerHola').addEventListener('click', () => {
      E.nombre = $('hNombre').value.trim();
      guardar();
      $('telonHola').dataset.abierto = '0';
      pintar();
    });
  }

  /* --- navegación --- */
  document.querySelectorAll('nav button[data-pantalla]').forEach(b =>
    b.addEventListener('click', () => {
      PANTALLA = b.dataset.pantalla;
      document.querySelectorAll('nav button[data-pantalla]').forEach(o =>
        o.setAttribute('aria-pressed', o.dataset.pantalla === PANTALLA));
      $('pantallaDinero').classList.toggle('oculto', PANTALLA !== 'dinero');
      $('pantallaPrecio').classList.toggle('oculto', PANTALLA !== 'precio');
      pintar();
    }));

  $('aStocKids').addEventListener('click', () => { location.href = A_STOCKIDS; });

  /* --- captura: toda la maquinaria queda, apagada por una sola bandera --- */
  $('soloCaptura').classList.toggle('oculto', !CAPTURA_VISIBLE);
  $('botonCapturar').classList.toggle('oculto', !CAPTURA_VISIBLE);

  if (CAPTURA_VISIBLE) {
  $('botonCapturar').addEventListener('click', abrirCaptura);
  $('cerrarCaptura').addEventListener('click', () => $('telonCaptura').dataset.abierto = '0');
  ['cFecha', 'cMonto', 'cTitulos', 'cPrecio', 'cQuien'].forEach(id =>
    $(id).addEventListener('input', revisarCaptura));
  $('hacerCaptura').addEventListener('click', () => {
    const r = Visor.agregar(E, INST, movimientoDelFormulario());
    if (!r.ok) { revisarCaptura(); return; }
    E = r.estado;
    guardar();
    $('telonCaptura').dataset.abierto = '0';
    VENTANA = null;
    pintar();                                  // si cambias el estado, repinta TÚ (trampa #3)
  });

  $('listaMovs').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-borrar]');
    if (!b) return;
    E = Visor.quitar(E, Number(b.dataset.borrar));
    guardar();
    VENTANA = null;
    pintar();
  });
  }   /* fin de CAPTURA_VISIBLE */

  /* --- ajustes --- */
  // Con el nombre fijo no hay nada que teclear: se quita el campo en vez de dejarlo
  // editable y que el cambio se pierda al publicar.
  $('campoNombre').classList.toggle('oculto', NOMBRE_FIJO);

  $('irAjustes').addEventListener('click', () => {
    $('aNombre').value = E.nombre;
    if (CAPTURA_VISIBLE) {
      $('aInstrumento').innerHTML = DATOS.instrumentos
        .map(i => `<option value="${i.clave}" ${i.clave === E.instrumento ? 'selected' : ''}>${i.clave} — ${i.nombre}</option>`)
        .join('');
    }
    $('avisoDatos').innerHTML =
      `Está invertido en <b>${INST.clave}</b> — ${INST.nombre}.<br><br>` +
      `Precio horneado el <b>${DATOS.generado}</b>. El dólar se refresca solo al abrir con ` +
      `internet; el precio del ETF, solo al volver a publicar.<br><br>` +
      (CAPTURA_VISIBLE
        ? `Todo vive en este teléfono. Si lo cambias, carga un respaldo.`
        : `Los movimientos vienen dentro de la app, así que se ven igual en cualquier ` +
          `teléfono. <b>Los colores se cambian en StocKids</b> y el visor los sigue.`);
    $('telonAjustes').dataset.abierto = '1';
  });
  $('cerrarAjustes').addEventListener('click', () => $('telonAjustes').dataset.abierto = '0');

  $('aNombre').addEventListener('change', () => {
    const n = $('aNombre').value.trim();
    if (n) { E.nombre = n; guardar(); pintar(); }
  });
  /* El tema NO se elige aquí: se hereda de StocKids. Ver `aplicarTema`. */

  if (CAPTURA_VISIBLE) {
  $('aInstrumento').addEventListener('change', () => {
    E.instrumento = $('aInstrumento').value;
    INST = DATOS.de(E.instrumento);
    guardar();
    VENTANA = VENTANA_PRECIO = null;
    precioDeHoy().then(pintar);
  });

  $('compartir').addEventListener('click', async () => {
    const url = enlaceParaCompartir();
    const texto = `El dinero de ${E.nombre}`;
    if (navigator.share) {
      try { await navigator.share({ title: texto, url }); return; } catch { /* canceló */ }
    }
    try {
      await navigator.clipboard.writeText(url);
      decir('Link copiado', 'Pégaselo por WhatsApp. Al abrirlo, su teléfono se queda con todo.');
    } catch {
      decir('Copia esto', url);
    }
  });

  $('respaldar').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(E, null, 2)],
                                          { type: 'application/json' }));
    a.download = `mi-dinero-${HOY()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  /* Misma bandera que en StocKids: el registro del service worker no debe recargar la página
     mientras el selector está abierto. Cancelar NO dispara `change`, así que `focus` es el
     único aviso de que el usuario volvió. */
  $('restaurar').addEventListener('click', () => {
    window.escogiendoArchivo = true;
    const soltar = () => {
      window.escogiendoArchivo = false;
      window.removeEventListener('focus', soltar);
    };
    window.addEventListener('focus', soltar);
    setTimeout(soltar, 120000);
    $('archivo').click();
  });
  $('archivo').addEventListener('change', async () => {
    window.escogiendoArchivo = false;
    const f = $('archivo').files[0];
    if (!f) return;
    try {
      const v = JSON.parse(await f.text());
      if (!v || !Array.isArray(v.movimientos)) throw new Error('no trae movimientos');
      E = { nombre: v.nombre || E.nombre, instrumento: v.instrumento || E.instrumento,
            movimientos: Visor.enOrden(v.movimientos) };
      INST = DATOS.de(E.instrumento);
      guardar();
      VENTANA = VENTANA_PRECIO = null;
      $('telonAjustes').dataset.abierto = '0';
      await precioDeHoy();
      pintar();
      decir('Listo', `Se cargaron ${E.movimientos.length} movimientos.`);
    } catch (e) {
      decir('No pude', 'Ese archivo no es un respaldo de aquí.');
    }
    $('archivo').value = '';
  });
  }   /* fin de CAPTURA_VISIBLE */

  $('cerrarDicho').addEventListener('click', () => $('telonDicho').dataset.abierto = '0');
  document.querySelectorAll('.telon').forEach(t =>
    t.addEventListener('click', (ev) => { if (ev.target === t) t.dataset.abierto = '0'; }));

  pintar();

  /* El dólar se vuelve a pedir al volver a la app: puede haber pasado un día. */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) precioDeHoy().then(pintar);
  });

  window.listo = true;      // para las pruebas automáticas
})();
</script>

<script>
/* El service worker la vuelve instalable y la deja abrir sin internet.
   `updateViaCache:'none'` obliga a revalidar sw.js: si no, GitHub Pages lo deja cacheado
   10 minutos y la versión nueva tarda en llegar. Se busca actualización al abrir y cada vez
   que vuelve a la app; cuando el service worker nuevo toma el control, se recarga UNA vez.
   Lo de recargar importa aquí más que en MasMoney: el mundo avanza con el reloj, así que
   volver a la app siempre tiene que traer la foto de hoy. */
if ('serviceWorker' in navigator) {
  var _recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (_recargando) return;
    /* ⚠️ Nunca recargar con el selector de archivos abierto. Abrirlo manda la app a segundo
       plano; al volver se busca actualización, y si hay una esperando esto recargaba la
       página encima del usuario — perdiendo el archivo que estaba escogiendo y pareciendo
       que la app se trabó. Marco lo cachó el 16-ago-2026. */
    if (window.escogiendoArchivo) return;
    _recargando = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      reg.update();
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && !window.escogiendoArchivo) reg.update();
      });
    }).catch(function (e) { console.warn('sw:', e); });
  });
}
</script>
</html>
