<title>Mi dinero</title>

<!--
  El visor del dinero de VERDAD. Hermano de StocKids, pero no es lo mismo:

    StocKids   simulador · corre 12x · precios de 2008-2026 · el niño compra de mentiras
    este       real      · corre 1x  · un ETF irlandés      · Marco captura lo que pasó

  Por eso aquí no hay `tiempo.js`: no hay ancla ni ritmo que derivar, la fecha de hoy sale
  del calendario. Lo que sí se hereda es la disciplina: NO SE GUARDA NINGÚN SALDO. Solo la
  lista de movimientos, y todo lo demás se deriva (ver motor/visor.js).
-->

<style>
  :root {
    color-scheme: dark;
    --fondo:#0e1116; --panel:#161b23; --panel2:#1b222c; --borde:#232b36;
    --texto:#e8edf2; --suave:#8b9bad; --tenue:#5d6b7c;
    --verde:#4ade80; --sobreVerde:#0b2016;   /* el verde es claro: pide tinta oscura */
    --rojo:#f87171; --ambar:#f0b429; --azul:#60a5fa;
    --sombra:0 10px 30px rgba(0,0,0,.45);
  }
  /* ⚠️ `claro`, no `dia`. El tema se HEREDA de StocKids y hay que hablar su mismo idioma:
     misma llave (`stockids.tema`), mismos valores (`oscuro`/`claro`/`sistema`) y mismo
     atributo. Marco lo cachó el 16-ago-2026: tenía StocKids en negro y el visor le salía en
     día, porque cada uno guardaba su preferencia por separado y nunca se veían. */
  :root[data-tema="claro"] {
    color-scheme: light;
    --fondo:#f4f6f9; --panel:#ffffff; --panel2:#eef1f6; --borde:#dfe4ec;
    --texto:#111820; --suave:#5d6b7c; --tenue:#8b9bad;
    --verde:#15803d; --sobreVerde:#ffffff;   /* en día el verde es oscuro: tinta blanca */
    --rojo:#c02626; --ambar:#a16207; --azul:#1d4ed8;
    --sombra:0 10px 30px rgba(16,24,40,.12);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }

  /* ⚠️ `height`, NUNCA `min-height`. Con min-height el contenedor crece con el contenido, el
     overflow de <main> no entra nunca y la página entera se desplaza llevándose la barra de
     abajo. Marco lo cachó en StocKids con una captura. `position:fixed` lo remacha. */
  html, body { height:100% }
  body {
    position:fixed; inset:0; margin:0;
    background:var(--fondo); color:var(--texto);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  main { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
         padding:0 0 24px }
  .hoja { max-width:520px; margin:0 auto; padding:0 16px }

  /* --- encabezado --- */
  header { padding:14px 16px 0; max-width:520px; margin:0 auto; width:100% }
  .cabe { display:flex; align-items:flex-start; justify-content:space-between; gap:10px }
  .quien { font-size:13.5px; color:var(--suave); font-weight:600; margin-top:5px }
  .quien b { color:var(--texto) }
  .icono { width:36px; height:36px; border-radius:50%; border:1px solid var(--borde);
           background:var(--panel); color:var(--suave); display:grid; place-items:center;
           font-size:17px; cursor:pointer; flex:none }
  .cuando { font-size:12px; color:var(--tenue); margin-top:2px }

  /* El par con StocKids: allá dice SIM en gris, aquí REAL en verde. Son dos pestañas de la
     misma app y se parecen demasiado; el niño tiene que saber de un vistazo cuál trae dinero
     de verdad. Lo pidió Marco el 16-ago-2026. */
  .marca { font-weight:800; font-size:17px; letter-spacing:-.4px }
  .marca .real { color:var(--verde); font-size:13px; font-weight:800; letter-spacing:.6px;
                 margin-left:7px; vertical-align:2px }

  /* Va donde StocKids pone su reloj, y contesta la pregunta que el reloj no tiene aquí:
     dónde está el dinero de verdad. */
  .der { display:flex; flex-direction:column; align-items:flex-end; gap:9px; flex:none }
  .fuente { text-align:right; color:var(--tenue); font-size:11px; line-height:1.3 }
  .fuente b { color:var(--suave); font-size:12.5px }

  .granTotal { font-size:40px; font-weight:800; letter-spacing:-1.8px; margin:10px 0 0;
               line-height:1.05 }
  /* Etiqueta, no cifra: chica y apagada para no competir con el número. */
  .granTotal em { font-style:normal; font-size:17px; font-weight:700; color:var(--suave);
                  letter-spacing:.5px; margin-left:6px; vertical-align:middle }
  .cambio { font-size:14px; font-weight:700; margin-top:3px }
  .sube { color:var(--verde) } .baja { color:var(--rojo) }
  .cambio small { color:var(--suave); font-weight:500 }

  /* --- gráfica --- */
  .lienzo { margin-top:10px }
  /* La proporción DEBE ser la del viewBox o las letras salen estiradas (trampa #6). */
  svg.grafica { width:100%; aspect-ratio:320/180; display:block; touch-action:none }
  .raya { stroke:var(--borde); stroke-width:1 }
  .raya.tenue { stroke:var(--panel2) }
  .ejeDinero, .ejeTiempo { fill:var(--suave) }
  .linea { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round }
  .linea.tuya { stroke:var(--verde) }
  .linea.metido { stroke:var(--ambar); stroke-width:1.5 }
  .linea.precio { stroke:var(--azul) }
  .punta.tuya { fill:var(--verde) } .punta.metido { fill:var(--ambar) }
  .punta.precio { fill:var(--azul) }
  .guia { stroke:var(--texto); stroke-width:1; opacity:.5 }

  .chips { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap }
  .chip { flex:1; min-width:60px; padding:7px 4px; border-radius:9px; border:1px solid var(--borde);
          background:var(--panel); color:var(--suave); font-size:12.5px; font-weight:700;
          text-align:center; cursor:pointer }
  .chip[aria-pressed="true"] { background:var(--texto); color:var(--fondo); border-color:var(--texto) }

  .claves { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12.5px;
            color:var(--suave) }
  .clave { display:flex; align-items:center; gap:6px }
  .punto { width:9px; height:9px; border-radius:50%; flex:none }

  /* --- tarjetas --- */
  .tarjetas { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px }
  .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:13px;
             padding:11px 13px }
  .tarjeta i { font-style:normal; color:var(--suave); font-size:11.5px; display:block;
               margin-bottom:1px }
  .tarjeta b { font-size:17px; font-weight:700; letter-spacing:-.3px }
  .tarjeta small { display:block; color:var(--tenue); font-size:11px; margin-top:1px }
  /* Genérica: `<em>` es cursiva por defecto y la etiqueta de moneda no lo es. Antes solo
     había reglas por contexto y en cualquier lugar nuevo salía en cursiva. */
  em.moneda { font-style:normal; font-weight:700; color:var(--suave); letter-spacing:.5px;
              margin-left:4px; font-size:12.5px }
  .tarjeta em.moneda { font-size:12.5px }

  /* --- listas --- */
  .titulo { font-size:12px; font-weight:700; color:var(--suave); text-transform:uppercase;
            letter-spacing:.6px; margin:20px 0 8px }
  .fila { display:flex; align-items:center; gap:11px; padding:11px 13px; background:var(--panel);
          border:1px solid var(--borde); border-radius:13px; margin-bottom:7px }
  .fila .señal { width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
                 font-size:15px; font-weight:800; flex:none }
  .fila .medio { flex:1; min-width:0 }
  .fila .medio b { display:block; font-size:14.5px; font-weight:700 }
  .fila .medio small { color:var(--tenue); font-size:11.5px }
  .fila .cifra { text-align:right; font-weight:700; font-size:14.5px; white-space:nowrap }
  .fila .cifra small { display:block; color:var(--tenue); font-weight:500; font-size:11px }
  .borrar { background:none; border:none; color:var(--tenue); font-size:17px; cursor:pointer;
            padding:2px 4px; flex:none }

  /* --- quién ha puesto ---
     Barra de fondo en vez de una rueda: son dos o tres personas, no una cartera; una dona
     para dos rebanadas es adorno. La barra dice la proporción de un vistazo. */
  .aportes { display:flex; flex-direction:column; gap:7px }
  .aporte { position:relative; padding:10px 13px; border:1px solid var(--borde);
            border-radius:13px; background:var(--panel); overflow:hidden }
  .aporte .barra { position:absolute; inset:0; pointer-events:none }
  .aporte .barra i { display:block; height:100%; background:var(--verde); opacity:.13 }
  .aporte .arriba, .aporte .abajo { position:relative; display:flex; align-items:baseline;
                                    justify-content:space-between; gap:9px }
  .aporte .abajo { margin-top:2px }
  .aporte b { font-size:14.5px; font-weight:700; min-width:0; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap }
  .aporte .arriba span { font-size:14.5px; font-weight:750; white-space:nowrap; flex:none }
  .aporte .abajo i { font-style:normal; color:var(--tenue); font-size:12px; min-width:0;
                     overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .aporte .abajo em { font-style:normal; font-size:12.5px; font-weight:700; flex:none;
                      white-space:nowrap }
  .aporte .abajo em.sube { color:var(--verde) } .aporte .abajo em.baja { color:var(--rojo) }

  /* --- vacío --- */
  .vacio { background:var(--panel); border:1px dashed var(--borde); border-radius:16px;
           padding:20px 18px; text-align:center; margin-top:14px }
  .vacio h3 { margin:0 0 6px; font-size:16px }
  .vacio p { margin:0 0 4px; color:var(--suave); font-size:13.5px; line-height:1.5 }

  /* --- botones --- */
  .boton { display:block; width:100%; padding:14px; border-radius:13px; border:none;
           font-size:15.5px; font-weight:700; cursor:pointer; font-family:inherit }
  .boton.verde { background:var(--verde); color:var(--sobreVerde) }
  .boton.plano { background:var(--panel2); color:var(--texto); border:1px solid var(--borde) }
  .boton.rojo  { background:transparent; color:var(--rojo); border:1px solid var(--rojo) }
  .boton:disabled { opacity:.4; cursor:default }

  /* --- barra de abajo --- */
  nav { display:flex; border-top:1px solid var(--borde); background:var(--panel);
        padding-bottom:env(safe-area-inset-bottom); flex:none }
  nav button { flex:1; background:none; border:none; color:var(--tenue); padding:9px 0 7px;
               font:inherit; font-size:10.5px; font-weight:700; cursor:pointer;
               display:flex; flex-direction:column; align-items:center; gap:3px }
  nav button[aria-pressed="true"] { color:var(--verde) }
  nav .glifo { font-size:19px; line-height:1 }

  /* --- hojas / modales --- */
  .telon { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
           align-items:flex-end; justify-content:center; z-index:50 }
  .telon[data-abierto="1"] { display:flex }
  .caja { background:var(--fondo); border-radius:20px 20px 0 0; width:100%; max-width:520px;
          padding:18px 16px calc(18px + env(safe-area-inset-bottom));
          box-shadow:var(--sombra); max-height:92%; overflow-y:auto }
  .caja h2 { margin:0 0 3px; font-size:19px; letter-spacing:-.4px }
  .caja p.sub { margin:0 0 14px; color:var(--suave); font-size:13px }

  .telon.centro { align-items:center; padding:16px }
  .telon.centro .caja { border-radius:20px; text-align:center }

  label.campo { display:block; margin-bottom:11px }
  label.campo span { display:block; font-size:12px; color:var(--suave); font-weight:600;
                     margin-bottom:5px }
  input, select { width:100%; padding:12px 13px; border-radius:11px; border:1px solid var(--borde);
                  background:var(--panel); color:var(--texto); font:inherit; font-size:16px }
  input:focus, select:focus { outline:2px solid var(--verde); outline-offset:-1px }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:9px }

  .tipos { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:13px }
  .tipos button { padding:11px 6px; border-radius:11px; border:1px solid var(--borde);
                  background:var(--panel); color:var(--suave); font:inherit; font-size:13.5px;
                  font-weight:700; cursor:pointer }
  .tipos button[aria-pressed="true"] { background:var(--texto); color:var(--fondo);
                                       border-color:var(--texto) }

  .previo { background:var(--panel2); border-radius:11px; padding:11px 13px; font-size:13px;
            color:var(--suave); margin-bottom:12px; line-height:1.5; min-height:42px }
  .previo b { color:var(--texto) }
  .previo.mal { color:var(--rojo) }

  .aviso { font-size:12px; color:var(--tenue); line-height:1.5; margin-top:10px }
  .pie { text-align:center; color:var(--tenue); font-size:11px; margin-top:22px }

  .oculto { display:none !important }

  /* ⚠️ Para el <input type="file"> y solo para él: con `display:none` no está renderizado, y
     Chrome de Android abre un selector del que a veces no se puede volver — la app se queda
     atrás y hay que matarla. Se le quita del paso sin sacarlo del render. */
  .fueraDelPaso { position:absolute; left:-9999px; width:1px; height:1px; opacity:0 }
</style>

<!-- ===== hoja de captura ===== -->
<div class="telon" id="telonCaptura">
  <div class="caja">
    <h2>Capturar un movimiento</h2>
    <p class="sub" id="subCaptura">Lo que de verdad pasó en la cuenta de GBM.</p>

    <div class="tipos" id="tipos"></div>

    <label class="campo"><span>¿Qué día?</span>
      <input type="date" id="cFecha"></label>

    <div id="camposMonto">
      <label class="campo"><span id="etiquetaMonto">¿Cuánto?</span>
        <input type="number" id="cMonto" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></label>
      <!-- Aportan los dos hijos y Marco: sin esto no se sabría de quién es el dinero. -->
      <label class="campo"><span>¿De quién es?</span>
        <input type="text" id="cQuien" maxlength="24" autocomplete="off"
               placeholder="Patrizio, Lucca, Marco…"></label>
    </div>

    <div id="camposTitulos" class="oculto">
      <div class="dos">
        <label class="campo"><span>Títulos</span>
          <input type="number" id="cTitulos" inputmode="numeric" step="1" min="1" placeholder="1"></label>
        <label class="campo"><span>Precio por título</span>
          <input type="number" id="cPrecio" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></label>
      </div>
    </div>

    <div class="previo" id="previo"></div>
    <button class="boton verde" id="hacerCaptura" disabled>Guardar</button>
    <button class="boton plano" id="cerrarCaptura" style="margin-top:8px">Cancelar</button>
  </div>
</div>

<!-- ===== ajustes ===== -->
<div class="telon" id="telonAjustes">
  <div class="caja">
    <h2>Ajustes</h2>
    <p class="sub">De quién es, en qué está y cómo se comparte.</p>

    <label class="campo" id="campoNombre"><span>¿De quién es este dinero?</span>
      <input type="text" id="aNombre" maxlength="24" autocomplete="off"></label>

    <!-- Todo lo de abajo solo aparece con la captura prendida: sin ella no hay nada que
         escoger, compartir ni respaldar — los movimientos vienen horneados y el tema lo
         manda StocKids. -->
    <div id="soloCaptura" class="oculto">
      <label class="campo"><span>¿En qué está invertido?</span>
        <select id="aInstrumento"></select></label>

      <button class="boton plano" id="compartir" style="margin-bottom:8px">Mandar a su teléfono</button>
      <button class="boton plano" id="respaldar" style="margin-bottom:8px">Guardar un respaldo</button>
      <button class="boton plano" id="restaurar">Cargar un respaldo</button>
      <!-- ⚠️ `fueraDelPaso`, NO `oculto`: `display:none` en un <input type="file"> hace que
           Chrome de Android abra un selector del que a veces no se puede volver. -->
      <input type="file" id="archivo" accept="application/json" class="fueraDelPaso">
    </div>

    <div class="aviso" id="avisoDatos"></div>

    <button class="boton plano" id="cerrarAjustes" style="margin-top:14px">Listo</button>
  </div>
</div>

<!-- ===== bienvenida ===== -->

  <div class="caja">

    <button class="boton verde" id="hacerHola" disabled>Empezar</button>
  </div>
</div>

</div>
