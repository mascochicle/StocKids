<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>StocKids</title>
<style>
  :root {
    --fondo:#0e1116; --panel:#161b23; --panel2:#1c232d; --borde:#232b36;
    --texto:#e8edf2; --suave:#8b9bad; --tenue:#5b6b7d;
    --verde:#4ade80; --rojo:#f87171; --ambar:#f0b429; --gris:#7c8ea3;
    --alto:56px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html, body { margin:0; background:#05070a; color:var(--texto);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif }
  body { display:flex; justify-content:center; min-height:100dvh }

  /* Probar SIEMPRE a 480 px: es el ancho real de su S25 Ultra, no 393. */
  #app { width:480px; max-width:100%; background:var(--fondo); position:relative;
         display:flex; flex-direction:column; min-height:100dvh; overflow:hidden }

  /* --- encabezado --- */
  header { padding:14px 18px 10px; display:flex; align-items:flex-start; gap:10px }
  .marca { font-weight:800; font-size:17px; letter-spacing:-.4px; flex:1 }
  .marca span { color:var(--verde) }
  .epoca { color:var(--suave); font-size:12.5px; margin-top:2px }
  .cuenta { text-align:right; color:var(--tenue); font-size:11px; line-height:1.3 }
  .barrita { width:64px; height:3px; background:var(--borde); border-radius:2px; margin-top:4px;
             margin-left:auto; overflow:hidden }
  .barrita i { display:block; height:100%; background:var(--verde); border-radius:2px }

  main { flex:1; padding:0 0 16px; overflow-y:auto; -webkit-overflow-scrolling:touch }

  /* --- avisos --- */
  .aviso { margin:0 14px 10px; padding:11px 13px; border-radius:12px; font-size:13.5px;
           display:flex; gap:9px; align-items:flex-start; line-height:1.4 }
  .aviso.dinero { background:rgba(240,180,41,.12); border:1px solid rgba(240,180,41,.3) }
  .aviso.pago   { background:rgba(74,222,128,.1); border:1px solid rgba(74,222,128,.28) }
  .aviso.nueva  { background:rgba(124,142,163,.12); border:1px solid rgba(124,142,163,.3) }
  .aviso b { font-weight:700 }

  /* --- resumen --- */
  .resumen { padding:2px 18px 0 }
  .resumen .cifra { font-size:40px; font-weight:800; letter-spacing:-1.8px; line-height:1.05;
                    font-variant-numeric:tabular-nums }
  .cambio { font-size:14px; font-weight:600; margin-top:3px }
  .sube { color:var(--verde) } .baja { color:var(--rojo) }
  .cambio small { color:var(--suave); font-weight:400 }

  .lienzo { padding:10px 10px 0 }
  svg.grafica { width:100%; aspect-ratio:320/180; display:block; touch-action:none }
  .raya { stroke:var(--borde); stroke-width:1 }
  .raya.tenue { stroke:#1a212b }
  .cifra_eje, text.cifra { fill:var(--suave) }
  text.anio { fill:var(--tenue) }
  .linea { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round }
  .linea.tuya { stroke:var(--verde) }
  .linea.metido { stroke:var(--ambar); stroke-width:1.5 }
  .linea.referencia { stroke:var(--gris); stroke-width:1.5 }
  .linea.precio { stroke:var(--verde) }
  .punta.tuya, .punta.precio { fill:var(--verde) }
  .punta.metido { fill:var(--ambar) } .punta.referencia { fill:var(--gris) }
  .guia { stroke:var(--texto); stroke-width:1; opacity:.45 }

  .claves { display:flex; gap:13px; flex-wrap:wrap; padding:6px 18px 0; font-size:12px;
            color:var(--suave) }
  .clave { display:flex; align-items:center; gap:6px }
  .bolita { width:8px; height:8px; border-radius:50%; flex:none }

  .leido { padding:8px 18px 0; font-size:13px; color:var(--suave); min-height:20px }
  .leido b { color:var(--texto) }

  /* --- listas --- */
  .titulo { padding:18px 18px 8px; font-size:12px; font-weight:700; letter-spacing:.8px;
            text-transform:uppercase; color:var(--tenue) }
  .lista { padding:0 14px; display:flex; flex-direction:column; gap:8px }
  .fila { display:flex; align-items:center; gap:12px; background:var(--panel);
          border:1px solid var(--borde); border-radius:14px; padding:12px 14px;
          text-align:left; width:100%; color:inherit; font:inherit; cursor:pointer }
  .fila:active { background:var(--panel2) }
  .fila .quien { flex:1; min-width:0 }
  .fila .nombre { font-weight:650; font-size:15px; white-space:nowrap; overflow:hidden;
                  text-overflow:ellipsis }
  .fila .abajo { color:var(--suave); font-size:12px; margin-top:1px; display:flex;
                 gap:6px; align-items:center }
  .fila .cuanto { text-align:right; font-variant-numeric:tabular-nums; flex:none }
  .fila .cuanto b { display:block; font-weight:650; font-size:15px }
  .fila .cuanto i { font-style:normal; font-size:12.5px; font-weight:600 }

  .sello { font-size:10px; font-weight:700; letter-spacing:.3px; padding:1px 6px;
           border-radius:5px; background:rgba(240,180,41,.16); color:var(--ambar); flex:none }
  .sello.canasta { background:rgba(124,142,163,.18); color:var(--gris) }

  .tarjetas { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px 0 }
  .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:14px;
             padding:11px 13px }
  .tarjeta i { font-style:normal; color:var(--suave); font-size:11.5px; display:block;
               margin-bottom:2px }
  .tarjeta b { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums }

  .vacio { margin:14px; padding:22px 18px; text-align:center; background:var(--panel);
           border:1px dashed var(--borde); border-radius:16px }
  .vacio p { color:var(--suave); font-size:13.5px; margin:0 0 14px; line-height:1.5 }

  /* --- ficha --- */
  .volver { background:none; border:none; color:var(--suave); font:inherit; font-size:14px;
            padding:12px 18px 0; cursor:pointer; display:flex; align-items:center; gap:6px }
  .ficha { padding:6px 18px 0 }
  .ficha h2 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.8px }
  .ficha .ticker { color:var(--tenue); font-size:13px; font-weight:600; letter-spacing:.5px }
  .ficha .nota { color:var(--suave); font-size:13.5px; margin-top:8px; line-height:1.45 }
  .datos { display:flex; gap:22px; margin-top:14px }
  .dato i { font-style:normal; display:block; color:var(--tenue); font-size:11px;
            text-transform:uppercase; letter-spacing:.6px }
  .dato b { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums }

  .reparto { margin:14px 18px 0; padding:12px 14px; border-radius:13px; font-size:13px;
             line-height:1.45; background:rgba(240,180,41,.09);
             border:1px solid rgba(240,180,41,.22); color:var(--texto) }
  .reparto.no { background:var(--panel); border-color:var(--borde); color:var(--suave) }
  .reparto b { color:var(--ambar) }

  .tengo { margin:12px 18px 0; padding:12px 14px; border-radius:13px; background:var(--panel);
           border:1px solid var(--borde); font-size:13.5px; color:var(--suave) }
  .tengo b { color:var(--texto); font-variant-numeric:tabular-nums }

  /* --- botones --- */
  .acciones { display:flex; gap:10px; padding:16px 18px 0 }
  button.boton { flex:1; height:48px; border-radius:14px; border:none; font:inherit;
                 font-size:15.5px; font-weight:700; cursor:pointer }
  .comprar { background:var(--verde); color:#06251a }
  .vender  { background:var(--panel2); color:var(--texto); border:1px solid var(--borde) }
  button:disabled { opacity:.4; cursor:default }
  button.boton:active { transform:translateY(1px) }

  /* --- pestañas --- */
  nav { display:flex; border-top:1px solid var(--borde); background:var(--fondo);
        padding-bottom:env(safe-area-inset-bottom) }
  nav button { flex:1; background:none; border:none; color:var(--tenue); font:inherit;
               font-size:12.5px; font-weight:600; padding:11px 0 13px; cursor:pointer;
               display:flex; flex-direction:column; align-items:center; gap:3px }
  nav button.puesto { color:var(--verde) }
  nav .icono { font-size:17px; line-height:1 }

  /* --- hoja de comprar/vender --- */
  .fondoNegro { position:absolute; inset:0; background:rgba(3,5,8,.72); display:flex;
                align-items:flex-end; z-index:10 }
  .hoja { width:100%; background:var(--fondo); border-top-left-radius:22px;
          border-top-right-radius:22px; border-top:1px solid var(--borde);
          padding:20px 18px calc(20px + env(safe-area-inset-bottom)) }
  .hoja h3 { margin:0 0 4px; font-size:20px; font-weight:800; letter-spacing:-.5px }
  .hoja .pie { color:var(--suave); font-size:13px; margin:0 0 16px }
  .montos { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px }
  .montos button { height:44px; border-radius:12px; background:var(--panel2);
                   border:1px solid var(--borde); color:var(--texto); font:inherit;
                   font-weight:650; cursor:pointer }
  .montos button.elegido { background:var(--verde); color:#06251a; border-color:var(--verde) }
  .cuanto_input { display:flex; align-items:center; gap:8px; background:var(--panel);
                  border:1px solid var(--borde); border-radius:13px; padding:12px 14px;
                  margin-bottom:12px }
  .cuanto_input span { color:var(--suave); font-size:20px; font-weight:700 }
  .cuanto_input input { flex:1; background:none; border:none; color:var(--texto);
                        font:inherit; font-size:22px; font-weight:700; outline:none;
                        font-variant-numeric:tabular-nums; min-width:0 }
  .previo { color:var(--suave); font-size:13px; margin-bottom:14px; line-height:1.45 }
  .previo b { color:var(--texto) }
  .error { color:var(--rojo); font-size:13px; margin-bottom:12px; min-height:18px }

  .sello_ver { text-align:center; color:#2a3442; font-size:10px; padding:10px 0 4px;
               letter-spacing:.5px; user-select:none }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StocKids">

</div>

<script>
/* ===== tiempo.js ===== */
/*
 * StocKids — motor del tiempo.
 *
 * El corazón de la app: dice en qué semana de bolsa vamos HOY.
 *
 * Regla de Marco: un año de bolsa por cada mes de vida real. O sea que el mundo corre
 * exactamente 12 veces más rápido (12 años de bolsa por año real). De ahí sale todo:
 * una semana de bolsa = 7 días / 12 = 14 horas reales, o ~1.7 precios nuevos por día.
 *
 * ⚠️ EL RELOJ ES EL ESTADO. Lo único que se guarda es el ANCLA (cuándo arrancó el juego).
 * Nunca "voy en la semana 37": si no abre la app en dos semanas, el mundo tiene que haber
 * avanzado igual. Todo lo demás se deriva del tiempo transcurrido.
 *
 * Se guarda UNA cosa más, y es a propósito: `semanaTope`, la semana más alta ya vista.
 * Sirve de trinquete para que el mundo NUNCA retroceda. Si el reloj de la tablet se mueve
 * hacia atrás (o el niño lo mueve para deshacer una venta de la que se arrepintió), el
 * mundo se queda quieto en vez de borrarle historia a la cartera.
 */

const Tiempo = (() => {
  'use strict';

  const RITMO = 12;                       // años de bolsa por año real
  const MS_DIA = 24 * 60 * 60 * 1000;
  const MS_POR_SEMANA = 7 * MS_DIA / RITMO;   // 14 horas reales por semana de bolsa

  /*
   * Calcula el estado del mundo. Función pura: mismas entradas, misma salida.
   * Recibe `ahoraMs` en vez de leer el reloj para poder probarla con saltos de tiempo.
   *
   *   anclaMs      cuándo arrancó el juego (epoch ms)
   *   ahoraMs      ahora (epoch ms)
   *   totalSemanas cuántas semanas de precios hay horneadas
   *   semanaTope   la semana más alta vista antes (-1 si es la primera vez)
   *
   * Devuelve:
   *   semana           índice entero en el arreglo de precios
   *   avance           0..1 dentro de la semana actual
   *   msParaSiguiente  cuánto falta para el próximo precio (null si ya no hay más)
   *   terminado        se acabó la pista de datos
   *   relojAtrasado    el reloj del aparato se movió hacia atrás; el mundo está congelado
   */
  function calcular({ anclaMs, ahoraMs, totalSemanas, semanaTope = -1 }) {
    const ultima = totalSemanas - 1;
    const transcurrido = Math.max(0, ahoraMs - anclaMs);   // ancla en el futuro => semana 0
    const exactas = transcurrido / MS_POR_SEMANA;
    const derivada = Math.floor(exactas);

    // El trinquete y el fin de la pista, en ese orden.
    const semana = Math.min(Math.max(derivada, semanaTope), ultima);
    const terminado = derivada >= ultima;
    const relojAtrasado = derivada < semanaTope;

    let avance;
    if (terminado) avance = 1;
    else if (relojAtrasado) avance = 0;      // congelado hasta que el tiempo real lo alcance
    else avance = exactas - derivada;

    const msParaSiguiente = terminado
      ? null
      : Math.max(0, (semana + 1 - exactas) * MS_POR_SEMANA);

    return { semana, avance, msParaSiguiente, terminado, relojAtrasado };
  }

  /*
   * La fecha que ve el niño. Sale de la etiqueta de la semana más lo que lleva corrido,
   * no de multiplicar el tiempo real: así la fecha y el precio nunca se contradicen.
   * `semanas` es el arreglo de fechas ISO que hornea el extractor.
   */
  function fechaMercado(semanas, semana, avance = 0) {
    const [a, m, d] = semanas[semana].split('-').map(Number);
    const base = Date.UTC(a, m - 1, d);
    // La semana etiquetada es la que CIERRA al final de esos 7 días.
    return new Date(base + (avance * 7 + 7) * MS_DIA);
  }

  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
    'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  /* "marzo de 2020" — al niño le importa la época, no el día exacto. */
  function comoTexto(fecha) {
    return `${MESES[fecha.getUTCMonth()]} de ${fecha.getUTCFullYear()}`;
  }

  /* "14 h" / "35 min" — para el "próximo precio en…". */
  function cuantoFalta(ms) {
    if (ms == null) return null;
    const min = Math.round(ms / 60000);
    if (min < 60) return `${min} min`;
    const h = Math.floor(min / 60);
    const resto = min % 60;
    return resto ? `${h} h ${resto} min` : `${h} h`;
  }

  return { RITMO, MS_POR_SEMANA, calcular, fechaMercado, comoTexto, cuantoFalta };
})();

<script>
/* ===== cartera.js ===== */
/*
 * StocKids — la cartera.
 *
 * Comprar, vender, y saber cuánto vale hoy y cuánto cambió.
 *
 * ⚠️ MISMO PATRÓN QUE EL RELOJ: no se guarda ningún saldo. Se guarda la lista de
 * movimientos (cada compra y cada venta, con la semana en que ocurrió) y TODO lo demás
 * se deriva. Las aportaciones ni siquiera se guardan: se cuentan del calendario, porque
 * si el niño no abre la app en dos meses su dinero tuvo que haber llegado igual.
 *
 * Decisiones de diseño que tienen razón de ser (no cambiarlas sin releer la idea pedagógica):
 *
 *  - **Se compra por monto, no por número de acciones.** "Quiero meterle 200 dólares a
 *    Nintendo" es como piensa la gente; "quiero 3.4 acciones" no. Eso obliga a permitir
 *    fracciones, que además es lo que hacen las apps de verdad.
 *  - **No hay comisiones.** El freno contra operar seguido ya está en el mundo: solo hay
 *    un precio por semana. No hace falta castigarlo además con un cobro escondido.
 *  - **Costo promedio** para calcular la ganancia de cada posición. Es lo único explicable
 *    a un niño: "te costaron en promedio X, hoy valen Y".
 *  - **Los dividendos caen como EFECTIVO, no se reinvierten solos.** Marco los pidió el
 *    15-ago-2026 para que el niño sepa que hay empresas que te pagan por tenerlas. Si se
 *    reinvirtieran automáticamente no vería nada; cayendo como dinero, los ve llegar y
 *    decide qué hacer con ellos. Además premia justo lo que queremos: aguantar.
 *  - **La regla del dividendo: te lo pagan si ya la tenías ANTES de esa semana.** Comprar
 *    el mismo día del pago no te lo gana; venderla ese día sí te lo deja.
 */

const Cartera = (() => {
  'use strict';

  const CAPITAL_INICIAL = 1000;   // USD, lo decidió Marco
  const APORTACION = 50;          // USD por cada Año Nuevo de bolsa (= cada mes real)
  const CENTAVO = 0.01;

  /* --- lo que se guarda ------------------------------------------------- */
  /* Nada de saldos. Solo el ancla del reloj y los movimientos. */
  const nueva = (anclaMs) => ({ ancla: anclaMs, semanaTope: -1, movimientos: [] });

  /* --- ayudas sobre los datos horneados --------------------------------- */

  const buscar = (datos, ticker) => datos.empresas.find(e => e.ticker === ticker);

  /* El año de bolsa de una semana. La semana etiquetada CIERRA 7 días después:
     la del 29-dic-2014 cierra el 2-ene-2015, o sea que ya es 2015. */
  function anioDeBolsa(datos, semana) {
    const [a, m, d] = datos.semanas[semana].split('-').map(Number);
    return new Date(Date.UTC(a, m - 1, d + 7)).getUTCFullYear();
  }

  /* Precio de esa semana, o null si todavía no sale a bolsa (Roblox antes de 2021). */
  function precio(datos, ticker, semana) {
    const e = buscar(datos, ticker);
    if (!e || semana < e.desde) return null;
    return e.precios[semana - e.desde];
  }

  const existe = (datos, ticker, semana) => precio(datos, ticker, semana) !== null;

  const pagaDividendos = (datos, ticker) => (buscar(datos, ticker).dividendos || []).length > 0;

  /*
   * Suma acumulada de dividendos por acción, semana por semana. Se calcula una vez por
   * empresa y se guarda: `serieValor` llama a `calcular` 600 veces y sin esto cada llamada
   * volvería a recorrer todos los pagos.
   */
  const cacheDividendos = new WeakMap();
  function acumulado(datos, ticker) {
    let porEmpresa = cacheDividendos.get(datos);
    if (!porEmpresa) cacheDividendos.set(datos, porEmpresa = new Map());
    let acc = porEmpresa.get(ticker);
    if (acc) return acc;

    const pagos = buscar(datos, ticker).dividendos || [];
    acc = new Float64Array(datos.semanas.length);
    let suma = 0, i = 0;
    for (let s = 0; s < acc.length; s++) {
      while (i < pagos.length && pagos[i][0] === s) suma += pagos[i++][1];
      acc[s] = suma;
    }
    porEmpresa.set(ticker, acc);
    return acc;
  }

  /* Lo que pagó una acción entre dos semanas, ambas incluidas. */
  function dividendosEntre(datos, ticker, desde, hasta) {
    if (hasta < desde) return 0;
    const acc = acumulado(datos, ticker);
    return acc[hasta] - (desde > 0 ? acc[desde - 1] : 0);
  }

  /* Cuántas aportaciones lleva recibidas. Se DERIVA del calendario, no se guarda:
     así el dinero llega aunque no haya abierto la app. */
  const aportacionesA = (datos, semana) =>
    anioDeBolsa(datos, semana) - anioDeBolsa(datos, 0);

  /* --- el estado de la cartera en una semana dada ------------------------ */

  /*
   * Recorre los movimientos hasta `semana` y arma la foto. Función pura.
   * Devuelve efectivo, cada posición con su ganancia, y los totales.
   */
  function calcular(estado, datos, semana) {
    const aportaciones = aportacionesA(datos, semana);
    let efectivo = CAPITAL_INICIAL + aportaciones * APORTACION;
    let dividendos = 0;

    const porTicker = new Map();   // ticker -> {acciones, costo, dividendos}
    const movimientos = estado.movimientos
      .filter(m => m.semana <= semana)
      .sort((a, b) => a.semana - b.semana);

    /*
     * Cobra los dividendos de las semanas [pendiente, hasta] con las acciones que había
     * ENTRANDO a esas semanas — o sea, antes de aplicar el movimiento de `hasta`. De ahí
     * sale la regla: comprarla el día del pago no te lo gana, venderla ese día sí te lo deja.
     */
    let pendiente = 0;
    const cobrar = (hasta) => {
      if (hasta < pendiente) return;
      for (const [ticker, p] of porTicker) {
        if (p.acciones <= 0) continue;
        const pago = p.acciones * dividendosEntre(datos, ticker, pendiente, hasta);
        p.dividendos += pago;
        dividendos += pago;
        efectivo += pago;
      }
      pendiente = hasta + 1;
    };

    for (const mov of movimientos) {
      cobrar(mov.semana);
      const p = porTicker.get(mov.ticker) || { acciones: 0, costo: 0, dividendos: 0 };
      if (mov.tipo === 'compra') {
        efectivo -= mov.monto;
        p.acciones += mov.acciones;
        p.costo += mov.monto;
      } else {
        efectivo += mov.monto;
        // Costo promedio: al vender se retira la parte proporcional del costo.
        const parte = p.acciones > 0 ? mov.acciones / p.acciones : 0;
        p.costo -= p.costo * parte;
        p.acciones -= mov.acciones;
      }
      porTicker.set(mov.ticker, p);
    }
    cobrar(semana);

    const posiciones = [];
    let enEmpresas = 0;
    for (const [ticker, p] of porTicker) {
      if (p.acciones <= CENTAVO / 1000) continue;   // posición cerrada
      const e = buscar(datos, ticker);
      const px = precio(datos, ticker, semana);
      const valor = p.acciones * px;
      enEmpresas += valor;
      posiciones.push({
        ticker,
        nombre: e.nombre,
        tipo: e.tipo,
        acciones: p.acciones,
        precio: px,
        costo: p.costo,
        precioPromedio: p.costo / p.acciones,
        valor,
        dividendos: p.dividendos,
        paga: pagaDividendos(datos, ticker),
        ganancia: valor - p.costo,
        gananciaPct: p.costo > 0 ? (valor / p.costo - 1) * 100 : 0,
      });
    }
    posiciones.sort((a, b) => b.valor - a.valor);

    const aportado = CAPITAL_INICIAL + aportaciones * APORTACION;
    const total = efectivo + enEmpresas;
    return {
      semana,
      efectivo,
      enEmpresas,
      posiciones,
      aportaciones,
      aportado,
      dividendos,          // lo que le pagaron por tener, en total
      total,
      ganancia: total - aportado,
      gananciaPct: (total / aportado - 1) * 100,
    };
  }

  /* --- operar ------------------------------------------------------------ */

  /*
   * Comprar y vender NO tocan el estado: devuelven { ok, estado, error }.
   * Así el que llama decide si guarda, y de paso se prueban sin efectos raros.
   * (Trampa #3 de MasMoney: si cambias el estado, repinta tú. Aquí ni lo cambiamos.)
   */

  function comprar(estado, datos, semana, ticker, monto) {
    const px = precio(datos, ticker, semana);
    if (px === null) return fallo(`${ticker} todavía no existe en esta época`);
    if (!(monto > 0)) return fallo('Hay que poner cuánto quieres invertir');

    const foto = calcular(estado, datos, semana);
    if (monto > foto.efectivo + CENTAVO)
      return fallo(`Solo tienes ${dinero(foto.efectivo)} disponibles`);

    const real = Math.min(monto, foto.efectivo);     // deja el efectivo en cero exacto
    return hecho(estado, {
      tipo: 'compra', semana, ticker, monto: real, acciones: real / px, precio: px,
    });
  }

  /* `acciones` opcional: sin él se vende la posición completa. */
  function vender(estado, datos, semana, ticker, acciones) {
    const px = precio(datos, ticker, semana);
    if (px === null) return fallo(`${ticker} no existe en esta época`);

    const foto = calcular(estado, datos, semana);
    const pos = foto.posiciones.find(p => p.ticker === ticker);
    if (!pos) return fallo(`No tienes ${ticker}`);

    const n = acciones == null ? pos.acciones : acciones;
    if (!(n > 0)) return fallo('Hay que poner cuánto quieres vender');
    if (n > pos.acciones + 1e-9) return fallo(`Solo tienes ${pos.acciones.toFixed(4)} de ${ticker}`);

    const real = Math.min(n, pos.acciones);          // evita dejar polvo por redondeo
    return hecho(estado, {
      tipo: 'venta', semana, ticker, monto: real * px, acciones: real, precio: px,
    });
  }

  const fallo = (error) => ({ ok: false, error });
  const hecho = (estado, mov) => ({
    ok: true,
    movimiento: mov,
    estado: { ...estado, movimientos: [...estado.movimientos, mov] },
  });

  /* --- la historia, para la gráfica -------------------------------------- */

  /* Cuánto valía la cartera cada semana hasta hoy. Solo el pasado vivido. */
  function serieValor(estado, datos, hastaSemana) {
    const serie = [];
    for (let s = 0; s <= hastaSemana; s++) serie.push(calcular(estado, datos, s).total);
    return serie;
  }

  /*
   * La vara de medir: qué habría pasado metiendo TODO al SPY, el mismo dinero
   * en los mismos momentos, sin escoger nada. Es lo único que contesta
   * "¿me fue mejor que si no hubiera hecho nada?".
   */
  function serieReferencia(datos, hastaSemana, ticker = 'SPY') {
    const serie = [];
    let acciones = 0, suelto = 0, aportacionesPrevias = -1;
    for (let s = 0; s <= hastaSemana; s++) {
      const px = precio(datos, ticker, s);
      // El dividendo se cobra sobre lo que ya traía, y se queda en efectivo: la referencia
      // es "no hacer nada", y el niño tampoco reinvierte solo. Si aquí se reinvirtiera,
      // la vara de medir saldría inflada y la comparación sería trampa.
      if (s > 0) suelto += acciones * dividendosEntre(datos, ticker, s, s);
      const n = aportacionesA(datos, s);
      if (aportacionesPrevias < 0) acciones = CAPITAL_INICIAL / px;   // el capital inicial
      else if (n > aportacionesPrevias) acciones += (n - aportacionesPrevias) * APORTACION / px;
      aportacionesPrevias = n;
      serie.push(acciones * px + suelto);
    }
    return serie;
  }

  /* --- para la interfaz --------------------------------------------------- */

  const dinero = (n) => '$' + n.toLocaleString('es-MX',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  return {
    CAPITAL_INICIAL, APORTACION,
    nueva, calcular, comprar, vender, precio, existe,
    pagaDividendos, dividendosEntre,
    aportacionesA, anioDeBolsa, serieValor, serieReferencia, dinero,
  };
})();

</script>
<script>
/* ===== grafica.js ===== */
/*
 * StocKids — la gráfica.
 *
 * Dibuja la historia VIVIDA de la cartera. Nunca el futuro: aunque los precios de los
 * próximos años estén horneados en el archivo, `dibujar` corta en `hasta` y no hay forma
 * de pedirle más. La regla vive aquí adentro, no en el que llama.
 *
 * ⚠️ NADA DE MEDIR PÍXELES. Todo se dibuja en el sistema de coordenadas del `viewBox` y el
 * SVG se estira solo con `width:100%`. Así se esquiva de raíz la trampa #2 de MasMoney
 * (`zoom` rompe las unidades: `getBoundingClientRect()` da píxeles visuales y volver a
 * escribirlos los multiplica otra vez). Para el dedo, la conversión de pantalla a
 * coordenadas se hace con `getScreenCTM().inverse()`, que respeta cualquier escala.
 *
 * ⚠️ EL CSS TIENE QUE RESPETAR LA PROPORCIÓN:
 *
 *     svg { width: 100%; aspect-ratio: 320 / 180; }     <- ANCHO / ALTO
 *
 * Con `preserveAspectRatio="none"` y una altura fija en píxeles, X y Y se escalan distinto
 * y **la tipografía sale estirada**. Pasó el 15-ago-2026: 458×200 daba escala 1.43 contra
 * 1.11, o sea letras 29% más anchas. Hay una prueba que lo caza.
 */

const Grafica = (() => {
  'use strict';

  const ANCHO = 320, ALTO = 180;
  const LETRA = 8;    // en unidades del viewBox; a 480 px de ancho salen ~12 px reales
  const M = { arriba: 14, derecha: 8, abajo: 18, izquierda: 34 };
  const X0 = M.izquierda, X1 = ANCHO - M.derecha;
  const Y0 = M.arriba, Y1 = ALTO - M.abajo;

  const SVG = 'http://www.w3.org/2000/svg';
  const crear = (tag, attrs = {}) => {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  /* --- escalas ------------------------------------------------------------ */

  /* Redondea hacia arriba a 1, 2, 2.5 o 5 por potencia de diez: los números que
     una persona lee de un vistazo. */
  function pasoBonito(bruto) {
    const potencia = Math.pow(10, Math.floor(Math.log10(bruto)));
    const n = bruto / potencia;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * potencia;
  }

  function escalaY(min, max, rayas = 4) {
    if (max - min < 1e-9) { min -= 1; max += 1; }
    const paso = pasoBonito((max - min) / rayas);
    const piso = Math.floor(min / paso) * paso;
    const techo = Math.ceil(max / paso) * paso;
    const marcas = [];
    for (let v = piso; v <= techo + paso / 2; v += paso) marcas.push(v);
    return { piso, techo, marcas };
  }

  /* Dinero corto, para que quepa en el eje: $1.2k, $470k */
  function corto(n) {
    const a = Math.abs(n);
    if (a >= 1e6) return `$${(n / 1e6).toFixed(a >= 1e7 ? 0 : 1)}M`;
    if (a >= 1000) return `$${(n / 1000).toFixed(a >= 10000 ? 0 : 1)}k`;
    return `$${Math.round(n)}`;
  }

  /* --- dibujar ------------------------------------------------------------ */

  /*
   *  contenedor  el <svg> donde va
   *  semanas     fechas ISO horneadas
   *  hasta       la última semana VIVIDA. Se corta aquí y punto.
   *  series      [{nombre, valores, clase, punteada}]
   *
   * Devuelve un objeto con `leerEn(semana)` para el dedo.
   */
  function dibujar(contenedor, { semanas, hasta, series }) {
    const fin = Math.max(0, Math.min(hasta, semanas.length - 1));
    // Aquí muere el futuro: nadie de aquí para abajo ve un dato de después de `fin`.
    const cortadas = series.map(s => ({ ...s, valores: s.valores.slice(0, fin + 1) }));

    contenedor.setAttribute('viewBox', `0 0 ${ANCHO} ${ALTO}`);
    contenedor.setAttribute('preserveAspectRatio', 'none');
    contenedor.replaceChildren();

    let min = Infinity, max = -Infinity;
    for (const s of cortadas) for (const v of s.valores) {
      if (v < min) min = v;
      if (v > max) max = v;
    }
    const { piso, techo, marcas } = escalaY(min, max);

    const x = i => fin === 0 ? X0 : X0 + (i / fin) * (X1 - X0);
    const y = v => Y1 - ((v - piso) / (techo - piso)) * (Y1 - Y0);

    /* rayas horizontales con su cifra */
    for (const v of marcas) {
      const py = y(v);
      contenedor.append(
        crear('line', { class: 'raya', x1: X0, x2: X1, y1: py, y2: py }),
        // El tamaño va como atributo, no solo en CSS: el módulo tiene que verse bien
        // aunque quien lo use se olvide de darle estilo. El CSS puede sobreescribirlo.
        Object.assign(crear('text', {
          class: 'cifra', x: X0 - 4, y: py + 3,
          'font-size': LETRA, 'text-anchor': 'end',
        }), { textContent: corto(v) }));
    }

    /* años de bolsa abajo */
    let anioPrevio = null;
    for (let i = 0; i <= fin; i++) {
      const anio = semanas[i].slice(0, 4);
      if (anio === anioPrevio) continue;
      anioPrevio = anio;
      if (i === 0 && fin > 20) continue;          // el primero se encima con el eje
      contenedor.append(
        crear('line', { class: 'raya tenue', x1: x(i), x2: x(i), y1: Y0, y2: Y1 }),
        Object.assign(crear('text', {
          class: 'anio', x: x(i), y: ALTO - 5,
          'font-size': LETRA, 'text-anchor': 'middle',
        }), { textContent: anio }));
    }

    /* las líneas, y un punto gordo al final de cada una con su valor */
    for (const s of cortadas) {
      const d = s.valores.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(2)} ${y(v).toFixed(2)}`).join('');
      contenedor.append(crear('path', {
        class: `linea ${s.clase}`, d, 'vector-effect': 'non-scaling-stroke',
        ...(s.punteada ? { 'stroke-dasharray': '3 3' } : {}),
      }));
      contenedor.append(crear('circle', {
        class: `punta ${s.clase}`, cx: x(fin), cy: y(s.valores[fin]), r: 2.5,
      }));
    }

    /* la línea del dedo, escondida hasta que la toquen */
    const guia = crear('line', { class: 'guia', y1: Y0, y2: Y1, visibility: 'hidden' });
    contenedor.append(guia);

    return {
      fin,
      semanaEn(px) { return Math.round(((px - X0) / (X1 - X0)) * fin); },
      marcar(i) {
        if (i == null) { guia.setAttribute('visibility', 'hidden'); return null; }
        const s = Math.max(0, Math.min(i, fin));
        guia.setAttribute('x1', x(s));
        guia.setAttribute('x2', x(s));
        guia.setAttribute('visibility', 'visible');
        return { semana: s, fecha: semanas[s], valores: cortadas.map(c => c.valores[s]) };
      },
    };
  }

  /*
   * El dedo. Convierte con `getScreenCTM().inverse()` en vez de restar
   * `getBoundingClientRect()`: así funciona con cualquier escala y no repite la trampa #2.
   */
  function seguirElDedo(svg, pintado, alMover) {
    const punto = svg.createSVGPoint();
    const aCoordenadas = (ev) => {
      punto.x = ev.clientX;
      punto.y = ev.clientY;
      return punto.matrixTransform(svg.getScreenCTM().inverse()).x;
    };
    const mover = (ev) => {
      ev.preventDefault();
      alMover(pintado.marcar(pintado.semanaEn(aCoordenadas(ev))));
    };
    const soltar = () => alMover(pintado.marcar(null));

    svg.addEventListener('pointerdown', (ev) => { svg.setPointerCapture(ev.pointerId); mover(ev); });
    svg.addEventListener('pointermove', (ev) => { if (svg.hasPointerCapture(ev.pointerId)) mover(ev); });
    svg.addEventListener('pointerup', soltar);
    svg.addEventListener('pointercancel', soltar);
  }

  return { ANCHO, ALTO, dibujar, seguirElDedo, corto, escalaY, pasoBonito };
})();

</script>
<script>
'use strict';

/*
 * StocKids — la app.
 *
 * ⚠️ EL RELOJ ES EL ESTADO. Se guardan tres cosas y ninguna es un saldo:
 *      ancla        cuándo arrancó el juego
 *      semanaTope   la semana más alta ya vista (trinquete: el mundo no retrocede)
 *      movimientos  cada compra y cada venta
 * El efectivo, las posiciones, las aportaciones y los dividendos SE DERIVAN. Si el niño no
 * abre la app en dos semanas, al volver el mundo avanzó igual y el dinero le llegó igual.
 *
 * ⚠️ SI CAMBIAS EL ESTADO, REPINTA TÚ (trampa #3 de MasMoney). Toda función que toca el
 * estado llama a `pintar()` antes de terminar. No se le deja al que llama.
 *
 * ⚠️ NADA DE `rAF` PARA EL RELOJ (trampa #4): no se entrega con la pantalla apagada ni en
 * segundo plano. El latido va con `setInterval`, y además se repinta al volver a la app.
 */

(async () => {

const DATOS = DATOS_HORNEADOS;
const SEMANAS = DATOS.semanas;
const ULTIMA = SEMANAS.length - 1;

const CLAVE = 'stockids.v1';
const SK_VER = '20260815-2049';    // sello para saber si ya llegó la versión nueva

/* Solo para que Marco pueda ver cualquier momento sin esperarse meses. No se guarda (el
   trinquete no se mueve), no se anuncia, y el niño no tiene por qué encontrarlo.
   Se acepta por `?semana=272` y también por `#semana=272`: al compartir un link la parte
   de `?` a veces se pierde y la de `#` no. */
const ESPIA = new URLSearchParams(location.search).get('semana')
           ?? new URLSearchParams(location.hash.slice(1)).get('semana');

/* --- lo que se guarda --------------------------------------------------- */

function cargar() {
  try {
    const g = JSON.parse(localStorage.getItem(CLAVE));
    if (g && typeof g.ancla === 'number' && Array.isArray(g.movimientos)) return g;
  } catch (e) { /* si está corrupto, se empieza de nuevo */ }
  return Cartera.nueva(Date.now());
}
function guardar() { localStorage.setItem(CLAVE, JSON.stringify(estado)); }

let estado = cargar();
let vista = 'cartera';
let fichaAbierta = null;
let hoja = null;              // {tipo:'comprar'|'vender', ticker, monto, error}
let leyendo = null;           // lo que dice el dedo sobre la gráfica

/* --- el reloj ----------------------------------------------------------- */

function reloj() {
  if (ESPIA !== null) {
    const s = Math.max(0, Math.min(+ESPIA | 0, ULTIMA));
    return { semana: s, avance: 0, msParaSiguiente: null, terminado: s >= ULTIMA,
             relojAtrasado: false };
  }
  return Tiempo.calcular({
    anclaMs: estado.ancla, ahoraMs: Date.now(),
    totalSemanas: SEMANAS.length, semanaTope: estado.semanaTope,
  });
}

/* El trinquete se sube aquí y solo aquí. */
function adelantarTrinquete(r) {
  if (ESPIA === null && r.semana > estado.semanaTope) {
    estado.semanaTope = r.semana;
    guardar();
    return true;         // cambió de semana: hay algo nuevo que contarle
  }
  return false;
}

/* --- lo que pasó ESTA semana, derivado del reloj (sin guardar nada) ------ */

function novedades(semana) {
  if (semana <= 0) return { aportacion: 0, dividendos: 0, estrenos: [] };
  const hoy = Cartera.calcular(estado, DATOS, semana);
  const ayer = Cartera.calcular(estado, DATOS, semana - 1);
  return {
    aportacion: (hoy.aportaciones - ayer.aportaciones) * Cartera.APORTACION,
    dividendos: hoy.dividendos - ayer.dividendos,
    estrenos: DATOS.empresas.filter(e => e.desde === semana),
  };
}

/* --- ayudas de formato --------------------------------------------------- */

const $ = (sel, raiz = document) => raiz.querySelector(sel);
const dinero = Cartera.dinero;
const conSigno = n => `${n >= 0 ? '+' : '−'}${dinero(Math.abs(n))}`;
const pct = n => `${n >= 0 ? '+' : '−'}${Math.abs(n).toFixed(1)}%`;
const clase = n => n >= 0 ? 'sube' : 'baja';
const escapar = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Cambio de la semana para una empresa: lo que se movió el precio desde la anterior. */
function cambioSemanal(e, semana) {
  const hoy = Cartera.precio(DATOS, e.ticker, semana);
  const antes = Cartera.precio(DATOS, e.ticker, semana - 1);
  if (hoy === null || antes === null) return null;
  return (hoy / antes - 1) * 100;
}

/* --- pintar -------------------------------------------------------------- */

function pintar() {
  const r = reloj();
  adelantarTrinquete(r);
  const semana = r.semana;

  $('#epoca').textContent = Tiempo.comoTexto(Tiempo.fechaMercado(SEMANAS, semana, r.avance));
  $('#cuenta').innerHTML = r.terminado
    ? 'hasta aquí llega<br>la historia'
    : `próximo precio<br>en ${Tiempo.cuantoFalta(r.msParaSiguiente)}` +
      `<div class="barrita"><i style="width:${(r.avance * 100).toFixed(1)}%"></i></div>`;

  for (const b of document.querySelectorAll('nav button'))
    b.classList.toggle('puesto', b.dataset.ir === vista);

  const main = $('#vista');
  if (fichaAbierta) pintarFicha(main, semana);
  else if (vista === 'mercado') pintarMercado(main, semana);
  else pintarCartera(main, semana, r);

  main.insertAdjacentHTML('beforeend', `<div class="sello_ver">StocKids ${SK_VER}</div>`);
  pintarHoja(semana);
}

/* --- vista: mi dinero ---------------------------------------------------- */

function pintarCartera(main, semana, r) {
  const foto = Cartera.calcular(estado, DATOS, semana);
  const n = novedades(semana);

  const avisos = [];
  if (n.aportacion > 0) avisos.push(`<div class="aviso dinero"><span>◆</span><div>
    Llegó tu dinero del año: <b>${dinero(n.aportacion)}</b>. Es tuyo para invertir en lo
    que quieras… o para esperar.</div></div>`);
  if (n.dividendos > 0.005) avisos.push(`<div class="aviso pago"><span>●</span><div>
    Te pagaron <b>${dinero(n.dividendos)}</b> esta semana solo por tener tus empresas.
    No vendiste nada.</div></div>`);
  for (const e of n.estrenos) avisos.push(`<div class="aviso nueva"><span>★</span><div>
    <b>${escapar(e.nombre)}</b> acaba de salir a la bolsa. Antes no se podía comprar.</div></div>`);
  if (r.relojAtrasado) avisos.push(`<div class="aviso nueva"><span>!</span><div>
    El reloj de este aparato se movió hacia atrás. El mundo se queda quieto hasta que la
    fecha lo alcance.</div></div>`);

  main.innerHTML = `
    ${avisos.join('')}
    <div class="resumen">
      <div class="cifra" id="totalGrande">${dinero(foto.total)}</div>
      <div class="cambio ${clase(foto.ganancia)}" id="cambioGrande">
        ${foto.ganancia >= 0 ? '▲' : '▼'} ${dinero(Math.abs(foto.ganancia))}
        (${pct(foto.gananciaPct)})
        <small>sobre los ${dinero(foto.aportado)} que has metido</small>
      </div>
    </div>
    <div class="lienzo"><svg class="grafica" id="lienzoCartera"></svg></div>
    <div class="claves">
      <div class="clave"><i class="bolita" style="background:var(--verde)"></i>Tu dinero</div>
      <div class="clave"><i class="bolita" style="background:var(--ambar)"></i>Lo que metiste</div>
      <div class="clave"><i class="bolita" style="background:var(--gris)"></i>Sin escoger nada</div>
    </div>
    <div class="leido" id="leido"></div>
    <div class="tarjetas">
      <div class="tarjeta"><i>Sin invertir</i><b>${dinero(foto.efectivo)}</b></div>
      <div class="tarjeta"><i>Te han pagado por tener</i><b>${dinero(foto.dividendos)}</b></div>
    </div>
    ${foto.posiciones.length ? `
      <div class="titulo">Lo que tienes</div>
      <div class="lista">${foto.posiciones.map(p => `
        <button class="fila" data-ficha="${p.ticker}">
          <div class="quien">
            <div class="nombre">${escapar(p.nombre)}</div>
            <div class="abajo">${p.acciones.toFixed(2)} · ${dinero(p.precio)} c/u
              ${p.dividendos > 0.005
                ? `<span class="sello">+${dinero(p.dividendos)} pagados</span>` : ''}</div>
          </div>
          <div class="cuanto"><b>${dinero(p.valor)}</b>
            <i class="${clase(p.ganancia)}">${pct(p.gananciaPct)}</i></div>
        </button>`).join('')}</div>`
      : `<div class="vacio">
          <p>Todavía no tienes nada. Tienes <b>${dinero(foto.efectivo)}</b> esperando.<br>
          Nadie te apura: el dinero sin invertir no pierde nada aquí.</p>
          <button class="boton comprar" data-ir="mercado" style="max-width:220px;margin:0 auto">
            Ver las empresas</button>
        </div>`}
  `;

  const svg = $('#lienzoCartera');
  const pintado = Grafica.dibujar(svg, {
    semanas: SEMANAS, hasta: semana,
    series: [
      { nombre: 'Sin escoger nada', valores: serieSPY(), clase: 'referencia', punteada: true },
      { nombre: 'Lo que metiste', valores: serieMetido(), clase: 'metido' },
      { nombre: 'Tu dinero', valores: Cartera.serieValor(estado, DATOS, semana), clase: 'tuya' },
    ],
  });
  Grafica.seguirElDedo(svg, pintado, (dato) => {
    const caja = $('#leido');
    if (!dato) { caja.textContent = ''; return; }
    const [ref, metido, tuyo] = dato.valores;
    caja.innerHTML = `${Tiempo.comoTexto(Tiempo.fechaMercado(SEMANAS, dato.semana))}: ` +
      `tenías <b>${dinero(tuyo)}</b> · habías metido ${dinero(metido)} · ` +
      `sin escoger nada, ${dinero(ref)}`;
  });
}

/* Estas dos no dependen de los movimientos, así que se calculan una sola vez. */
let _spy = null, _metido = null;
const serieSPY = () => _spy || (_spy = Cartera.serieReferencia(DATOS, ULTIMA));
const serieMetido = () => _metido || (_metido = SEMANAS.map((_, s) =>
  Cartera.CAPITAL_INICIAL + Cartera.aportacionesA(DATOS, s) * Cartera.APORTACION));

/* --- vista: la bolsa ----------------------------------------------------- */

function pintarMercado(main, semana) {
  const foto = Cartera.calcular(estado, DATOS, semana);
  const mias = new Map(foto.posiciones.map(p => [p.ticker, p]));

  // Las que todavía no salen a bolsa NO se enseñan. Que aparezcan solas es la lección.
  const disponibles = DATOS.empresas.filter(e => e.desde <= semana);
  const orden = { empresa: 0, canasta: 1 };
  disponibles.sort((a, b) => (orden[a.tipo] - orden[b.tipo]) || a.nombre.localeCompare(b.nombre));

  main.innerHTML = `
    <div class="titulo">Puedes comprar ${disponibles.length} cosas · tienes ${dinero(foto.efectivo)}</div>
    <div class="lista">${disponibles.map(e => {
      const px = Cartera.precio(DATOS, e.ticker, semana);
      const cam = cambioSemanal(e, semana);
      return `<button class="fila" data-ficha="${e.ticker}">
        <div class="quien">
          <div class="nombre">${escapar(e.nombre)}
            ${e.tipo === 'canasta' ? '<span class="sello canasta">CANASTA</span>' : ''}</div>
          <div class="abajo">${escapar(e.nota)}</div>
        </div>
        <div class="cuanto"><b>${dinero(px)}</b>
          ${cam === null ? '' : `<i class="${clase(cam)}">${pct(cam)}</i>`}
          ${mias.has(e.ticker) ? '<i style="color:var(--tenue)">ya tienes</i>' : ''}</div>
      </button>`;
    }).join('')}</div>`;
}

/* --- vista: la ficha de una empresa -------------------------------------- */

function pintarFicha(main, semana) {
  const e = DATOS.empresas.find(x => x.ticker === fichaAbierta);
  const foto = Cartera.calcular(estado, DATOS, semana);
  const mia = foto.posiciones.find(p => p.ticker === e.ticker);
  const px = Cartera.precio(DATOS, e.ticker, semana);
  const cam = cambioSemanal(e, semana);

  // Los pagos que ya ocurrieron. Nunca los del futuro.
  const pagados = (e.dividendos || []).filter(([s]) => s <= semana);
  const ultimo = pagados[pagados.length - 1];

  main.innerHTML = `
    <button class="volver" data-volver="1">‹ Volver</button>
    <div class="ficha">
      <h2>${escapar(e.nombre)}</h2>
      <div class="ticker">${e.ticker}${e.tipo === 'canasta' ? ' · no es una empresa, es una canasta' : ''}</div>
      <div class="nota">${escapar(e.nota)}</div>
      <div class="datos">
        <div class="dato"><i>Precio</i><b>${dinero(px)}</b></div>
        <div class="dato"><i>Esta semana</i>
          <b class="${cam === null ? '' : clase(cam)}">${cam === null ? '—' : pct(cam)}</b></div>
      </div>
    </div>
    <div class="lienzo"><svg class="grafica" id="lienzoFicha"></svg></div>
    <div class="leido" id="leidoFicha"></div>
    ${pagados.length ? `<div class="reparto">
        <b>Te paga por tenerla.</b> ${escapar(e.nombre)} reparte parte de sus ganancias entre
        quienes tienen sus acciones. Van ${pagados.length} pagos; el último fue de
        <b>${dinero(ultimo[1])}</b> por acción.</div>`
      : `<div class="reparto no">${escapar(e.nombre)} <b>no reparte dividendos</b>: todo lo
        que gana se lo queda para crecer. Solo ganas si sube el precio.</div>`}
    ${mia ? `<div class="tengo">Tienes <b>${mia.acciones.toFixed(2)}</b> que valen
        <b>${dinero(mia.valor)}</b>. Te costaron <b>${dinero(mia.precioPromedio)}</b> cada una,
        o sea que vas <b class="${clase(mia.ganancia)}">${conSigno(mia.ganancia)}</b>.
        ${mia.dividendos > 0.005
          ? `Además te ha pagado <b>${dinero(mia.dividendos)}</b> en dividendos.` : ''}</div>` : ''}
    <div class="acciones">
      <button class="boton comprar" data-comprar="${e.ticker}"
        ${foto.efectivo < 1 ? 'disabled' : ''}>Comprar</button>
      <button class="boton vender" data-vender="${e.ticker}"
        ${mia ? '' : 'disabled'}>Vender</button>
    </div>`;

  // La gráfica del precio arranca cuando la empresa salió a bolsa, no antes.
  const svg = $('#lienzoFicha');
  const pintado = Grafica.dibujar(svg, {
    semanas: SEMANAS.slice(e.desde), hasta: semana - e.desde,
    series: [{ nombre: e.nombre, valores: e.precios, clase: 'precio' }],
  });
  Grafica.seguirElDedo(svg, pintado, (dato) => {
    const caja = $('#leidoFicha');
    caja.innerHTML = dato
      ? `${Tiempo.comoTexto(Tiempo.fechaMercado(SEMANAS, dato.semana + e.desde))}: ` +
        `<b>${dinero(dato.valores[0])}</b>`
      : '';
  });
}

/* --- la hoja de comprar y vender ----------------------------------------- */

function pintarHoja(semana) {
  const viejo = $('.fondoNegro');
  if (viejo) viejo.remove();
  if (!hoja) return;

  const e = DATOS.empresas.find(x => x.ticker === hoja.ticker);
  const foto = Cartera.calcular(estado, DATOS, semana);
  const px = Cartera.precio(DATOS, e.ticker, semana);
  const mia = foto.posiciones.find(p => p.ticker === e.ticker);
  const comprando = hoja.tipo === 'comprar';
  const tope = comprando ? foto.efectivo : (mia ? mia.valor : 0);
  const monto = Math.min(hoja.monto || 0, tope);
  const atajos = comprando
    ? [25, 50, 100, 'Todo'] : ['¼', '½', '¾', 'Todo'];
  const valorAtajo = (a) => comprando
    ? (a === 'Todo' ? tope : Math.min(a, tope))
    : tope * ({ '¼': .25, '½': .5, '¾': .75, 'Todo': 1 }[a]);

  document.getElementById('app').insertAdjacentHTML('beforeend', `
    <div class="fondoNegro" data-cerrar="1">
      <div class="hoja" data-nocerrar="1">
        <h3>${comprando ? 'Comprar' : 'Vender'} ${escapar(e.nombre)}</h3>
        <p class="pie">${comprando
          ? `Tienes ${dinero(foto.efectivo)} sin invertir · ${dinero(px)} por acción`
          : `Tienes ${mia ? mia.acciones.toFixed(2) : 0} acciones que valen ${dinero(tope)}`}</p>
        <div class="montos">${atajos.map(a => `
          <button data-atajo="${a}"
            ${Math.abs(valorAtajo(a) - monto) < 0.005 && monto > 0 ? 'class="elegido"' : ''}>
            ${comprando && a !== 'Todo' ? '$' + a : a}</button>`).join('')}</div>
        <div class="cuanto_input">
          <span>$</span>
          <input type="text" inputmode="decimal" id="montoInput"
                 value="${monto ? monto.toFixed(2) : ''}" placeholder="0.00">
        </div>
        <div class="previo">${monto > 0
          ? (comprando
            ? `Te llevas <b>${(monto / px).toFixed(4)}</b> acciones de ${escapar(e.nombre)}.
               Te quedan ${dinero(foto.efectivo - monto)} sin invertir.`
            : `Vendes <b>${(monto / px).toFixed(4)}</b> acciones y recibes
               <b>${dinero(monto)}</b> en efectivo.`)
          : 'Escribe cuánto, o toca uno de los botones de arriba.'}</div>
        <div class="error">${hoja.error ? escapar(hoja.error) : ''}</div>
        <div class="acciones" style="padding:0">
          <button class="boton vender" data-cerrar="1">Cancelar</button>
          <button class="boton comprar" data-hacer="1" ${monto > 0 ? '' : 'disabled'}>
            ${comprando ? 'Comprar' : 'Vender'}</button>
        </div>
      </div>
    </div>`);
}

function ejecutar(semana) {
  const e = DATOS.empresas.find(x => x.ticker === hoja.ticker);
  const px = Cartera.precio(DATOS, e.ticker, semana);
  const r = hoja.tipo === 'comprar'
    ? Cartera.comprar(estado, DATOS, semana, hoja.ticker, hoja.monto)
    : Cartera.vender(estado, DATOS, semana, hoja.ticker, hoja.monto / px);

  if (!r.ok) { hoja.error = r.error; pintar(); return; }
  estado = r.estado;
  guardar();
  hoja = null;
  pintar();                 // si cambias el estado, repinta TÚ (trampa #3)
}

/* --- toques --------------------------------------------------------------- */

document.addEventListener('click', (ev) => {
  const semana = reloj().semana;
  // `data-nocerrar` va en la hoja misma y tiene que estar en esta lista: así `closest`
  // la encuentra ANTES que el fondo negro y tocar la hoja no la cierra. Los botones de
  // adentro siguen ganando porque están más cerca del toque.
  const t = ev.target.closest('[data-ir],[data-ficha],[data-volver],[data-comprar],' +
                              '[data-vender],[data-cerrar],[data-atajo],[data-hacer],' +
                              '[data-nocerrar]');
  if (!t) return;

  if (t.dataset.nocerrar) return;
  if (t.dataset.ir)      { vista = t.dataset.ir; fichaAbierta = null; }
  if (t.dataset.ficha)   { fichaAbierta = t.dataset.ficha; }
  if (t.dataset.volver)  { fichaAbierta = null; }
  if (t.dataset.comprar) { hoja = { tipo: 'comprar', ticker: t.dataset.comprar, monto: 0 }; }
  if (t.dataset.vender)  { hoja = { tipo: 'vender', ticker: t.dataset.vender, monto: 0 }; }
  if (t.dataset.cerrar)  { hoja = null; }
  if (t.dataset.atajo) {
    const foto = Cartera.calcular(estado, DATOS, semana);
    const mia = foto.posiciones.find(p => p.ticker === hoja.ticker);
    const tope = hoja.tipo === 'comprar' ? foto.efectivo : (mia ? mia.valor : 0);
    const a = t.dataset.atajo;
    hoja.monto = hoja.tipo === 'comprar'
      ? (a === 'Todo' ? tope : Math.min(+a, tope))
      : tope * ({ '¼': .25, '½': .5, '¾': .75, 'Todo': 1 }[a]);
    hoja.error = null;
  }
  if (t.dataset.hacer) { ejecutar(semana); return; }
  pintar();
});

document.addEventListener('input', (ev) => {
  if (ev.target.id !== 'montoInput' || !hoja) return;
  hoja.monto = parseFloat(ev.target.value.replace(',', '.')) || 0;
  hoja.error = null;
  // A propósito NO se repinta aquí: repintar mientras escribe le quitaría el teclado.
  // El previo se actualiza al soltar (blur) o al tocar un botón.
});
document.addEventListener('change', (ev) => { if (ev.target.id === 'montoInput') pintar(); });

/* --- el latido ------------------------------------------------------------ */

let semanaPintada = -1;
function latir() {
  const r = reloj();
  const cambio = r.semana !== semanaPintada;
  semanaPintada = r.semana;
  if (cambio) pintar();
  else if (!hoja) {          // solo el relojito, para no tirarle lo que esté haciendo
    $('#cuenta').innerHTML = r.terminado
      ? 'hasta aquí llega<br>la historia'
      : `próximo precio<br>en ${Tiempo.cuantoFalta(r.msParaSiguiente)}` +
        `<div class="barrita"><i style="width:${(r.avance * 100).toFixed(1)}%"></i></div>`;
  }
}
setInterval(latir, 30000);                                   // nada de rAF: trampa #4
document.addEventListener('visibilitychange', () => { if (!document.hidden) latir(); });
window.addEventListener('focus', latir);

pintar();
semanaPintada = reloj().semana;
window.listo = true;         // para las pruebas automáticas
})();
</script>

<script>
/* El service worker la vuelve instalable y la deja abrir sin internet.
   `updateViaCache:'none'` obliga a revalidar sw.js: si no, GitHub Pages lo deja cacheado
   10 minutos y la versión nueva tarda en llegar. Se busca actualización al abrir y cada vez
   que vuelve a la app; cuando el service worker nuevo toma el control, se recarga UNA vez.
   Lo de recargar importa aquí más que en MasMoney: el mundo avanza con el reloj, así que
   volver a la app siempre tiene que traer la foto de hoy. */
if ('serviceWorker' in navigator) {
  var _recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (_recargando) return;
    _recargando = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      reg.update();
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) reg.update();
      });
    }).catch(function (e) { console.warn('sw:', e); });
  });
}
</script>
</html>
