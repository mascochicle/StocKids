<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>StocKids</title>
<style>
  /* Oscuro es el de casa. El claro se elige en Ajustes, y "Sistema" sigue al teléfono.
     TODO color estructural pasa por una variable justamente para que el tema sea un solo
     cambio de arriba y no haya que perseguir colores sueltos por el archivo. */
  :root {
    --fondo:#0e1116; --panel:#161b23; --panel2:#1c232d; --borde:#232b36;
    --afuera:#05070a; --raya:#1a212b;
    --texto:#e8edf2; --suave:#8b9bad; --tenue:#5b6b7d;
    --verde:#4ade80; --rojo:#f87171; --ambar:#f0b429; --gris:#7c8ea3;
    /* El texto que va ENCIMA del verde. En noche el verde es claro y pide tinta
       oscura; en día el verde es oscuro y pide tinta blanca. */
    --sobreVerde:#06251a;
    --alto:56px;
  }
  :root[data-tema="claro"] {
    --fondo:#ffffff; --panel:#f5f7fa; --panel2:#e9edf3; --borde:#dde3ea;
    --afuera:#e9edf3; --raya:#eef1f5;
    --texto:#111820; --suave:#5b6b7d; --tenue:#8b9bad;
    /* Verde y rojo más oscuros: los del tema noche no se leen sobre blanco. */
    --verde:#15803d; --rojo:#c62828; --ambar:#a16207; --gris:#64748b;
    --sobreVerde:#ffffff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html, body { margin:0; background:var(--afuera); color:var(--texto);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif }
  /* ⚠️ ALTURA FIJA, no `min-height`. Con `min-height` el contenedor crece con el contenido,
     el `overflow` de `main` nunca entra, y la página entera se desplaza llevándose la barra
     de pestañas. Lo cachó Marco el 15-ago-2026: la barra se le corría al bajar. */
  html, body { height:100dvh; overflow:hidden }
  body { display:flex; justify-content:center }

  /* Probar SIEMPRE a 480 px: es el ancho real de su S25 Ultra, no 393. */
  #app { width:480px; max-width:100%; background:var(--fondo); position:relative;
         display:flex; flex-direction:column; height:100dvh; overflow:hidden }

  /* --- encabezado --- */
  header { padding:14px 18px 10px; display:flex; align-items:flex-start; gap:10px }
  .marca { font-weight:800; font-size:17px; letter-spacing:-.4px; flex:1 }
  .marca span { color:var(--verde) }
  .epoca { color:var(--suave); font-size:12.5px; margin-top:2px }
  .cuenta { text-align:right; color:var(--tenue); font-size:11px; line-height:1.3 }
  .barrita { width:64px; height:3px; background:var(--borde); border-radius:2px; margin-top:4px;
             margin-left:auto; overflow:hidden }
  .barrita i { display:block; height:100%; background:var(--verde); border-radius:2px }

  main { flex:1; padding:0 0 16px; overflow-y:auto; -webkit-overflow-scrolling:touch }

  /* --- avisos --- */
  .aviso { margin:0 14px 10px; padding:11px 13px; border-radius:12px; font-size:13.5px;
           display:flex; gap:9px; align-items:flex-start; line-height:1.4 }
  .aviso.dinero { background:rgba(240,180,41,.12); border:1px solid rgba(240,180,41,.3) }
  .aviso.pago   { background:rgba(74,222,128,.1); border:1px solid rgba(74,222,128,.28) }
  .aviso.nueva  { background:rgba(124,142,163,.12); border:1px solid rgba(124,142,163,.3) }
  .aviso b { font-weight:700 }

  /* --- resumen --- */
  .resumen { padding:2px 18px 0 }
  .resumen .cifra { font-size:40px; font-weight:800; letter-spacing:-1.8px; line-height:1.05;
                    font-variant-numeric:tabular-nums }
  .cambio { font-size:14px; font-weight:600; margin-top:3px }
  .sube { color:var(--verde) } .baja { color:var(--rojo) }
  .cambio small { color:var(--suave); font-weight:400 }

  .lienzo { padding:10px 10px 0 }
  svg.grafica { width:100%; aspect-ratio:320/180; display:block; touch-action:none }
  .raya { stroke:var(--borde); stroke-width:1 }
  .raya.tenue { stroke:var(--raya) }
  .cifra_eje, text.cifra { fill:var(--suave) }
  text.anio { fill:var(--tenue) }
  .linea { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round }
  .linea.tuya { stroke:var(--verde) }
  .linea.metido { stroke:var(--ambar); stroke-width:1.5 }
  .linea.referencia { stroke:var(--gris); stroke-width:1.5 }
  .linea.precio { stroke:var(--verde) }
  .punta.tuya, .punta.precio { fill:var(--verde) }
  .punta.metido { fill:var(--ambar) } .punta.referencia { fill:var(--gris) }
  .guia { stroke:var(--texto); stroke-width:1; opacity:.45 }
  /* Velas: verde si cerró arriba de donde abrió, rojo si abajo. Como en cualquier app de
     bolsa, y sin depender del CSS de la página (el módulo también pone lo suyo). */
  .mecha { stroke-width:1 }
  .mecha.sube { stroke:var(--verde) }  .mecha.baja { stroke:var(--rojo) }
  .cuerpo.sube { fill:var(--verde) }   .cuerpo.baja { fill:var(--rojo) }

  /* Chips de vista: día, semana y mes. Los pidió Marco el 15-ago-2026. */
  .vistas { display:flex; gap:6px; padding:8px 18px 0 }
  .vistas button { flex:1; height:30px; border-radius:9px; border:1px solid var(--borde);
                   background:var(--panel); color:var(--suave); font:inherit; font-size:12.5px;
                   font-weight:650; cursor:pointer }
  .vistas button.puesta { background:var(--panel2); color:var(--texto); border-color:var(--tenue) }

  .claves { display:flex; gap:13px; flex-wrap:wrap; padding:6px 18px 0; font-size:12px;
            color:var(--suave) }
  .clave { display:flex; align-items:center; gap:6px }
  .bolita { width:8px; height:8px; border-radius:50%; flex:none }

  .leido { padding:8px 18px 0; font-size:13px; color:var(--suave); min-height:20px }
  .leido b { color:var(--texto) }

  /* --- listas --- */
  .titulo { padding:18px 18px 8px; font-size:12px; font-weight:700; letter-spacing:.8px;
            text-transform:uppercase; color:var(--tenue) }
  .lista { padding:0 14px; display:flex; flex-direction:column; gap:8px }
  .fila { display:flex; align-items:center; gap:12px; background:var(--panel);
          border:1px solid var(--borde); border-radius:14px; padding:12px 14px;
          text-align:left; width:100%; color:inherit; font:inherit; cursor:pointer }
  .fila:active { background:var(--panel2) }
  .fila .quien { flex:1; min-width:0 }
  .fila .nombre { font-weight:650; font-size:15px; white-space:nowrap; overflow:hidden;
                  text-overflow:ellipsis }
  .fila .abajo { color:var(--suave); font-size:12px; margin-top:1px; display:flex;
                 gap:6px; align-items:center }
  .fila .cuanto { text-align:right; font-variant-numeric:tabular-nums; flex:none }
  .fila .cuanto b { display:block; font-weight:650; font-size:15px }
  .fila .cuanto i { font-style:normal; font-size:12.5px; font-weight:600 }

  .sello { font-size:10px; font-weight:700; letter-spacing:.3px; padding:1px 6px;
           border-radius:5px; background:rgba(240,180,41,.16); color:var(--ambar); flex:none }
  .sello.canasta { background:rgba(124,142,163,.18); color:var(--gris) }

  /* --- el círculo del logo --- */
  .logo { width:38px; height:38px; border-radius:50%; flex:none; overflow:hidden;
          background:#fff; display:grid; place-items:center }
  .logo img { width:100%; height:100%; object-fit:cover; display:block }
  .logo b { font-size:13px; font-weight:800; letter-spacing:-.3px }
  .logo.grande { width:52px; height:52px }
  .logo.grande b { font-size:17px }

  /* Ticker arriba y nombre abajo, como en las apps de bolsa de verdad: así se le van
     pegando los tickers, que es el idioma en el que habla el mercado. */
  .fila .tick { font-weight:750; font-size:16px; letter-spacing:.2px }
  .fila .quien .nombre_chico { color:var(--suave); font-size:12.5px; margin-top:1px;
     white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  /* El porcentaje es lo que se lee de un vistazo, así que va más grande y más fuerte que
     el cambio en dinero. Es lo que le da el aire de app de bolsa. */
  .fila .cuanto .mueve { font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;
                         margin-top:2px }
  .fila .cuanto .mueve span { font-size:12.5px; font-weight:600; opacity:.7; margin-right:6px }
  .quieto { color:var(--suave) }

  /* Tres tarjetas: invertido, sin invertir y lo cobrado. La de "invertido" la pidió Marco el
     16-ago-2026 — sin ella solo se veía el dinero parado, que es media foto. */
  .tarjetas { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:10px 14px 0 }
  .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:14px;
             padding:10px 11px; min-width:0 }
  .tarjeta i { font-style:normal; color:var(--suave); font-size:11px; display:block;
               margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  /* El dinero se encoge si no cabe, en vez de desbordar la tarjeta: con NVIDIA una cartera
     puede llegar a seis cifras. */
  .tarjeta b { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;
               display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

  .vacio { margin:14px; padding:22px 18px; text-align:center; background:var(--panel);
           border:1px dashed var(--borde); border-radius:16px }
  .vacio p { color:var(--suave); font-size:13.5px; margin:0 0 14px; line-height:1.5 }

  /* --- ficha --- */
  .volver { background:none; border:none; color:var(--suave); font:inherit; font-size:14px;
            padding:12px 18px 0; cursor:pointer; display:flex; align-items:center; gap:6px }
  .ficha { padding:6px 18px 0 }
  .ficha .encabezado { display:flex; align-items:center; gap:13px }
  .ficha h2 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.8px }
  .ficha .ticker { color:var(--tenue); font-size:13px; font-weight:600; letter-spacing:.5px }
  .ficha .nota { color:var(--suave); font-size:13.5px; margin-top:8px; line-height:1.45 }
  .datos { display:flex; gap:22px; margin-top:14px }
  .dato i { font-style:normal; display:block; color:var(--tenue); font-size:11px;
            text-transform:uppercase; letter-spacing:.6px }
  .dato b { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums }
  .dato em { font-style:normal; font-size:13px; font-weight:600; margin-left:7px;
             opacity:.7; font-variant-numeric:tabular-nums }

  .reparto { margin:14px 18px 0; padding:12px 14px; border-radius:13px; font-size:13px;
             line-height:1.45; background:rgba(240,180,41,.09);
             border:1px solid rgba(240,180,41,.22); color:var(--texto) }
  .reparto.no { background:var(--panel); border-color:var(--borde); color:var(--suave) }
  .reparto.partida { background:rgba(124,142,163,.12); border-color:rgba(124,142,163,.3) }
  .reparto.partida b { color:var(--texto) }
  .reparto b { color:var(--ambar) }

  .tengo { margin:12px 18px 0; padding:12px 14px; border-radius:13px; background:var(--panel);
           border:1px solid var(--borde); font-size:13.5px; color:var(--suave) }
  .tengo b { color:var(--texto); font-variant-numeric:tabular-nums }

  /* --- botones --- */
  .acciones { display:flex; gap:10px; padding:16px 18px 0 }
  button.boton { flex:1; height:48px; border-radius:14px; border:none; font:inherit;
                 font-size:15.5px; font-weight:700; cursor:pointer }
  .comprar { background:var(--verde); color:var(--sobreVerde) }
  .vender  { background:var(--panel2); color:var(--texto); border:1px solid var(--borde) }
  button:disabled { opacity:.4; cursor:default }
  button.boton:active { transform:translateY(1px) }

  /* --- pestañas --- */
  nav { display:flex; border-top:1px solid var(--borde); background:var(--fondo);
        padding-bottom:env(safe-area-inset-bottom) }
  nav button { flex:1; background:none; border:none; color:var(--tenue); font:inherit;
               font-size:12.5px; font-weight:600; padding:11px 0 13px; cursor:pointer;
               display:flex; flex-direction:column; align-items:center; gap:3px }
  nav button.puesto { color:var(--verde) }
  nav .icono { font-size:17px; line-height:1 }

  /* --- hoja de comprar/vender --- */
  .fondoNegro { position:absolute; inset:0; background:rgba(3,5,8,.72); display:flex;
                align-items:flex-end; z-index:10 }
  .hoja { width:100%; background:var(--fondo); border-top-left-radius:22px;
          border-top-right-radius:22px; border-top:1px solid var(--borde);
          padding:20px 18px calc(20px + env(safe-area-inset-bottom)) }
  .hoja h3 { margin:0 0 4px; font-size:20px; font-weight:800; letter-spacing:-.5px }
  .hoja .pie { color:var(--suave); font-size:13px; margin:0 0 16px }
  .montos { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px }
  .montos button { height:44px; border-radius:12px; background:var(--panel2);
                   border:1px solid var(--borde); color:var(--texto); font:inherit;
                   font-weight:650; cursor:pointer }
  .montos button.elegido { background:var(--verde); color:var(--sobreVerde); border-color:var(--verde) }
  .cuanto_input { display:flex; align-items:center; gap:8px; background:var(--panel);
                  border:1px solid var(--borde); border-radius:13px; padding:12px 14px;
                  margin-bottom:12px }
  .cuanto_input span { color:var(--suave); font-size:20px; font-weight:700 }
  .cuanto_input input { flex:1; background:none; border:none; color:var(--texto);
                        font:inherit; font-size:22px; font-weight:700; outline:none;
                        font-variant-numeric:tabular-nums; min-width:0 }
  .previo { color:var(--suave); font-size:13px; margin-bottom:14px; line-height:1.45 }
  .previo b { color:var(--texto) }
  .error { color:var(--rojo); font-size:13px; margin-bottom:12px; min-height:18px }

  /* --- ajustes --- */
  .ajuste { margin:0 14px 8px; background:var(--panel); border:1px solid var(--borde);
            border-radius:14px; padding:13px 15px }
  .ajuste h3 { margin:0 0 3px; font-size:15px; font-weight:700 }
  .ajuste p { margin:0; color:var(--suave); font-size:12.5px; line-height:1.45 }
  .ajuste p b { color:var(--texto); font-variant-numeric:tabular-nums }
  .temas { display:flex; gap:7px; margin-top:11px }
  .temas button { flex:1; height:38px; border-radius:11px; border:1px solid var(--borde);
                  background:var(--panel2); color:var(--suave); font:inherit; font-size:13px;
                  font-weight:650; cursor:pointer }
  .temas button.puesta { background:var(--verde); color:var(--fondo); border-color:var(--verde) }
  .ajuste button.ancho { width:100%; height:44px; margin-top:11px; border-radius:12px;
                         border:1px solid var(--borde); background:var(--panel2);
                         color:var(--texto); font:inherit; font-size:14.5px; font-weight:650;
                         cursor:pointer }
  .ajuste button.ancho:disabled { opacity:.5 }

  .sello_ver { text-align:center; color:var(--tenue); opacity:.45; font-size:10px; padding:10px 0 4px;
               letter-spacing:.5px; user-select:none }

  /* --- de quién es esto --- */
  /* Nada de flex aquí: con flex, "El dinero de" y el nombre son dos cajas y se parten en
     dos renglones. Texto normal y el lápiz pegado con ::after. */
  .dueno { background:none; border:none; padding:0 0 3px; font:inherit; font-size:14px;
           font-weight:600; color:var(--suave); letter-spacing:.1px; cursor:pointer;
           text-align:left; display:block }
  .dueno u { text-decoration:none; color:var(--texto); font-weight:750 }
  .dueno::after { content:' ✎'; font-size:11px; color:var(--tenue) }

  /* --- la bienvenida: solo la primera vez --- */
  .bienvenida { flex:1; display:flex; flex-direction:column; justify-content:center;
                padding:28px 26px calc(28px + env(safe-area-inset-bottom)); gap:0 }
  .bienvenida .logo { font-size:34px; font-weight:800; letter-spacing:-1.2px }
  .bienvenida .logo span { color:var(--verde) }
  .bienvenida .trato { color:var(--suave); font-size:14.5px; line-height:1.6; margin:14px 0 0 }
  .bienvenida .trato b { color:var(--texto); font-weight:650 }
  .bienvenida label { display:block; margin:26px 0 8px; font-size:13px; font-weight:700;
                      letter-spacing:.6px; text-transform:uppercase; color:var(--tenue) }
  .bienvenida input { width:100%; background:var(--panel); border:1px solid var(--borde);
                      border-radius:14px; padding:15px 16px; color:var(--texto); font:inherit;
                      font-size:20px; font-weight:700; outline:none }
  .bienvenida input:focus { border-color:var(--verde) }
  .bienvenida .aguas { color:var(--tenue); font-size:12px; line-height:1.5; margin:12px 0 0 }
  .bienvenida button { margin-top:20px; width:100%; height:52px; border-radius:15px;
                       border:none; background:var(--verde); color:var(--sobreVerde); font:inherit;
                       font-size:16px; font-weight:800; cursor:pointer }
  .bienvenida button:disabled { opacity:.35; cursor:default }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StocKids">
<link rel="apple-touch-icon" href="icon-192.png">


<div id="app">
  <header>
    <div>
      <div class="marca">Stoc<span>Kids</span></div>
      <div class="epoca" id="epoca">—</div>
    </div>
    <div class="cuenta" id="cuenta"></div>
  </header>
  <main id="vista"></main>
  <nav>
    <button data-ir="cartera" class="puesto"><span class="icono">◈</span>Mi dinero</button>
    <button data-ir="mercado"><span class="icono">≡</span>La bolsa</button>
    <button data-ir="ajustes"><span class="icono">⚙</span>Ajustes</button>
  </nav>
</div>

<script>
/* ===== datos.js ===== */
/*
 * StocKids — el decodificador de los datos horneados.
 *
 * 4,684 días por 17 empresas en JSON plano son 472 KB: demasiado para un teléfono. Por eso
 * el extractor los guarda como DIFERENCIAS en centavos, escritas en base 36 y separadas por
 * punto. Baja a 241 KB y reconstruye idéntico, centavo por centavo.
 *
 * Descomprimir las 17 series toma unos milisegundos y se hace una sola vez al arrancar.
 * De aquí en adelante todo el resto de la app trabaja con números normales.
 */

const Datos = (() => {
  'use strict';

  const MS_DIA = 24 * 60 * 60 * 1000;

  /* "1a.-3.5" -> [46, 43, 48]: cada trozo es la diferencia contra el anterior. */
  function descomprimir(texto, salida) {
    let valor = 0, i = 0, inicio = 0;
    const n = texto.length;
    for (let p = 0; p <= n; p++) {
      if (p !== n && texto[p] !== '.') continue;
      valor += parseInt(texto.slice(inicio, p), 36);
      salida[i++] = valor;
      inicio = p + 1;
    }
    return salida;
  }

  const cuantos = (texto) => {
    if (!texto) return 0;
    let n = 1;
    for (let i = 0; i < texto.length; i++) if (texto[i] === '.') n++;
    return n;
  };

  /* Convierte lo horneado en algo con lo que se pueda trabajar. */
  function preparar(crudo) {
    const total = cuantos(crudo.dias);
    const dias = descomprimir(crudo.dias, new Int32Array(total));   // días desde `base`

    const [a, m, d] = crudo.base.split('-').map(Number);
    const baseMs = Date.UTC(a, m - 1, d);

    /* Los tres extras de la vela van SIN diferencias: ya son números chicos. */
    const sueltos = (texto) => {
      const n = cuantos(texto);
      const salida = new Int32Array(n);
      let i = 0, inicio = 0;
      for (let p = 0; p <= texto.length; p++) {
        if (p !== texto.length && texto[p] !== '.') continue;
        salida[i++] = parseInt(texto.slice(inicio, p), 36);
        inicio = p + 1;
      }
      return salida;
    };

    const empresas = crudo.empresas.map(e => {
      const cuenta = cuantos(e.precios);
      const centavos = descomprimir(e.precios, new Int32Array(cuenta));
      const precios = new Float64Array(cuenta);
      for (let i = 0; i < cuenta; i++) precios[i] = centavos[i] / 100;
      return { ...e, precios, centavos,
               _ape: sueltos(e.ape || ''), _alta: sueltos(e.alta || ''),
               _baja: sueltos(e.baja || '') };
    });

    /*
     * ⚠️ Dónde EMPIEZA LA PARTIDA. Los datos arrancan en 2008 y el juego en 2015: los siete
     * años de en medio son historia para que las gráficas tengan pasado desde el primer día,
     * no partida que se juegue. Todo lo que cuente "desde que empezó" mide contra `arranque`,
     * nunca contra 0.
     */
    const [ja, jm, jd] = (crudo.inicioJuego || crudo.base).split('-').map(Number);
    const inicioMs = Date.UTC(ja, jm - 1, jd);
    let arranque = 0;
    while (arranque < total - 1 && baseMs + dias[arranque] * MS_DIA < inicioMs) arranque++;

    return {
      ...crudo,
      dias, baseMs, empresas, arranque,
      n: total,
      fechaMs: (i) => baseMs + dias[i] * MS_DIA,
      fecha: (i) => new Date(baseMs + dias[i] * MS_DIA).toISOString().slice(0, 10),
      anio: (i) => new Date(baseMs + dias[i] * MS_DIA).getUTCFullYear(),
    };
  }

  /*
   * La vela de un día: apertura, máximo, mínimo y cierre.
   *
   * El detalle real solo está guardado desde que empieza la partida (ver el extractor: los
   * cuatro valores para los 4,684 días serían 798 KB). Antes de eso se arma una vela honesta
   * con lo que hay: cuerpo del cierre de ayer al de hoy, sin mechas. Nunca se inventa un
   * máximo que no se sabe.
   */
  function vela(e, i) {
    const k = i - e.desde;
    const c = e.precios[k];
    const previo = k > 0 ? e.precios[k - 1] : c;
    const j = i - (e.velasDesde ?? Infinity);
    if (j < 0 || j >= e._ape.length) return { a: previo, alto: Math.max(previo, c), bajo: Math.min(previo, c), c, aproximada: true };

    const a = (k > 0 ? e.centavos[k - 1] : Math.round(c * 100)) + e._ape[j];
    const cuerpoAlto = Math.max(a, e.centavos[k]), cuerpoBajo = Math.min(a, e.centavos[k]);
    return {
      a: a / 100,
      alto: (cuerpoAlto + e._alta[j]) / 100,
      bajo: (cuerpoBajo - e._baja[j]) / 100,
      c, aproximada: false,
    };
  }

  /*
   * Junta varios días en UNA vela: abre donde abrió el primero, cierra donde cerró el último,
   * y toma el máximo y el mínimo de todo el tramo. Así la vista de semana y la de mes tienen
   * velas de verdad sin guardar un solo dato extra.
   */
  function velaDe(e, desde, hasta) {
    const primera = vela(e, desde);
    let alto = primera.alto, bajo = primera.bajo, aproximada = primera.aproximada, c = primera.c;
    for (let i = desde + 1; i <= hasta; i++) {
      const v = vela(e, i);
      if (v.alto > alto) alto = v.alto;
      if (v.bajo < bajo) bajo = v.bajo;
      aproximada = aproximada || v.aproximada;
      c = v.c;
    }
    return { a: primera.a, alto, bajo, c, aproximada };
  }

  return { preparar, descomprimir, cuantos, vela, velaDe, MS_DIA };
})();

<script>
/* ===== tiempo.js ===== */
/*
 * StocKids — motor del tiempo.
 *
 * El corazón de la app: dice en qué día de bolsa vamos HOY.
 *
 * Regla de Marco: un año de bolsa por cada mes de vida real. O sea que el mundo corre
 * exactamente 12 veces más rápido (12 años de bolsa por año real). De ahí sale todo:
 * un día de bolsa = 24 h / 12 = **2 horas reales**.
 *
 * ⚠️ EL RELOJ ES EL ESTADO. Lo único que se guarda es el ANCLA (cuándo arrancó el juego).
 * Nunca "voy en el día 37": si no abre la app en dos semanas, el mundo tiene que haber
 * avanzado igual. Todo lo demás se deriva del tiempo transcurrido.
 *
 * Se guarda UNA cosa más, y es a propósito: `diaTope`, el día más alto ya visto. Sirve de
 * trinquete para que el mundo NUNCA retroceda. Si el reloj de la tablet se mueve hacia atrás
 * (o el niño lo mueve para deshacer una venta de la que se arrepintió), el mundo se queda
 * quieto en vez de borrarle historia a la cartera.
 *
 * ⚠️ EL CALENDARIO MANDA, NO EL CONTEO. Antes esto contaba semanas parejas; ahora se calcula
 * la FECHA de bolsa y se busca el último día en que hubo mercado. Por eso los fines de
 * semana el precio no se mueve: la bolsa está cerrada, igual que en la vida real.
 */

const Tiempo = (() => {
  'use strict';

  const RITMO = 12;                       // años de bolsa por año real
  const MS_DIA = 24 * 60 * 60 * 1000;
  const MS_POR_DIA_BOLSA = MS_DIA / RITMO;   // 2 horas reales por día de bolsa

  /* El último índice cuyo día ya pasó. Búsqueda binaria: se llama en cada latido. */
  function ultimoDiaHasta(dias, corrido) {
    if (corrido < dias[0]) return 0;
    let bajo = 0, alto = dias.length - 1;
    while (bajo < alto) {
      const medio = (bajo + alto + 1) >> 1;
      if (dias[medio] <= corrido) bajo = medio; else alto = medio - 1;
    }
    return bajo;
  }

  /*
   * Calcula el estado del mundo. Función pura: mismas entradas, misma salida.
   * Recibe `ahoraMs` en vez de leer el reloj para poder probarla con saltos de tiempo.
   *
   *   anclaMs   cuándo arrancó el juego (epoch ms)
   *   ahoraMs   ahora (epoch ms)
   *   dias      el calendario de días con mercado (Int32Array de `Datos.preparar`)
   *   arranque  índice donde EMPIEZA la partida (2015; lo de antes es historia para las
   *             gráficas). El tiempo transcurrido se cuenta desde ahí, no desde 2008.
   *   diaTope   el día más alto visto antes (-1 si es la primera vez)
   *
   * Devuelve:
   *   dia              índice en el calendario
   *   avance           0..1 hacia el siguiente día CON MERCADO
   *   msParaSiguiente  cuánto falta para el próximo precio (null si ya no hay más)
   *   terminado        se acabó la pista de datos
   *   relojAtrasado    el reloj del aparato se movió hacia atrás; el mundo está congelado
   *   cerrado          hoy no hay mercado allá (sábado, domingo o feriado)
   */
  function calcular({ anclaMs, ahoraMs, dias, arranque = 0, diaTope = -1 }) {
    const ultimo = dias.length - 1;
    const transcurrido = Math.max(0, ahoraMs - anclaMs);   // ancla en el futuro => día 0
    // El tiempo se cuenta desde el día del ARRANQUE, no desde el principio de los datos.
    const corrido = dias[arranque] + transcurrido / MS_POR_DIA_BOLSA;

    const derivado = Math.max(arranque, ultimoDiaHasta(dias, corrido));
    const dia = Math.min(Math.max(derivado, diaTope), ultimo);
    const terminado = derivado >= ultimo;
    const relojAtrasado = derivado < diaTope;

    let avance, msParaSiguiente;
    if (terminado) {
      avance = 1;
      msParaSiguiente = null;
    } else if (relojAtrasado) {
      avance = 0;                                          // congelado hasta que lo alcance
      msParaSiguiente = Math.max(0, (dias[dia + 1] - corrido) * MS_POR_DIA_BOLSA);
    } else {
      const de = dias[dia], a = dias[dia + 1];
      avance = (corrido - de) / (a - de);
      msParaSiguiente = (a - corrido) * MS_POR_DIA_BOLSA;
    }

    return {
      dia, avance, msParaSiguiente, terminado, relojAtrasado,
      // Si el calendario de bolsa se quedó atrás del día corrido, allá es fin de semana o
      // feriado: no es que la app esté trabada, es que el mercado está cerrado.
      cerrado: !terminado && Math.floor(corrido) > dias[dia],
      corrido,
    };
  }

  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
    'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  /* "12 de marzo de 2020" — con datos diarios ya se puede decir el día exacto. */
  function comoTexto(fecha, conDia = false) {
    const mes = MESES[fecha.getUTCMonth()], anio = fecha.getUTCFullYear();
    return conDia ? `${fecha.getUTCDate()} de ${mes} de ${anio}` : `${mes} de ${anio}`;
  }

  /* "2 h" / "35 min" — para el "próximo precio en…". */
  function cuantoFalta(ms) {
    if (ms == null) return null;
    const min = Math.round(ms / 60000);
    if (min < 60) return `${min} min`;
    const h = Math.floor(min / 60), resto = min % 60;
    return resto ? `${h} h ${resto} min` : `${h} h`;
  }

  return { RITMO, MS_POR_DIA_BOLSA, calcular, ultimoDiaHasta, comoTexto, cuantoFalta };
})();

</script>
<script>
/* ===== cartera.js ===== */
/*
 * StocKids — la cartera.
 *
 * Comprar, vender, y saber cuánto vale hoy y cuánto cambió.
 *
 * ⚠️ MISMO PATRÓN QUE EL RELOJ: no se guarda ningún saldo. Se guarda la lista de movimientos
 * (cada compra y cada venta, con el día en que ocurrió) y TODO lo demás se deriva. Las
 * aportaciones ni siquiera se guardan: se cuentan del calendario, porque si el niño no abre
 * la app en dos meses su dinero tuvo que haber llegado igual.
 *
 * ⚠️ LOS ÍNDICES SON DÍAS DE BOLSA, no semanas, y **no** arrancan en cero. Los datos empiezan
 * en 2008 pero la partida empieza en 2015 (`datos.arranque`): lo de antes es historia para
 * que las gráficas tengan pasado, no partida que se juegue. Todo lo que cuente "desde que
 * empezó" tiene que medir contra `datos.arranque`, nunca contra 0.
 *
 * Decisiones de diseño que tienen razón de ser (no cambiarlas sin releer la idea pedagógica):
 *
 *  - **Se compra por monto, no por número de acciones.** "Quiero meterle 200 dólares a
 *    Nintendo" es como piensa la gente; "quiero 3.4 acciones" no. Eso obliga a permitir
 *    fracciones, que además es lo que hacen las apps de verdad.
 *  - **No hay comisiones.** El freno contra operar seguido ya está en el mundo: un precio
 *    por día y solo en días hábiles. No hace falta un cobro escondido además.
 *  - **Costo promedio** para la ganancia de cada posición. Es lo único explicable a un niño:
 *    "te costaron en promedio X, hoy valen Y".
 *  - **Los dividendos caen como EFECTIVO, no se reinvierten solos.** Marco los pidió el
 *    15-ago-2026 para que el niño sepa que hay empresas que te pagan por tenerlas. Si se
 *    reinvirtieran automáticamente no vería nada; cayendo como dinero, los ve llegar y
 *    decide. Además premia justo lo que queremos: aguantar.
 *  - **La regla del dividendo: te lo pagan si ya la tenías ANTES de ese día.** Comprarla el
 *    mismo día del pago no te lo gana; venderla ese día sí te lo deja.
 */

const Cartera = (() => {
  'use strict';

  const CAPITAL_INICIAL = 1000;   // USD, lo decidió Marco
  const APORTACION = 50;          // USD por cada Año Nuevo de bolsa (= cada mes real)
  const CENTAVO = 0.01;

  /* --- lo que se guarda ------------------------------------------------- */
  /* Nada de saldos. Solo el ancla del reloj y los movimientos. */
  const nueva = (anclaMs) => ({ ancla: anclaMs, diaTope: -1, movimientos: [] });

  /* --- ayudas sobre los datos horneados --------------------------------- */

  const buscar = (datos, ticker) => datos.empresas.find(e => e.ticker === ticker);

  /* Precio de ese día, o null si todavía no sale a bolsa (Roblox antes de 2021). */
  function precio(datos, ticker, dia) {
    const e = buscar(datos, ticker);
    if (!e || dia < e.desde) return null;
    return e.precios[dia - e.desde];
  }

  const existe = (datos, ticker, dia) => precio(datos, ticker, dia) !== null;

  const pagaDividendos = (datos, ticker) => (buscar(datos, ticker).dividendos || []).length > 0;

  /*
   * Suma acumulada de dividendos por acción, día por día. Se calcula una vez por empresa y
   * se guarda: `serieValor` llama a `calcular` cientos de veces y sin esto cada llamada
   * volvería a recorrer todos los pagos.
   */
  const cacheDividendos = new WeakMap();
  function acumulado(datos, ticker) {
    let porEmpresa = cacheDividendos.get(datos);
    if (!porEmpresa) cacheDividendos.set(datos, porEmpresa = new Map());
    let acc = porEmpresa.get(ticker);
    if (acc) return acc;

    const pagos = buscar(datos, ticker).dividendos || [];
    acc = new Float64Array(datos.n);
    let suma = 0, i = 0;
    for (let s = 0; s < acc.length; s++) {
      while (i < pagos.length && pagos[i][0] === s) suma += pagos[i++][1];
      acc[s] = suma;
    }
    porEmpresa.set(ticker, acc);
    return acc;
  }

  /* Lo que pagó una acción entre dos días, ambos incluidos. */
  function dividendosEntre(datos, ticker, desde, hasta) {
    if (hasta < desde) return 0;
    const acc = acumulado(datos, ticker);
    return acc[hasta] - (desde > 0 ? acc[desde - 1] : 0);
  }

  /* Cuántas aportaciones lleva recibidas: una por cada Año Nuevo de bolsa DESDE QUE EMPEZÓ.
     Se deriva del calendario, no se guarda, así que el dinero llega aunque no abra la app. */
  const aportacionesA = (datos, dia) =>
    datos.anio(dia) - datos.anio(datos.arranque);

  /* --- el estado de la cartera en un día dado ---------------------------- */

  /*
   * Recorre los movimientos hasta `dia` y arma la foto. Función pura.
   * Devuelve efectivo, cada posición con su ganancia, y los totales.
   */
  function calcular(estado, datos, dia) {
    const aportaciones = aportacionesA(datos, dia);
    let efectivo = CAPITAL_INICIAL + aportaciones * APORTACION;
    let dividendos = 0;

    const porTicker = new Map();   // ticker -> {acciones, costo, dividendos}
    const movimientos = estado.movimientos
      .filter(m => m.dia <= dia)
      .sort((a, b) => a.dia - b.dia);

    /*
     * Cobra los dividendos de los días [pendiente, hasta] con las acciones que había
     * ENTRANDO a esos días — o sea, antes de aplicar el movimiento de `hasta`. De ahí sale
     * la regla: comprarla el día del pago no te lo gana, venderla ese día sí te lo deja.
     */
    let pendiente = datos.arranque;
    const cobrar = (hasta) => {
      if (hasta < pendiente) return;
      for (const [ticker, p] of porTicker) {
        if (p.acciones <= 0) continue;
        const pago = p.acciones * dividendosEntre(datos, ticker, pendiente, hasta);
        p.dividendos += pago;
        dividendos += pago;
        efectivo += pago;
      }
      pendiente = hasta + 1;
    };

    for (const mov of movimientos) {
      cobrar(mov.dia);
      const p = porTicker.get(mov.ticker) || { acciones: 0, costo: 0, dividendos: 0 };
      if (mov.tipo === 'compra') {
        efectivo -= mov.monto;
        p.acciones += mov.acciones;
        p.costo += mov.monto;
      } else {
        efectivo += mov.monto;
        // Costo promedio: al vender se retira la parte proporcional del costo.
        const parte = p.acciones > 0 ? mov.acciones / p.acciones : 0;
        p.costo -= p.costo * parte;
        p.acciones -= mov.acciones;
      }
      porTicker.set(mov.ticker, p);
    }
    cobrar(dia);

    const posiciones = [];
    let enEmpresas = 0;
    for (const [ticker, p] of porTicker) {
      if (p.acciones <= CENTAVO / 1000) continue;   // posición cerrada
      const e = buscar(datos, ticker);
      const px = precio(datos, ticker, dia);
      const valor = p.acciones * px;
      enEmpresas += valor;
      posiciones.push({
        ticker,
        nombre: e.nombre,
        tipo: e.tipo,
        acciones: p.acciones,
        precio: px,
        costo: p.costo,
        precioPromedio: p.costo / p.acciones,
        valor,
        dividendos: p.dividendos,
        paga: pagaDividendos(datos, ticker),
        ganancia: valor - p.costo,
        gananciaPct: p.costo > 0 ? (valor / p.costo - 1) * 100 : 0,
      });
    }
    posiciones.sort((a, b) => b.valor - a.valor);

    const aportado = CAPITAL_INICIAL + aportaciones * APORTACION;
    const total = efectivo + enEmpresas;
    return {
      dia, efectivo, enEmpresas, posiciones, aportaciones, aportado,
      dividendos,          // lo que le pagaron por tener, en total
      total,
      ganancia: total - aportado,
      gananciaPct: (total / aportado - 1) * 100,
    };
  }

  /* --- operar ------------------------------------------------------------ */

  /*
   * Comprar y vender NO tocan el estado: devuelven { ok, estado, error }. Así el que llama
   * decide si guarda, y de paso se prueban sin efectos raros. (Trampa #3 de MasMoney: si
   * cambias el estado, repinta tú. Aquí ni lo cambiamos.)
   */

  function comprar(estado, datos, dia, ticker, monto) {
    const px = precio(datos, ticker, dia);
    if (px === null) return fallo(`${ticker} todavía no existe en esta época`);
    if (!(monto > 0)) return fallo('Hay que poner cuánto quieres invertir');

    const foto = calcular(estado, datos, dia);
    if (monto > foto.efectivo + CENTAVO)
      return fallo(`Solo tienes ${dinero(foto.efectivo)} disponibles`);

    const real = Math.min(monto, foto.efectivo);     // deja el efectivo en cero exacto
    return hecho(estado, {
      tipo: 'compra', dia, ticker, monto: real, acciones: real / px, precio: px,
    });
  }

  /* `acciones` opcional: sin él se vende la posición completa. */
  function vender(estado, datos, dia, ticker, acciones) {
    const px = precio(datos, ticker, dia);
    if (px === null) return fallo(`${ticker} no existe en esta época`);

    const foto = calcular(estado, datos, dia);
    const pos = foto.posiciones.find(p => p.ticker === ticker);
    if (!pos) return fallo(`No tienes ${ticker}`);

    const n = acciones == null ? pos.acciones : acciones;
    if (!(n > 0)) return fallo('Hay que poner cuánto quieres vender');
    if (n > pos.acciones + 1e-9) return fallo(`Solo tienes ${pos.acciones.toFixed(4)} de ${ticker}`);

    const real = Math.min(n, pos.acciones);          // evita dejar polvo por redondeo
    return hecho(estado, {
      tipo: 'venta', dia, ticker, monto: real * px, acciones: real, precio: px,
    });
  }

  const fallo = (error) => ({ ok: false, error });
  const hecho = (estado, mov) => ({
    ok: true,
    movimiento: mov,
    estado: { ...estado, movimientos: [...estado.movimientos, mov] },
  });

  /* --- la historia, para la gráfica -------------------------------------- */

  /*
   * Cuánto valía la cartera cada día VIVIDO. Arranca en `datos.arranque`, no en 0: antes de
   * eso el niño no existía en este mundo. El índice 0 del arreglo es el día del arranque.
   */
  function serieValor(estado, datos, hastaDia) {
    const serie = [];
    for (let d = datos.arranque; d <= hastaDia; d++) serie.push(calcular(estado, datos, d).total);
    return serie;
  }

  /*
   * La vara de medir: qué habría pasado metiendo TODO al SPY, el mismo dinero en los mismos
   * momentos, sin escoger nada. Es lo único que contesta "¿me fue mejor que si no hubiera
   * hecho nada?". También empieza en `datos.arranque`.
   */
  function serieReferencia(datos, hastaDia, ticker = 'SPY') {
    const serie = [];
    let acciones = 0, suelto = 0, previas = -1;
    for (let d = datos.arranque; d <= hastaDia; d++) {
      const px = precio(datos, ticker, d);
      // El dividendo se cobra sobre lo que ya traía y se queda en efectivo: la referencia es
      // "no hacer nada", y el niño tampoco reinvierte solo. Reinvertir aquí inflaría la vara
      // de medir y la comparación sería trampa.
      if (d > datos.arranque) suelto += acciones * dividendosEntre(datos, ticker, d, d);
      const n = aportacionesA(datos, d);
      if (previas < 0) acciones = CAPITAL_INICIAL / px;          // el capital inicial
      else if (n > previas) acciones += (n - previas) * APORTACION / px;
      previas = n;
      serie.push(acciones * px + suelto);
    }
    return serie;
  }

  /* --- para la interfaz --------------------------------------------------- */

  const dinero = (n) => '$' + n.toLocaleString('es-MX',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  return {
    CAPITAL_INICIAL, APORTACION,
    nueva, calcular, comprar, vender, precio, existe,
    pagaDividendos, dividendosEntre,
    aportacionesA, serieValor, serieReferencia, dinero,
  };
})();

</script>
<script>
/* ===== grafica.js ===== */
/*
 * StocKids — la gráfica.
 *
 * Dibuja la historia VIVIDA. Nunca el futuro: aunque los precios de los próximos años estén
 * horneados en el archivo, `dibujar` tira todo índice mayor que `hasta` y no hay forma de
 * pedirle más. La regla vive aquí adentro, no en el que llama.
 *
 * ⚠️ NADA DE MEDIR PÍXELES. Todo se dibuja en el sistema de coordenadas del `viewBox` y el
 * SVG se estira solo con `width:100%`. Así se esquiva de raíz la trampa #2 de MasMoney
 * (`zoom` rompe las unidades). Para el dedo, la conversión de pantalla a coordenadas se hace
 * con `getScreenCTM().inverse()`, que respeta cualquier escala.
 *
 * ⚠️ EL CSS TIENE QUE RESPETAR LA PROPORCIÓN:
 *
 *     svg { width: 100%; aspect-ratio: 320 / 180; }     <- ANCHO / ALTO
 *
 * Con `preserveAspectRatio="none"` y una altura fija en píxeles, X y Y se escalan distinto y
 * **la tipografía sale estirada**. Pasó el 15-ago-2026: 458×200 daba escala 1.43 contra 1.11,
 * o sea letras 29% más anchas. Hay una prueba que lo caza.
 */

const Grafica = (() => {
  'use strict';

  const ANCHO = 320, ALTO = 180;
  const LETRA = 8;    // en unidades del viewBox; a 480 px de ancho salen ~12 px reales
  const M = { arriba: 14, derecha: 8, abajo: 18, izquierda: 34 };
  const X0 = M.izquierda, X1 = ANCHO - M.derecha;
  const Y0 = M.arriba, Y1 = ALTO - M.abajo;

  const SVG = 'http://www.w3.org/2000/svg';
  const crear = (tag, attrs = {}) => {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  /* --- las tres vistas: diaria, semanal y mensual ------------------------- */

  /*
   * Las pidió Marco el 15-ago-2026, y no son solo un zoom: cambian el TAMAÑO del paso y la
   * VENTANA a la vez, igual que en una app de bolsa de verdad.
   *
   *   día     un punto por día hábil, últimos ~3 meses. Se ve el zangoloteo.
   *   semana  un punto por semana, últimos ~2 años. Se ve la tendencia.
   *   mes     un punto por mes, TODA la historia que haya. Se ven las crisis enteras.
   *
   * `paso` va en días hábiles (5 = una semana, 21 ≈ un mes). Trabajar en días hábiles y no
   * en el calendario evita huecos raros por fines de semana y feriados.
   */
  /*
   * ⚠️ LAS VENTANAS ESTÁN CALIBRADAS PARA VELAS, no para líneas. Una línea aguanta 200
   * puntos; una vela con 200 en pantalla queda de un píxel y no se lee. El tope cómodo son
   * ~45-75 velas: a 480 px de ancho eso da cuerpos de 4 a 7 px.
   *
   * "Todo" va por trimestres justo por eso: 18.6 años en velas mensuales serían 223 velas
   * de un pelo, y en trimestrales son 74 que sí se ven.
   */
  const VISTAS = {
    dia:    { etiqueta: 'Día',    paso: 1,  ventana: 44 },     // ~2 meses
    semana: { etiqueta: 'Semana', paso: 5,  ventana: 260 },    // ~1 año
    mes:    { etiqueta: 'Mes',    paso: 21, ventana: 1260 },   // ~5 años
    todo:   { etiqueta: 'Todo',   paso: 63, ventana: Infinity },  // trimestres
  };

  /*
   * Los índices a dibujar. Se cuenta HACIA ATRÁS desde el último día para que el punto de
   * hoy caiga siempre exacto: contando hacia adelante, el precio de hoy podría quedar entre
   * dos puntos y la línea terminaría en un valor viejo.
   */
  function muestreo(primero, ultimo, vista) {
    const v = VISTAS[vista] || VISTAS.dia;
    const arranca = v.ventana === Infinity
      ? primero : Math.max(primero, ultimo - v.ventana + 1);
    const indices = [];
    for (let i = ultimo; i >= arranca; i -= v.paso) indices.push(i);
    if (indices[indices.length - 1] !== arranca) indices.push(arranca);
    return indices.reverse();
  }

  const vistasDisponibles = () =>
    Object.entries(VISTAS).map(([clave, v]) => ({ clave, etiqueta: v.etiqueta }));

  /*
   * Los índices de una ventana cualquiera, con el paso ajustado solo para que no se
   * amontonen. Es lo que usa el arrastre y el pellizco: la ventana es libre, y aquí se
   * decide si cada vela vale un día, una semana o un trimestre.
   */
  const MAX_VELAS = 70;
  function muestreoVentana(desde, hasta, maxVelas = MAX_VELAS) {
    const ancho = Math.max(1, hasta - desde + 1);
    const paso = Math.max(1, Math.ceil(ancho / maxVelas));
    const indices = [];
    for (let i = hasta; i >= desde; i -= paso) indices.push(i);
    if (indices[indices.length - 1] !== desde) indices.push(desde);
    return indices.reverse();
  }

  /* La ventana que le toca a cada chip, para poder volver a ella tras haber arrastrado. */
  function ventanaDe(vista, primero, ultimo) {
    const v = VISTAS[vista] || VISTAS.dia;
    const ancho = v.ventana === Infinity ? ultimo - primero + 1 : v.ventana;
    return { desde: Math.max(primero, ultimo - ancho + 1), hasta: ultimo };
  }

  /* --- escalas ------------------------------------------------------------ */

  /* Redondea hacia arriba a 1, 2, 2.5 o 5 por potencia de diez: los números que una persona
     lee de un vistazo. */
  function pasoBonito(bruto) {
    const potencia = Math.pow(10, Math.floor(Math.log10(bruto)));
    const n = bruto / potencia;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * potencia;
  }

  function escalaY(min, max, rayas = 4) {
    if (max - min < 1e-9) { min -= 1; max += 1; }
    const paso = pasoBonito((max - min) / rayas);
    const piso = Math.floor(min / paso) * paso;
    const techo = Math.ceil(max / paso) * paso;
    const marcas = [];
    for (let v = piso; v <= techo + paso / 2; v += paso) marcas.push(v);
    return { piso, techo, marcas };
  }

  /*
   * Dinero corto, para que quepa en el eje: $1.2k, $470k, $0.48.
   *
   * ⚠️ Los centavos IMPORTAN. NVIDIA en 2009 cuesta $0.48 porque se partió 40 veces, y
   * redondeando a enteros el eje entero decía "$1 $1 $1 $0 $0 $0" — seis etiquetas y ningún
   * dato. Lo cachó Marco el 16-ago-2026 con una captura.
   */
  function corto(n, decimales) {
    const a = Math.abs(n);
    if (a >= 1e6) return `$${(n / 1e6).toFixed(a >= 1e7 ? 0 : 1)}M`;
    if (a >= 1000) return `$${(n / 1000).toFixed(a >= 10000 ? 0 : 1)}k`;
    // Todo el eje lleva los MISMOS decimales, que se deciden por el salto entre rayas y no
    // por cada número: "$1.0" junto a "$0.20" se ve descuidado.
    if (decimales != null) return `$${n.toFixed(decimales)}`;
    if (a >= 10 || a === 0) return `$${Math.round(n)}`;
    return `$${n.toFixed(a >= 1 ? 1 : 2)}`;
  }

  /* Cuántos decimales pide un eje cuyas rayas van de `paso` en `paso`. */
  const decimalesDe = (paso) => paso >= 10 ? 0 : paso >= 1 ? 1 : paso >= 0.1 ? 2 : 3;

  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun',
    'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  /* --- dibujar ------------------------------------------------------------ */

  /*
   *  contenedor  el <svg> donde va
   *  indices     qué días dibujar (de `muestreo`)
   *  hasta       el último día VIVIDO. Aquí muere el futuro, pase lo que pase.
   *  fecha       (i) -> 'YYYY-MM-DD'
   *  series      [{nombre, valor:(i)=>number, clase, punteada}]
   *
   * Devuelve un objeto con `marcar(pos)` para el dedo.
   */
  function dibujar(contenedor, { indices, hasta, ventana, fecha, series }) {
    // Aquí muere el futuro: nadie de aquí para abajo ve un dato de después de `hasta`.
    const vistos = indices.filter(i => i <= hasta);
    if (!vistos.length) vistos.push(hasta);
    const fin = vistos.length - 1;

    /*
     * ⚠️ El eje horizontal va por la VENTANA, no por los puntos dibujados. Si la ventana se
     * pasa del día de hoy, ese pedazo se queda VACÍO en vez de estirar las velas para llenar
     * el ancho. Es lo que pidió Marco el 16-ago-2026 señalando el "espacio sin precio" de
     * TradingView: poder correr la gráfica y dejar aire a la derecha.
     *
     * Y sigue sin enseñar el futuro: en ese hueco no se dibuja nada porque no hay nada.
     */
    const v0 = ventana ? Math.min(ventana.desde, vistos[0]) : vistos[0];
    const v1 = ventana ? Math.max(ventana.hasta, vistos[fin]) : vistos[fin];

    contenedor.setAttribute('viewBox', `0 0 ${ANCHO} ${ALTO}`);
    contenedor.setAttribute('preserveAspectRatio', 'none');
    contenedor.replaceChildren();

    const valores = series.map(s => vistos.map(s.valor));
    let min = Infinity, max = -Infinity;
    for (const fila of valores) for (const v of fila) {
      if (v < min) min = v;
      if (v > max) max = v;
    }
    // La escala tiene que dar cabida a las MECHAS, no solo a los cierres: si no, la vela del
    // día más movido sale cortada por arriba.
    for (const s of series) {
      if (!s.velas) continue;
      for (let i = 0; i <= fin; i++) {
        const v = s.velas(vistos[i], i === 0 ? vistos[i] : vistos[i - 1] + 1);
        if (!v) continue;
        if (v.bajo < min) min = v.bajo;
        if (v.alto > max) max = v.alto;
      }
    }
    const { piso, techo, marcas } = escalaY(min, max);

    // `x` recibe un DÍA, no una posición del arreglo.
    const x = d => v1 === v0 ? X0 : X0 + ((d - v0) / (v1 - v0)) * (X1 - X0);
    const y = v => Y1 - ((v - piso) / (techo - piso)) * (Y1 - Y0);

    /* rayas horizontales con su cifra */
    const decs = marcas.length > 1 ? decimalesDe(marcas[1] - marcas[0]) : null;
    for (const v of marcas) {
      const py = y(v);
      contenedor.append(
        crear('line', { class: 'raya', x1: X0, x2: X1, y1: py, y2: py }),
        // El tamaño va como atributo, no solo en CSS: el módulo tiene que verse bien aunque
        // quien lo use se olvide de darle estilo. El CSS puede sobreescribirlo.
        Object.assign(crear('text', {
          class: 'cifra', x: X0 - 4, y: py + 3,
          'font-size': LETRA, 'text-anchor': 'end',
        }), { textContent: corto(v, decs) }));
    }

    /* Marcas de tiempo abajo. Si el tramo abarca más de dos años se rotula por año; si no,
       por mes: en la vista de día, doce "2026" seguidos no dicen nada. */
    const primera = fecha(vistos[0]), ultima = fecha(vistos[fin]);
    const porAnio = (+ultima.slice(0, 4) - +primera.slice(0, 4)) >= 2;
    let previo = null;
    for (let i = 0; i <= fin; i++) {
      const f = fecha(vistos[i]);
      const clave = porAnio ? f.slice(0, 4) : f.slice(0, 7);
      if (clave === previo) continue;
      previo = clave;
      if (i === 0 && fin > 8) continue;              // el primero se encima con el eje
      const texto = porAnio ? clave : MESES[+f.slice(5, 7) - 1];
      const px = x(vistos[i]);
      contenedor.append(
        crear('line', { class: 'raya tenue', x1: px, x2: px, y1: Y0, y2: Y1 }),
        Object.assign(crear('text', {
          class: 'anio', x: px, y: ALTO - 5,
          'font-size': LETRA, 'text-anchor': 'middle',
        }), { textContent: texto }));
    }

    /*
     * Velas. Cada una es un tramo: del punto anterior hasta este. El cuerpo va de la
     * apertura al cierre y la mecha del mínimo al máximo. Verde si cerró arriba de donde
     * abrió, rojo si abajo — que es como se leen en cualquier app de bolsa.
     */
    const velas = series.find(s => s.velas);
    if (velas) {
      // El ancho sale del hueco entre dos velas EN DÍAS, no de repartir la pantalla: con
      // espacio vacío a la derecha, repartir daría velas más anchas de la cuenta.
      const saltoDias = fin > 0 ? (vistos[fin] - vistos[0]) / fin : 1;
      const paso = (X1 - X0) * saltoDias / Math.max(1, v1 - v0);
      const ancho = Math.max(1.2, Math.min(paso * 0.62, 9));
      for (let i = 0; i <= fin; i++) {
        const v = velas.velas(vistos[i], i === 0 ? vistos[i] : vistos[i - 1] + 1);
        if (!v) continue;
        const sube = v.c >= v.a;
        const cx = x(vistos[i]);
        const yA = y(v.a), yC = y(v.c);
        contenedor.append(crear('line', {
          class: `mecha ${sube ? 'sube' : 'baja'}`,
          x1: cx, x2: cx, y1: y(v.alto), y2: y(v.bajo),
          'vector-effect': 'non-scaling-stroke',
        }));
        contenedor.append(crear('rect', {
          class: `cuerpo ${sube ? 'sube' : 'baja'}`,
          x: cx - ancho / 2, width: ancho,
          // Un cuerpo de altura cero desaparece: se le deja el mínimo para que se vea la raya
          // del día en que abrió y cerró igual.
          y: Math.min(yA, yC), height: Math.max(Math.abs(yA - yC), 0.6),
        }));
      }
    }

    /* las líneas, y un punto gordo al final de cada una */
    series.forEach((s, k) => {
      if (s.velas) return;                     // esa ya se dibujó como velas
      const d = valores[k].map((v, i) =>
        `${i ? 'L' : 'M'}${x(vistos[i]).toFixed(2)} ${y(v).toFixed(2)}`).join('');
      contenedor.append(crear('path', {
        class: `linea ${s.clase}`, d, 'vector-effect': 'non-scaling-stroke',
        ...(s.punteada ? { 'stroke-dasharray': '3 3' } : {}),
      }));
      contenedor.append(crear('circle', {
        class: `punta ${s.clase}`, cx: x(vistos[fin]), cy: y(valores[k][fin]), r: 2.5,
      }));
    });

    /* la línea del dedo, escondida hasta que la toquen */
    const guia = crear('line', { class: 'guia', y1: Y0, y2: Y1, visibility: 'hidden' });
    contenedor.append(guia);

    return {
      fin,
      dias: vistos,
      // De píxel a posición del arreglo, pasando por el DÍA: con hueco a la derecha las dos
      // cosas ya no son lo mismo.
      posEn(px) {
        const dia = v0 + ((px - X0) / (X1 - X0)) * (v1 - v0);
        let mejor = 0, cerca = Infinity;
        for (let i = 0; i <= fin; i++) {
          const d = Math.abs(vistos[i] - dia);
          if (d < cerca) { cerca = d; mejor = i; }
        }
        return mejor;
      },
      marcar(pos) {
        if (pos == null) { guia.setAttribute('visibility', 'hidden'); return null; }
        const p = Math.max(0, Math.min(pos, fin));
        guia.setAttribute('x1', x(vistos[p]));
        guia.setAttribute('x2', x(vistos[p]));
        guia.setAttribute('visibility', 'visible');
        return { dia: vistos[p], fecha: fecha(vistos[p]), valores: valores.map(v => v[p]) };
      },
    };
  }

  /*
   * Los gestos, como en TradingView (Marco mandó el video el 15-ago-2026):
   *
   *   arrastrar con un dedo   mueve la gráfica en el tiempo
   *   pellizcar con dos       acerca y aleja
   *   dejar el dedo quieto    saca la cruz para leer un día  (350 ms)
   *
   * Un solo `pointerdown` no sabe todavía si va a ser un arrastre o una lectura, así que se
   * espera: si en 350 ms el dedo no se movió, es lectura; si se movió antes, es arrastre.
   * Sin esa espera, cada intento de leer un precio movería la gráfica.
   *
   * ⚠️ Se convierte con `getScreenCTM().inverse()` en vez de restar `getBoundingClientRect()`:
   * así funciona con cualquier escala y no repite la trampa #2 de MasMoney.
   */
  const ESPERA_LECTURA = 350;      // ms quieto antes de que salga la cruz
  const MINIMO_VENTANA = 15;       // días: más cerca que esto ya no dice nada

  /*
   * ⚠️ `redibujar(ventana)` tiene que volver a dibujar SOBRE EL MISMO <svg> y devolver el
   * nuevo `pintado`. Si el que llama repinta la pantalla entera, el elemento que el dedo
   * venía agarrando desaparece a media caricia y el arrastre se queda en un solo paso.
   * Pasó el 15-ago-2026 y no se nota en una prueba de un solo movimiento.
   */
  function interactuar(svg, opciones) {
    const { limites, ventana: inicial, redibujar, alLeer } = opciones;
    let ventana = { ...inicial };
    let pintado = opciones.pintado;
    const alMover = (v) => {
      if (v.desde === ventana.desde && v.hasta === ventana.hasta) return;
      ventana = v;
      pintado = redibujar(v) || pintado;
    };
    const punto = svg.createSVGPoint();
    const enX = (ev) => {
      punto.x = ev.clientX; punto.y = ev.clientY;
      return punto.matrixTransform(svg.getScreenCTM().inverse()).x;
    };

    const dedos = new Map();          // pointerId -> x en coordenadas del viewBox
    let modo = null;                  // 'espera' | 'leer' | 'mover' | 'pellizco'
    let arranque = null, reloj = null;

    const ancho = () => ventana.hasta - ventana.desde + 1;
    /* Cuántos días vale un paso horizontal. Con la ventana chica, un dedo mueve poco. */
    const diasPorUnidad = () => ancho() / (X1 - X0);

    /*
     * Cuánto aire se deja correr a la derecha del último precio. Marco lo pidió el
     * 16-ago-2026 señalando el "espacio sin precio" de TradingView: poder seguir arrastrando
     * aunque ya no haya velas. NO es asomarse al futuro — ahí no se dibuja nada, porque no
     * hay nada. El precio de mañana sigue sin existir para la gráfica.
     */
    const AIRE = 0.45;                // 45% del ancho de la ventana

    const mover = (desde, hasta) => {
      const largo = hasta - desde;
      const tope = limites.hasta + Math.round(largo * AIRE);
      // Hacia atrás sí hay pared dura: antes del primer dato no hay nada que enseñar.
      if (desde < limites.desde) { desde = limites.desde; hasta = desde + largo; }
      if (hasta > tope) { hasta = tope; desde = hasta - largo; }
      alMover({ desde: Math.max(limites.desde, Math.round(desde)), hasta: Math.round(hasta) });
    };

    const cancelarEspera = () => { clearTimeout(reloj); reloj = null; };

    svg.addEventListener('pointerdown', (ev) => {
      svg.setPointerCapture(ev.pointerId);
      dedos.set(ev.pointerId, enX(ev));
      if (dedos.size === 2) {
        cancelarEspera();
        const [a, b] = [...dedos.values()];
        modo = 'pellizco';
        arranque = { separacion: Math.abs(a - b) || 1, ...ventana };
        return;
      }
      modo = 'espera';
      arranque = { x: enX(ev), ...ventana };
      reloj = setTimeout(() => {
        modo = 'leer';
        alLeer(pintado.marcar(pintado.posEn(arranque.x)));
      }, ESPERA_LECTURA);
    });

    svg.addEventListener('pointermove', (ev) => {
      if (!dedos.has(ev.pointerId)) return;
      ev.preventDefault();
      dedos.set(ev.pointerId, enX(ev));

      if (modo === 'pellizco' && dedos.size === 2) {
        const [a, b] = [...dedos.values()];
        const razon = Math.max(0.15, Math.abs(a - b) / arranque.separacion);
        const centro = (arranque.desde + arranque.hasta) / 2;
        const medio = Math.max(MINIMO_VENTANA,
          Math.min(limites.hasta - limites.desde + 1,
                   (arranque.hasta - arranque.desde + 1) / razon)) / 2;
        mover(centro - medio, centro + medio);
        return;
      }
      if (dedos.size !== 1) return;

      const x = enX(ev);
      if (modo === 'espera' && Math.abs(x - arranque.x) > 3) { cancelarEspera(); modo = 'mover'; }
      if (modo === 'leer') { alLeer(pintado.marcar(pintado.posEn(x))); return; }
      if (modo !== 'mover') return;

      // Arrastrar a la derecha va HACIA ATRÁS en el tiempo, como en cualquier gráfica.
      const corrimiento = (arranque.x - x) * diasPorUnidad();
      mover(arranque.desde + corrimiento, arranque.hasta + corrimiento);
    });

    const soltar = (ev) => {
      dedos.delete(ev.pointerId);
      cancelarEspera();
      if (modo === 'leer') alLeer(pintado.marcar(null));
      if (dedos.size === 0) modo = null;
      else if (dedos.size === 1) {          // se levantó un dedo del pellizco
        modo = 'mover';
        arranque = { x: [...dedos.values()][0], ...ventana };
      }
    };
    svg.addEventListener('pointerup', soltar);
    svg.addEventListener('pointercancel', soltar);

    /* Rueda del ratón, para poder probarlo en la computadora sin dedos. */
    svg.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const razon = ev.deltaY > 0 ? 1.25 : 0.8;
      const centro = (ventana.desde + ventana.hasta) / 2;
      const medio = Math.max(MINIMO_VENTANA,
        Math.min(limites.hasta - limites.desde + 1, ancho() * razon)) / 2;
      mover(centro - medio, centro + medio);
    }, { passive: false });
  }

  /* La forma vieja, sin arrastre: solo leer. La sigue usando la gráfica de la cartera. */
  function seguirElDedo(svg, pintado, alMover) {
    const punto = svg.createSVGPoint();
    const aCoordenadas = (ev) => {
      punto.x = ev.clientX;
      punto.y = ev.clientY;
      return punto.matrixTransform(svg.getScreenCTM().inverse()).x;
    };
    const mover = (ev) => {
      ev.preventDefault();
      alMover(pintado.marcar(pintado.posEn(aCoordenadas(ev))));
    };
    const soltar = () => alMover(pintado.marcar(null));

    svg.addEventListener('pointerdown', (ev) => { svg.setPointerCapture(ev.pointerId); mover(ev); });
    svg.addEventListener('pointermove', (ev) => { if (svg.hasPointerCapture(ev.pointerId)) mover(ev); });
    svg.addEventListener('pointerup', soltar);
    svg.addEventListener('pointercancel', soltar);
  }

  return { ANCHO, ALTO, LETRA, MINIMO_VENTANA, MAX_VELAS,
           dibujar, seguirElDedo, interactuar, corto, decimalesDe, escalaY, pasoBonito,
           VISTAS, muestreo, muestreoVentana, ventanaDe, vistasDisponibles };
})();

</script>
<script>
'use strict';

/*
 * StocKids — la app.
 *
 * ⚠️ EL RELOJ ES EL ESTADO. Se guardan tres cosas y ninguna es un saldo:
 *      ancla        cuándo arrancó el juego
 *      diaTope      el día de bolsa más alto ya visto (trinquete: el mundo no retrocede)
 *      movimientos  cada compra y cada venta
 * El efectivo, las posiciones, las aportaciones y los dividendos SE DERIVAN. Si el niño no
 * abre la app en dos semanas, al volver el mundo avanzó igual y el dinero le llegó igual.
 *
 * ⚠️ SI CAMBIAS EL ESTADO, REPINTA TÚ (trampa #3 de MasMoney). Toda función que toca el
 * estado llama a `pintar()` antes de terminar. No se le deja al que llama.
 *
 * ⚠️ NADA DE `rAF` PARA EL RELOJ (trampa #4): no se entrega con la pantalla apagada ni en
 * segundo plano. El latido va con `setInterval`, y además se repinta al volver a la app.
 */

(async () => {

const DATOS = Datos.preparar(HORNEADO_PRECIOS);
const LOGOS = HORNEADO_LOGOS;
const ULTIMO = DATOS.n - 1;
const ARRANQUE = DATOS.arranque;      // 2015: lo de antes es historia, no partida

const fechaDe = (i) => new Date(DATOS.fechaMs(i));

/* Qué vista de la gráfica está puesta. No se guarda: es del momento, no de la partida. */
let vistaCartera = 'mes';
let vistaFicha = 'mes';
/* La ventana visible de la ficha. Los chips la fijan; arrastrar y pellizcar la mueven. */
let ventanaFicha = null;
let fichaDeLaVentana = null;

/*
 * El círculo del logo. Si la empresa trae imagen, va la imagen; si no, un círculo dibujado
 * con sus iniciales. El respaldo no es decorativo: si algún día hay que quitar los logos
 * por ser marcas registradas, basta con vaciar `datos/logos.json` y la app sigue viéndose
 * bien sola.
 */
function circulo(ticker, nombre, clase = '') {
  const l = LOGOS[ticker];
  if (l && l.img)
    return `<div class="logo ${clase}"><img src="${l.img}" alt="" loading="lazy"></div>`;
  const fondo = (l && l.fondo) || '#2a3442';
  const tinta = (l && l.tinta) || '#e8edf2';
  const letras = (l && l.letras) || escapar(nombre).slice(0, 1).toUpperCase();
  return `<div class="logo ${clase}" style="background:${fondo};color:${tinta}">
            <b>${letras}</b></div>`;
}

/* ⚠️ v2 al pasar de semanas a días (15-ago-2026). Los índices guardados en `movimientos`
   apuntaban a semanas y ahora son días: leer una partida vieja daría precios de otra época.
   Subir la versión la descarta limpio en vez de mostrar basura. */
const CLAVE = 'stockids.v2';
const CLAVE_TEMA = 'stockids.tema';    // aparte de la partida: es una preferencia, no estado

/*
 * El tema. "sistema" sigue al teléfono; los otros dos mandan. Se guarda aparte de la partida
 * a propósito: borrar la partida no debería cambiarle el color, y cambiar el color no debería
 * tocar sus movimientos.
 *
 * Como en MasMoney, se revisa por DOS caminos: el evento de la media query y otra revisada al
 * volver a la app. Si Android cambia a oscuro con StocKids en segundo plano, el evento puede
 * no llegar nunca.
 */
const sistemaOscuro = () =>
  !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
const temaElegido = () => localStorage.getItem(CLAVE_TEMA) || 'sistema';
const temaEfectivo = () => {
  const t = temaElegido();
  return t === 'sistema' ? (sistemaOscuro() ? 'oscuro' : 'claro') : t;
};
function aplicarTema() {
  const t = temaEfectivo();
  document.documentElement.setAttribute('data-tema', t);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content',
    getComputedStyle(document.documentElement).getPropertyValue('--fondo').trim());
}
let temaVisto = null;
function revisarTemaDelSistema() {
  if (temaElegido() !== 'sistema') return;
  const osc = sistemaOscuro();
  if (osc === temaVisto) return;          // no cambió: no repintar de gratis
  temaVisto = osc;
  aplicarTema();
  if (vista === 'ajustes') pintar();
}
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(
    revisarTemaDelSistema);
}
aplicarTema();
const SK_VER = '20260816-0804';    // sello para saber si ya llegó la versión nueva

/* Solo para que Marco pueda ver cualquier momento sin esperarse meses. No se guarda (el
   trinquete no se mueve), no se anuncia, y el niño no tiene por qué encontrarlo.
   Se acepta por `?dia=272` y también por `#dia=272`: al compartir un link la parte
   de `?` a veces se pierde y la de `#` no. */
const _busca = (clave) => new URLSearchParams(location.search).get(clave)
                       ?? new URLSearchParams(location.hash.slice(1)).get(clave);
/* Se acepta `dia` y también `fecha=2020-03-16`, que es como piensa una persona. `semana`
   sigue funcionando por los links que ya circulan, aunque ahora el índice sea de días. */
const ESPIA = (() => {
  const f = _busca('fecha');
  if (f) return String(Tiempo.ultimoDiaHasta(
    DATOS.dias, (Date.parse(f + 'T00:00:00Z') - DATOS.baseMs) / Datos.MS_DIA));
  return _busca('dia') ?? _busca('semana');
})();

/* --- lo que se guarda --------------------------------------------------- */

/* Devuelve null la primera vez: ahí va la bienvenida, y el reloj NO ha arrancado todavía.
   Importa que arranque cuando él diga "empezar" y no cuando alguien abra la página de
   curioso: si no, el mundo le corre dias que nunca vio. */
function cargar() {
  try {
    const g = JSON.parse(localStorage.getItem(CLAVE));
    if (g && typeof g.ancla === 'number' && Array.isArray(g.movimientos)) return g;
  } catch (e) { /* si está corrupto, se empieza de nuevo */ }
  return null;
}
/* En vista previa NO se guarda nada, ni siquiera una compra: asomarse a marzo 2020 no
   puede ensuciar la partida de verdad. */
function guardar() {
  if (ESPIA !== null) return;
  localStorage.setItem(CLAVE, JSON.stringify(estado));
}

const CENTAVO_MONTO = 0.01;
const NOMBRE_MAX = 18;

/* Quita espacios de más y pone mayúscula inicial a cada palabra, PERO no toca el resto:
   "diego" -> "Diego", "juan carlos" -> "Juan Carlos", y "JUAN" se queda "JUAN". Bajar todo
   a minúsculas primero arruinaría nombres como "McKenzie". */
const limpiarNombre = (s) => String(s || '')
  .replace(/\s+/g, ' ').trim().slice(0, NOMBRE_MAX)
  .replace(/(^|\s)(\p{L})/gu, (_, antes, letra) => antes + letra.toUpperCase());

let estado = cargar();

/* En vista previa sin partida empezada se arma una de mentiras, para poder asomarse a
   cualquier época sin tener que estrenar el juego. Como `guardar()` no escribe en modo
   espía, esta cartera se muere al cerrar la pestaña. */
if (!estado && ESPIA !== null) estado = { ...Cartera.nueva(Date.now()), nombre: 'Vista previa' };
let vista = 'cartera';
let fichaAbierta = null;
let hoja = null;              // {tipo:'comprar'|'vender', ticker, monto, error}
let leyendo = null;           // lo que dice el dedo sobre la gráfica

/* --- el reloj ----------------------------------------------------------- */

function reloj() {
  if (ESPIA !== null) {
    const s = Math.max(0, Math.min(+ESPIA | 0, ULTIMO));
    return { dia: s, avance: 0, msParaSiguiente: null, terminado: s >= ULTIMO,
             relojAtrasado: false };
  }
  return Tiempo.calcular({
    anclaMs: estado.ancla, ahoraMs: Date.now(),
    dias: DATOS.dias, arranque: ARRANQUE, diaTope: estado.diaTope,
  });
}

/* El trinquete se sube aquí y solo aquí. */
function adelantarTrinquete(r) {
  if (ESPIA === null && r.dia > estado.diaTope) {
    estado.diaTope = r.dia;
    guardar();
    return true;         // cambió de dia: hay algo nuevo que contarle
  }
  return false;
}

/* --- lo que pasó ESTA dia, derivado del reloj (sin guardar nada) ------ */

function novedades(dia) {
  if (dia <= 0) return { aportacion: 0, dividendos: 0, estrenos: [] };
  const hoy = Cartera.calcular(estado, DATOS, dia);
  const ayer = Cartera.calcular(estado, DATOS, dia - 1);
  return {
    aportacion: (hoy.aportaciones - ayer.aportaciones) * Cartera.APORTACION,
    dividendos: hoy.dividendos - ayer.dividendos,
    estrenos: DATOS.empresas.filter(e => e.desde === dia),
  };
}

/* --- ayudas de formato --------------------------------------------------- */

const $ = (sel, raiz = document) => raiz.querySelector(sel);
const dinero = Cartera.dinero;
/* Sin signo cuando redondea a cero: un "+0.0%" se lee como error, no como quieto. */
const conSigno = n => `${Math.abs(n) < 0.005 ? '' : n > 0 ? '+' : '−'}${dinero(Math.abs(n))}`;
const pct = n => `${Math.abs(n) < 0.05 ? '' : n > 0 ? '+' : '−'}${Math.abs(n).toFixed(1)}%`;
const clase = n => n >= 0 ? 'sube' : 'baja';
const escapar = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/*
 * Lo que se movió el precio desde el día de bolsa anterior, en dinero y en porcentaje.
 *
 * En el PRIMER día no hay con qué comparar, y devolver "nada" dejaba la lista sin un
 * solo porcentaje justo el día que estrena la app — se veía a medias (lo cachó Marco el
 * 15-ago-2026). Se devuelve cero y marcado como estreno, que además es la verdad: desde
 * que empezó, todavía no se ha movido.
 */
function movimiento(ticker, dia) {
  const hoy = Cartera.precio(DATOS, ticker, dia);
  if (hoy === null) return null;                          // todavía no cotiza
  const antes = dia > 0 ? Cartera.precio(DATOS, ticker, dia - 1) : null;
  if (antes === null) return { abs: 0, pct: 0, estrena: true };
  return { abs: hoy - antes, pct: (hoy / antes - 1) * 100, estrena: false };
}

/* Verde si sube, rojo si baja, gris si no se ha movido o si apenas estrena. */
const colorDe = (m) =>
  m.estrena || Math.abs(m.pct) < 0.005 ? 'quieto' : (m.pct > 0 ? 'sube' : 'baja');

const pintarMovimiento = (m) => m === null ? '' :
  `<div class="mueve ${colorDe(m)}"><span>${conSigno(m.abs)}</span>${pct(m.pct)}</div>`;

/* --- la primera vez ------------------------------------------------------ */

/*
 * Sale en dos casos, y la diferencia importa:
 *   - partida nueva: aquí ARRANCA el reloj, al tocar el botón.
 *   - partida ya empezada pero sin nombre: son los que ya venían jugando desde antes de que
 *     existiera esta pantalla. Hay que preguntarles igual, pero SIN tocarles el reloj ni los
 *     movimientos. Si no, se quedaban para siempre con "El dinero de undefined" y un lapicito
 *     que nadie ve (le pasó a Marco el 15-ago-2026).
 */
function pintarBienvenida() {
  const siguiendo = !!estado;

  document.querySelector('header').style.display = 'none';
  document.querySelector('nav').style.display = 'none';
  $('#vista').innerHTML = `
    <div class="bienvenida">
      <div class="logo">Stoc<span>Kids</span></div>
      ${siguiendo ? `
        <p class="trato">Tu dinero ya viene corriendo. Solo falta una cosa:
        <b>¿de quién es?</b></p>`
      : `
        <p class="trato">Vas a empezar con <b>$1,000</b> en enero de <b>2015</b>, y la bolsa va
        a correr sola: <b>cada mes que pase aquí afuera es un año allá adentro</b>. Un precio
        nuevo cada 14 horas, con lo que de verdad pasó.</p>
        <p class="trato">No hay prisa. Esto no se gana comprando y vendiendo rápido.</p>`}
      <label for="nombreInput">¿Cómo te llamas?</label>
      <input id="nombreInput" type="text" autocomplete="given-name" enterkeyhint="go"
             maxlength="${NOMBRE_MAX}" placeholder="Tu nombre" autocapitalize="words">
      <p class="aguas">Se queda en este teléfono. Nadie más lo ve, y no se manda a ningún lado.</p>
      <button id="empezar" disabled>${siguiendo ? 'Continuar' : 'Empezar'}</button>
    </div>`;

  const caja = $('#nombreInput'), boton = $('#empezar');
  // Se conectan a mano y NO se repinta al teclear: repintar le tumbaría el teclado.
  const revisar = () => { boton.disabled = limpiarNombre(caja.value).length < 2; };
  caja.addEventListener('input', revisar);
  caja.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') boton.click(); });
  boton.addEventListener('click', () => {
    const nombre = limpiarNombre(caja.value);
    if (nombre.length < 2) return;
    if (siguiendo) estado.nombre = nombre;      // no se le toca el reloj ni lo que compró
    // AQUÍ arranca el mundo, no cuando se abrió la página.
    else estado = { ...Cartera.nueva(Date.now()), nombre };
    guardar();
    document.querySelector('header').style.display = '';
    document.querySelector('nav').style.display = '';
    pintar();                    // si cambias el estado, repinta TÚ (trampa #3)
  });
  caja.focus();
}

/* El contador de arriba a la derecha. Vive aparte porque lo usan el repintado completo y el
   latido, y ya se había duplicado una vez. */
function encabezadoReloj(r) {
  const barra = `<div class="barrita"><i style="width:${(r.avance * 100).toFixed(1)}%"></i></div>`;
  if (ESPIA !== null) return 'vista previa<br>el reloj no corre';
  if (r.terminado) return 'hasta aquí llega<br>la historia';
  // En fin de semana la bolsa está cerrada: no es que la app esté trabada.
  if (r.cerrado) return 'la bolsa está<br>cerrada allá' + barra;
  return `próximo precio<br>en ${Tiempo.cuantoFalta(r.msParaSiguiente)}` + barra;
}

/* --- pintar -------------------------------------------------------------- */

function pintar() {
  // Sin nombre tampoco se pinta la app: los que ya venían jugando desde antes también
  // tienen que pasar por la pregunta.
  if (!estado || !estado.nombre) { pintarBienvenida(); return; }

  const r = reloj();
  adelantarTrinquete(r);
  const dia = r.dia;

  $('#epoca').textContent = Tiempo.comoTexto(fechaDe(dia), true) +
    (r.cerrado ? ' · bolsa cerrada' : '');
  $('#cuenta').innerHTML = encabezadoReloj(r);

  for (const b of document.querySelectorAll('nav button'))
    b.classList.toggle('puesto', b.dataset.ir === vista);

  const main = $('#vista');
  if (fichaAbierta) pintarFicha(main, dia);
  else if (vista === 'mercado') pintarMercado(main, dia);
  else if (vista === 'ajustes') pintarAjustes(main, r);
  else pintarCartera(main, dia, r);

  main.insertAdjacentHTML('beforeend', `<div class="sello_ver">StocKids ${SK_VER}</div>`);
  pintarHoja(dia);
}

    <div class="claves">
      <div class="clave"><i class="bolita" style="background:var(--verde)"></i>Tu dinero</div>
      <div class="clave"><i class="bolita" style="background:var(--ambar)"></i>Lo que metiste</div>
      <div class="clave"><i class="bolita" style="background:var(--gris)"></i>Sin escoger nada</div>
    </div>
    <div class="leido" id="leido"></div>
    <div class="tarjetas">
      <div class="tarjeta"><i>Invertido</i><b>${dinero(foto.enEmpresas)}</b></div>
      <div class="tarjeta"><i>Sin invertir</i><b>${dinero(foto.efectivo)}</b></div>

      : `<div class="vacio">

/* Estas dos no dependen de los movimientos, así que se calculan una sola vez. */
let _spy = null, _metido = null;
const serieSPY = () => _spy || (_spy = Cartera.serieReferencia(DATOS, ULTIMO));
const serieMetido = () => _metido || (_metido = Array.from(
  { length: ULTIMO - ARRANQUE + 1 },
  (_, k) => Cartera.CAPITAL_INICIAL
    + Cartera.aportacionesA(DATOS, ARRANQUE + k) * Cartera.APORTACION));

      <h3>${escapar(estado.nombre)}</h3>
      <p>Empezaste el <b>${new Date(estado.ancla).toLocaleDateString('es-MX',
          { day: 'numeric', month: 'long', year: 'numeric' })}</b> y llevas
        <b>${estado.movimientos.length}</b> ${estado.movimientos.length === 1
          ? 'movimiento' : 'movimientos'}.</p>
      <p style="margin-top:9px">Todo vive en este teléfono y no sale de aquí.
        No hay botón de empezar de nuevo, y es a propósito: en la bolsa de verdad tampoco
        se puede deshacer.</p>
    </div>`;

  /* Igual que en MasMoney: tirar la caché y desregistrar el service worker, porque ahí vive
     el index.html viejo. El parámetro al recargar obliga a pedirle el archivo al servidor. */
  $('#buscarAct').addEventListener('click', async () => {
    const b = $('#buscarAct');
    b.textContent = 'Buscando…';
    b.disabled = true;
    try {
      if (window.caches) {
        const llaves = await caches.keys();
        await Promise.all(llaves.map(k => caches.delete(k)));
      }
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch (e) { /* si algo falla, se recarga igual */ }
    location.replace(location.pathname + '?act=' + Date.now());
  });
}

/* --- vista: la bolsa ----------------------------------------------------- */

function pintarMercado(main, dia) {
  const foto = Cartera.calcular(estado, DATOS, dia);
  const mias = new Map(foto.posiciones.map(p => [p.ticker, p]));

  // Las que todavía no salen a bolsa NO se enseñan. Que aparezcan solas es la lección.
  const disponibles = DATOS.empresas.filter(e => e.desde <= dia);
  // Por TICKER, no por nombre: el ticker es lo que se lee grande, y ordenar por el nombre
  // escondido hace que la lista se vea revuelta. Las canastas van al final.
  const orden = { empresa: 0, canasta: 1 };
  disponibles.sort((a, b) => (orden[a.tipo] - orden[b.tipo]) || a.ticker.localeCompare(b.ticker));

  main.innerHTML = `
    <div class="titulo">Puedes comprar ${disponibles.length} cosas · tienes ${dinero(foto.efectivo)}</div>
    <div class="lista">${disponibles.map(e => {
      const px = Cartera.precio(DATOS, e.ticker, dia);
      // Un precio por día hábil: en fin de semana la bolsa está cerrada y no se mueve.
      const mueve = pintarMovimiento(movimiento(e.ticker, dia));
      return `<button class="fila" data-ficha="${e.ticker}">
        ${circulo(e.ticker, e.nombre)}
        <div class="quien">
          <div class="tick">${e.ticker}
            ${mias.has(e.ticker) ? '<span class="sello">TUYA</span>' : ''}</div>
          <div class="nombre_chico">${escapar(e.nombre)}</div>
        </div>
        <div class="cuanto"><b>${dinero(px)}</b>${mueve}</div>
      </button>`;
    }).join('')}</div>`;
}

  const mia = foto.posiciones.find(p => p.ticker === e.ticker);
  const px = Cartera.precio(DATOS, e.ticker, dia);
  const m = movimiento(e.ticker, dia);

  // Los pagos que ya ocurrieron. Nunca los del futuro.

    ${(() => {
      const partidas = (e.splits || []).filter(([d]) => d <= dia);

      for (const [, razon] of partidas) {

      }
      const cuando = DATOS.fecha(partidas[partidas.length - 1][0]).slice(0, 4);
      // Sin esto, el niño ve NVIDIA a 15 centavos en 2008 y cree que eso costaba. No costaba
      // eso: se partió 40 veces. Lo cachó Marco el 15-ago-2026 viendo la escala del eje.
      return `<div class="reparto partida">

    ${pagados.length ? `<div class="reparto">

    <div class="acciones">

  // La gráfica del precio arranca cuando la empresa salió a bolsa, no antes.
  const svg = $('#lienzoFicha');
  // Ojo: aquí la gráfica arranca en `e.desde`, o sea en 2008 para casi todas. Eso es a

  // Al cambiar de empresa o de chip se vuelve a la ventana del chip; si el niño ya arrastró,

  if (fichaDeLaVentana !== e.ticker + vistaFicha) {

    fichaDeLaVentana = e.ticker + vistaFicha;
  }
  // Ojo: NO se recorta `ventanaFicha.hasta` al día de hoy. Puede pasarse, y ese pedazo se
  // dibuja vacío (el "espacio sin precio"). Lo que no puede pasarse es lo que se DIBUJA, y
